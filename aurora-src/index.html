<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>YouChat — мессенджер</title>
<meta name="description" content="YouChat — тёмный мессенджер с группами, живыми баннерами и профилями.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09090a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop stop-color='%232f6bff'/%3E%3Cstop offset='1' stop-color='%238a2df0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9.4 20.4c-1.1-.5-1-2 .1-3.2 1.9-2 4.9-3.8 7.2-4.9 1.9-.9 2.9.9 1.6 2.5-1.2 1.5-3.9 3-5.9 4.1-1.3.7-2.2 1.6-3 1.5z' fill='%23fff'/%3E%3Cpath d='M22.6 11.6c1.1.5 1 2-.1 3.2-1.9 2-4.9 3.8-7.2 4.9-1.9.9-2.9-.9-1.6-2.5 1.2-1.5 3.9-3 5.9-4.1 1.3-.7 2.2-1.6 3-1.5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="chat.css">
<link rel="stylesheet" href="overlays.css">
<link rel="stylesheet" href="responsive.css">
<link rel="stylesheet" href="social.css">
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="net.css">
</head>
<body class="app-booting">
<div class="app" id="app">
  <h1 class="sr-only">YouChat — мессенджер: беседы, группы и профили</h1>

  <nav class="rail" aria-label="Разделы мессенджера">
    <button class="rail-logo" id="railHome" aria-label="YouChat — все беседы" data-tip="Все беседы">
      <i class="logo-art rail-logo-art" aria-hidden="true"></i>
    </button>
    <div class="rail-sep" aria-hidden="true"></div>
    <button class="rail-btn is-active" id="railAll" data-view="all" aria-label="Все беседы" data-tip="Все беседы">
      <svg class="icon" aria-hidden="true"><use href="#i-dm"/></svg>
    </button>
    <button class="rail-btn" id="railGroups" data-view="groups" aria-label="Группы" data-tip="Группы">
      <svg class="icon" aria-hidden="true"><use href="#i-users"/></svg>
    </button>
    <button class="rail-btn rail-add" id="railCreate" aria-label="Создать группу" data-tip="Создать группу">
      <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
    </button>
    <div class="rail-sep" aria-hidden="true"></div>
    <div class="rail-shortcuts" id="railShortcuts"></div>
    <div class="rail-spacer"></div>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <button class="brand" id="brandBtn" aria-label="YouChat">
        <span class="brand-mark logo-art" aria-hidden="true"></span>
        <span class="brand-text"><span class="brand-name">YouChat</span><span class="brand-tag">beta</span></span>
      </button>
      <button class="icon-btn brand-new" id="btnFindPeople" aria-label="Найти людей" data-tip="Найти людей по @username">
        <svg class="icon" aria-hidden="true"><use href="#i-user-plus"/></svg>
      </button>
      <button class="icon-btn brand-new" id="btnNewGroup" aria-label="Создать группу" data-tip="Создать группу">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
      </button>
    </div>

    <div class="side-search">
      <label class="search-field">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="convFilter" type="search" placeholder="Поиск бесед" autocomplete="off" aria-label="Поиск бесед">
        <kbd>Ctrl K</kbd>
      </label>
    </div>

    <div class="side-scroll" id="convList" role="list" aria-label="Список бесед"></div>

    <div class="side-foot">
      <button class="me-card" id="meCard" aria-label="Открыть меню профиля">
        <span class="me-av" id="meAvatar"></span>
        <span class="me-meta">
          <span class="me-name" id="meName"></span>
          <span class="me-sub" id="meStatus"></span>
        </span>
        <svg class="icon me-chev" aria-hidden="true"><use href="#i-chev"/></svg>
      </button>
      <div class="me-tools">
        <button class="icon-btn sm" id="btnMic" aria-label="Микрофон" data-tip="Микрофон">
          <svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg>
        </button>
        <button class="icon-btn sm" id="btnSound" aria-label="Звук" data-tip="Звук">
          <svg class="icon" aria-hidden="true"><use href="#i-headphones"/></svg>
        </button>
        <button class="icon-btn sm" id="btnPrefs" aria-label="Настройки" data-tip="Настройки">
          <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="chat" id="chat" aria-label="Переписка">
    <header class="chat-head">
      <button class="icon-btn back" id="btnBack" aria-label="Назад к беседам">
        <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>
      </button>
      <button class="chat-title" id="chatTitleBtn" aria-label="Информация о беседе">
        <span class="chat-av" id="chatAvatar"></span>
        <span class="chat-title-text">
          <span class="chat-name-row"><span class="chat-name" id="chatName">YouChat</span><svg class="icon chat-chev" aria-hidden="true"><use href="#i-chev"/></svg></span>
          <span class="chat-sub" id="chatSub"></span>
        </span>
      </button>
      <div class="chat-tools">
        <div class="msg-search" id="msgSearchWrap" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="msgSearch" type="search" placeholder="Поиск в беседе" aria-label="Поиск в беседе" autocomplete="off">
          <span class="msg-search-count" id="msgSearchCount"></span>
          <button class="icon-btn xs" id="msgSearchClose" aria-label="Закрыть поиск">
            <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
          </button>
        </div>
        <button class="icon-btn" id="btnPins" aria-label="Закреплённые сообщения" data-tip="Закреплённые">
          <svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg>
        </button>
        <button class="icon-btn" id="btnSearch" aria-label="Поиск в беседе" data-tip="Поиск">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        </button>
        <button class="icon-btn" id="btnMembers" aria-label="Панель участников" data-tip="Участники" aria-pressed="true">
          <svg class="icon" aria-hidden="true"><use href="#i-users"/></svg>
        </button>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner">
        <section class="intro" id="chatIntro" aria-label="О беседе"></section>
        <div class="messages" id="messages" aria-live="polite"></div>
      </div>
    </div>

    <div class="composer-area" id="composerArea">
      <div class="sel-bar" id="selBar" hidden></div>
      <div class="edit-chip" id="editChip" hidden></div>
      <div class="reply-chip" id="replyChip" hidden></div>
      <div class="pending" id="pending"></div>
      <form class="composer" id="composer" autocomplete="off">
        <button type="button" class="comp-btn" id="btnAttach" aria-label="Прикрепить фото или видео" data-tip="Прикрепить">
          <svg class="icon" aria-hidden="true"><use href="#i-clip"/></svg>
        </button>
        <label class="sr-only" for="composerInput">Сообщение</label>
        <textarea id="composerInput" rows="1" maxlength="4000" placeholder="Написать сообщение"></textarea>
        <button type="button" class="comp-btn" id="btnEmoji" aria-label="Эмодзи" data-tip="Эмодзи">
          <svg class="icon" aria-hidden="true"><use href="#i-smile"/></svg>
        </button>
        <button type="button" class="comp-btn" id="btnMicRec" aria-label="Голосовое сообщение — удерживайте для записи" data-tip="Удерживайте: голосовое">
          <svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg>
        </button>
        <button type="button" class="comp-btn" id="btnRound" aria-label="Кружок — удерживайте для записи" data-tip="Удерживайте: кружок">
          <svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg>
        </button>
        <button type="submit" class="send-btn" id="btnSend" aria-label="Отправить сообщение">
          <svg class="icon" aria-hidden="true"><use href="#i-arrow-up"/></svg>
        </button>
      </form>
      <div class="composer-hint"><b>Enter</b> — отправить · <b>Shift + Enter</b> — новая строка</div>
    </div>
  </main>

  <aside class="members" id="membersPanel" aria-label="Участники беседы"></aside>
</div>

<div class="recorder" id="recorder" hidden></div>

<div class="popover" id="popover" hidden></div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Просмотр медиа" hidden>
  <div class="lb-head">
    <div class="lb-meta" id="lbMeta"></div>
    <div class="lb-actions">
      <button class="icon-btn" id="lbDownload" aria-label="Скачать" data-tip="Скачать">
        <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
      </button>
      <button class="icon-btn" id="lbClose" aria-label="Закрыть просмотр">
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>
  </div>
  <button class="lb-nav prev" id="lbPrev" aria-label="Предыдущее медиа">
    <svg class="icon" aria-hidden="true"><use href="#i-chev-left"/></svg>
  </button>
  <div class="lb-stage" id="lbStage"></div>
  <button class="lb-nav next" id="lbNext" aria-label="Следующее медиа">
    <svg class="icon" aria-hidden="true"><use href="#i-chev-right"/></svg>
  </button>
  <div class="lb-foot" id="lbFoot"></div>
</div>

<div class="modal-layer" id="modalLayer" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="filePicker" accept="image/*,video/*" multiple hidden aria-label="Прикрепить фото или видео">
<div class="emoji-pop" id="emojiPop" hidden></div>

</html>
