/* styles.css */
:root{
  --bg-0:#09090a;
  --bg-1:#111112;
  --bg-2:#0b0b0d;
  --bg-3:#151517;
  --bg-4:#1e1e21;
  --ink:#ecebe7;
  --ink-2:#b6b4ae;
  --muted:#85847e;
  --faint:#63625d;
  --line:rgba(255,255,255,.055);

  --accent:#e8e4da;

  --green:#93b59c;
  --amber:#c9a86c;
  --red:#c98a86;
  --grad:linear-gradient(140deg,#f2efe8,#cfc9bd);
  --r-sm:6px;
  --r-md:9px;
  --r-lg:12px;
  --r-xl:16px;
  --shadow-1:0 8px 24px rgba(0,0,0,.35);

  --font:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg-0);color:var(--ink);font-family:var(--font);font-size:15px;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(90% 55% at 50% -12%,rgba(255,255,255,.03),transparent 62%);
}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}
button{font-family:inherit}
input,textarea{font-family:inherit}
a{color:var(--ink)}
::selection{background:rgba(255,255,255,.2);color:#fff}
:focus-visible{outline:1.5px solid rgba(255,255,255,.45);outline-offset:2px}
[hidden]{display:none !important}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.13) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.11);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2);background-clip:content-box}

[data-tip]{position:relative}
[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
  background:#1a1a1c;border:1px solid var(--line-2);color:var(--ink);font-size:11.5px;font-weight:500;
  padding:5px 8px;border-radius:6px;white-space:nowrap;z-index:90;pointer-events:none;
  box-shadow:0 10px 26px rgba(0,0,0,.5);animation:fadeIn .14s ease;
}

.app{
  position:relative;z-index:1;display:grid;grid-template-columns:72px 288px minmax(0,1fr) auto;
  height:100dvh;height:100vh;overflow:hidden;
}

.avatar{
  --s:40px;position:relative;flex:none;width:var(--s);height:var(--s);border-radius:50%;
  display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(155deg,var(--g1,#e9e5dc),var(--g2,#cbc5b8));
  color:#1a1a1b;font-weight:600;font-size:calc(var(--s) * .32);letter-spacing:.01em;line-height:1;
}
.avatar > span{position:relative;z-index:1}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}

.gicon{
  --s:44px;position:relative;flex:none;width:var(--s);height:var(--s);border-radius:26%;
  display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(155deg,var(--g1,#e9e5dc),var(--g2,#cbc5b8));
  color:#1a1a1b;font-weight:600;font-size:calc(var(--s) * .34);letter-spacing:.01em;
}
.gicon > span{position:relative;z-index:1}

.av-wrap{position:relative;flex:none;display:inline-grid;place-items:center}
.av-status{
  position:absolute;right:-1px;bottom:-1px;width:max(9px,30%);height:max(9px,30%);
  border-radius:50%;background:var(--st,#6b6b6b);border:2.5px solid var(--st-border,var(--bg-1));
  z-index:2;
}
[data-st="online"]{--st:#93b59c}
[data-st="idle"]{--st:#c9a86c}
[data-st="dnd"]{--st:#c98a86}
[data-st="offline"]{--st:#6b6b6b}

.banner{position:absolute;inset:0;overflow:hidden;background:#0e0e10;isolation:isolate}
.banner.has-img{background-size:cover;background-position:center;background-repeat:no-repeat}
.banner > i{position:absolute;inset:-25%;display:block;will-change:transform}

.rail{
  display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0;
  background:var(--bg-0);border-right:1px solid var(--line);
  position:relative;z-index:3;
}
.rail-logo{
  width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);
  background:#141416;
  display:grid;place-items:center;cursor:pointer;padding:0;
  transition:background .18s ease,border-color .18s ease;
}
.rail-logo svg{width:30px;height:30px;display:block}
.rail-logo:hover{background:#1a1a1d;border-color:rgba(255,255,255,.18)}
.rail-sep{width:26px;height:1px;background:var(--line);margin:3px 0;flex:none}
.rail-spacer{flex:1}
.rail-btn{
  width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;
  color:var(--muted);display:grid;place-items:center;cursor:pointer;position:relative;padding:0;
  transition:background .16s ease,color .16s ease,border-radius .16s ease;
}
.rail-btn:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.rail-btn.is-active{
  background:#212124;color:var(--ink);border-color:var(--line-2);border-radius:12px;
}
.rail-btn.is-active::before,.rail-shortcut.is-active::before{
  content:"";position:absolute;left:-13px;top:50%;transform:translateY(-50%);
  width:2px;height:20px;border-radius:0 2px 2px 0;background:var(--accent);
}
.rail-add{color:var(--muted);background:transparent;border-color:var(--line)}
.rail-add:hover{background:rgba(255,255,255,.05);color:var(--ink);border-color:var(--line-2)}
.rail-shortcuts{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%}
.rail-shortcut{
  width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.07);padding:0;
  display:grid;place-items:center;cursor:pointer;position:relative;font:inherit;font-weight:600;font-size:15px;color:#1a1a1b;
  background:linear-gradient(155deg,var(--g1),var(--g2));transition:transform .16s ease,filter .16s ease;
}
.rail-shortcut:hover{transform:translateY(-1px);filter:brightness(1.04)}
.rail-shortcut.is-active{border-radius:12px;box-shadow:0 0 0 2px var(--bg-0),0 0 0 3px rgba(232,228,218,.65)}
.rail-avatar{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);padding:0;
  background:none;cursor:pointer;display:grid;place-items:center;transition:border-color .16s ease;
}
.rail-avatar:hover{border-color:rgba(255,255,255,.24)}
.rail-avatar .avatar{--s:36px}

.brand{

  padding:3px 4px;border-radius:8px;cursor:pointer;text-align:left;

.brand-mark{width:30px;height:30px;border-radius:9px;border:0;padding:0}
.rail-logo-art{width:30px;height:30px;border-radius:8px}
.brand-text{display:flex;align-items:center;gap:7px;min-width:0}
.brand-name{font-size:16.5px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.brand-tag{
  font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  border:1px solid var(--line-2);padding:1px 5px;border-radius:4px;
}
.brand-new{width:30px;height:30px;border-radius:8px;background:transparent;border:1px solid var(--line);color:var(--muted)}
.brand-new:hover{background:rgba(255,255,255,.05);color:var(--ink);border-color:var(--line-2)}
.brand-new .icon{width:16px;height:16px}

.side-search{padding:10px 12px 6px;flex:none}
.search-field{
  display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:8px;
  background:#161618;border:1px solid var(--line);transition:border-color .16s;
}
.search-field:focus-within{border-color:rgba(255,255,255,.2)}
.search-field .icon{width:15px;height:15px;color:var(--faint)}
.search-field input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-size:13px}
.search-field input::placeholder{color:var(--faint)}
.search-field input::-webkit-search-cancel-button{display:none}
.search-field kbd{
  font:inherit;font-size:9.5px;color:var(--faint);border:1px solid var(--line-2);
  padding:1px 4px;border-radius:4px;white-space:nowrap;
}

.side-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 8px 14px}
.side-label{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:14px 10px 6px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
}
.side-label span:last-child{font-weight:500;letter-spacing:0;color:#55544f}
.conv{
  display:flex;align-items:center;gap:10px;padding:8px 9px;min-height:58px;border-radius:9px;
  border:1px solid transparent;cursor:pointer;position:relative;user-select:none;
  transition:background .14s ease,border-color .14s ease;
}
.conv:hover{background:rgba(255,255,255,.035)}
.conv.is-active{
  background:rgba(255,255,255,.055);border-color:var(--line);
}
.conv.is-active::before{
  content:"";position:absolute;left:-8px;top:16px;bottom:16px;width:2px;border-radius:2px;
  background:var(--accent);opacity:.85;
}
.conv-av .avatar{--s:38px}
.conv-av .gicon{--s:38px}
.conv-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.conv-row{display:flex;align-items:center;gap:7px;min-width:0}
.conv-name{flex:1;min-width:0;font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.005em}
.conv.unread .conv-name{font-weight:600;color:var(--ink)}
.conv.is-active .conv-name{color:var(--ink)}
.conv-time{font-size:10px;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.conv-pin{display:inline-flex;color:var(--faint);flex:none}
.conv-pin .icon{width:11px;height:11px}
.conv-prev{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.unread .conv-prev{color:var(--ink-2)}

  background:var(--accent);border-color:transparent;color:#151517;font-weight:600;
}
.btn.primary:hover{background:#f4f1ea}
.btn.ghost{background:transparent}
.btn.danger{color:#e0a9a5;border-color:rgba(201,138,134,.3);background:rgba(201,138,134,.07)}

.dot{width:6px;height:6px;border-radius:50%;background:var(--st,#93b59c);flex:none}
[data-st="online"].dot{background:var(--green)}
[data-st="idle"].dot{background:var(--amber)}

[data-st="offline"].dot{background:#6b6b6b}
.status-pill{

.tabs{display:flex;gap:2px;padding:0 2px;margin:0 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{

}

  background:var(--accent);
}

.modal-layer{position:fixed;inset:0;z-index:120}

.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);animation:fadeIn .2s ease}
.modal{

}
.modal-close:hover{background:rgba(255,255,255,.14);color:#fff}
.modal-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}

.mc-banner{position:relative;height:150px;flex:none}

.mc-desc{font-size:13px;line-height:1.65;color:var(--ink-2);margin:12px 0 0;white-space:pre-wrap}

.tab-empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:12.5px}
.mem-list{display:flex;flex-direction:column;gap:2px}

}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px}

}

}

.popover{

  background:#17171a;border:1px solid rgba(255,255,255,.1);

}
.popover[hidden]{display:none}
.pop-banner{position:relative;height:68px}

.pop-av{display:inline-flex;flex:none}
.pop-name{margin:8px 0 0;font-size:15.5px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pop-handle{margin-top:2px;font-size:11.5px;color:var(--muted)}
.pop-status{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11.5px;color:var(--ink-2)}
.pop-bio{
  margin:9px 0 0;padding-top:9px;border-top:1px solid var(--line);font-size:11.75px;line-height:1.55;color:var(--ink-2);

}

.popover.is-menu{width:226px;background:#17171a;padding:6px;border-radius:10px}
.menu-title{padding:6px 9px 4px;font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.menu-item{
  width:100%;display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:6px;border:none;background:none;
  color:var(--ink-2);font-size:12.75px;text-align:left;cursor:pointer;
}
.menu-item:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.menu-item.danger{color:#e0a9a5}
.menu-item.danger:hover{background:rgba(201,138,134,.1)}
.menu-item .icon{width:15px;height:15px;color:var(--muted)}
.menu-item.danger .icon{color:#e0a9a5}

.emoji-menu{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:2px}

  height:32px;border:none;background:none;border-radius:6px;font-size:17px;line-height:1;cursor:pointer;padding:0;
}
.emoji-menu button:hover{background:rgba(255,255,255,.07)}

.emoji-pop{
  position:fixed;z-index:160;width:300px;max-width:calc(100vw - 16px);padding:10px;border-radius:11px;
  background:#1a1a1d;border:1px solid var(--line-2);box-shadow:var(--shadow-2);animation:popIn .15s ease;
}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-height:250px;overflow-y:auto}

  height:32px;border:none;background:none;border-radius:6px;font-size:18px;line-height:1;cursor:pointer;padding:0;
}
.emoji-grid button:hover{background:rgba(255,255,255,.07)}
.emoji-pop-label{font-size:9px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:2px 4px 7px}

.field{margin-bottom:14px}
.flabel{display:block;margin-bottom:6px;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.input,textarea.input{
  width:100%;padding:9px 11px;border-radius:8px;background:#131315;border:1px solid var(--line-2);
  color:var(--ink);font-size:13px;outline:none;transition:border-color .15s;
}
.input::placeholder{color:var(--faint)}
.input:focus{border-color:rgba(255,255,255,.24)}
textarea.input{resize:vertical;min-height:76px;line-height:1.6}
.input.err{border-color:rgba(201,138,134,.6)}
.hint{margin-top:5px;font-size:10.5px;color:var(--faint);line-height:1.5}
.err-text{display:none;margin-top:5px;font-size:11px;color:#e0a9a5}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  height:29px;padding:0 11px;border-radius:7px;border:1px solid var(--line-2);background:transparent;
  color:var(--ink-2);font-size:11.75px;cursor:pointer;
}
.chip:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.chip.is-active{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.22);color:var(--ink)}

.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{
  width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.1);cursor:pointer;padding:0;
  background:linear-gradient(155deg,var(--g1),var(--g2));
}
.swatch:hover{filter:brightness(1.05)}
.swatch.is-active{border-color:#fff;box-shadow:0 0 0 2px var(--bg-3),0 0 0 3px rgba(255,255,255,.5)}

.pick{
  display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;
  border:1px solid transparent;
}
.pick:hover{background:rgba(255,255,255,.04)}
.pick.is-on{background:rgba(255,255,255,.05);border-color:var(--line)}
.pick input{width:15px;height:15px;margin-left:auto;accent-color:#d6d2c8;cursor:pointer}
.pick-meta{flex:1;min-width:0}
.pick-name{font-size:12.75px;font-weight:500}
.pick-sub{font-size:10.5px;color:var(--faint)}

.bn-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.bn-opt{

  background:#0f0f11;cursor:pointer;transition:border-color .15s;
}

.bn-opt.is-active{border-color:transparent;outline:1.5px solid var(--accent);outline-offset:2px}

  font-size:10px;font-weight:500;color:#fff;background:linear-gradient(180deg,transparent,rgba(0,0,0,.65));
}
.bn-kind{

  padding:1px 4px;border-radius:3px;color:#e6e4df;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(4px);
}
.bn-tick{
  position:absolute;top:5px;left:5px;z-index:3;width:17px;height:17px;border-radius:50%;
  background:var(--accent);color:#151517;display:grid;place-items:center;
}
.bn-tick .icon{width:11px;height:11px;stroke-width:3}
.bn-tabs{display:flex;gap:4px;padding:3px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid var(--line);margin-bottom:4px}
.bn-tab{flex:1;height:28px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:11.5px;cursor:pointer;transition:background .15s,color .15s}

.bn-tab.is-on{background:rgba(255,255,255,.09);color:var(--ink)}
.bn-gallery{display:flex;flex-direction:column;gap:10px;padding:6px 0 2px}
.bn-shot{height:112px;border-radius:11px;overflow:hidden;border:1px dashed var(--line-2);display:grid;place-items:center;color:var(--faint);font-size:11.5px;background:rgba(255,255,255,.02);text-align:center;padding:12px}
.bn-shot img{width:100%;height:100%;object-fit:cover;display:block}
.bn-gallery-actions{display:flex;gap:8px;flex-wrap:wrap}
.field-note{font-size:11px;color:var(--faint);margin-top:5px;min-height:14px;line-height:1.3}
.field-note.ok{color:#a9c3a1}
.field-note.bad{color:#e0a9a5}
.field-note.warn{color:#cdb389}
.av-pick-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.editor-preview{
  position:relative;border-radius:11px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px;background:#141416;
}
.ep-banner{position:relative;height:112px}
.ep-row{display:flex;align-items:flex-end;gap:13px;padding:0 16px;margin-top:-28px;position:relative;z-index:2}
.ep-av{display:inline-flex;flex:none}
.ep-id{padding-bottom:5px;min-width:0}
.ep-name{font-size:17px;font-weight:600;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep-user{font-size:11.5px;color:var(--muted);margin-top:1px}
.ep-bio{padding:9px 16px 14px;font-size:11.75px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}

.av-edit{position:relative;display:inline-flex}

  position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;border:2px solid #141416;
  background:#2a2a2e;color:#e5e3de;display:grid;place-items:center;cursor:pointer;z-index:3;
}
.av-edit-btn:hover{background:#35353a}
.av-edit-btn .icon{width:13px;height:13px}

.lightbox{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;background:rgba(6,6,7,.96);backdrop-filter:blur(12px);animation:fadeIn .18s ease}
.lb-head{height:58px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px 0 18px}
.lb-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:11px;color:var(--muted)}
.lb-meta b{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-actions{display:flex;gap:2px}
.lb-actions .icon-btn{color:#c9c7c1}
.lb-stage{flex:1;min-height:0;display:grid;place-items:center;padding:0 68px;position:relative}
.lb-stage img{max-width:100%;max-height:100%;border-radius:8px;object-fit:contain;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.lb-nav{
  position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(255,255,255,.14);background:rgba(22,22,25,.8);color:#fff;display:grid;place-items:center;
  cursor:pointer;z-index:4;backdrop-filter:blur(10px);transition:background .15s;
}
.lb-nav:hover{background:rgba(255,255,255,.14)}
.lb-nav.prev{left:14px}
.lb-nav.next{right:14px}
.lb-foot{height:54px;flex:none;display:flex;align-items:center;justify-content:center;gap:12px;font-size:11px;color:var(--faint)}
.lb-foot b{color:var(--ink-2);font-weight:500}

.player{width:min(100%,1000px);position:relative;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#050506;box-shadow:0 30px 90px rgba(0,0,0,.65)}
.player canvas{display:block;width:100%;aspect-ratio:16/9;background:#050506}
.player-ui{
  position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:9px;padding:11px 12px;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.8));
}
.player-ui .icon-btn{color:#fff;width:30px;height:30px}
.progress{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.18);position:relative;cursor:pointer}
.progress i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--accent)}
.ptime{font-size:10.5px;color:#d9d7d1;font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
.pbadge{font-size:8.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#c9c7c1;border:1px solid rgba(255,255,255,.2);border-radius:3px;padding:2px 5px}
.big-play{
  position:absolute;inset:0;margin:auto;width:62px;height:62px;border-radius:50%;color:#fff;cursor:pointer;
  border:1px solid rgba(255,255,255,.24);background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  display:grid;place-items:center;transition:transform .16s,background .16s;
}
.big-play:hover{transform:scale(1.04);background:rgba(0,0,0,.66)}
.big-play .icon{width:24px;height:24px;fill:currentColor;margin-left:3px}

.toasts{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{
  display:flex;align-items:center;gap:9px;max-width:min(92vw,540px);padding:9px 13px;border-radius:8px;
  background:#1b1b1e;border:1px solid var(--line-2);border-left:2px solid var(--accent);
  color:var(--ink);font-size:12.25px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:toastIn .2s cubic-bezier(.2,.8,.2,1);
}
.toast .icon{width:15px;height:15px;color:var(--muted);flex:none}
.toast.ok{border-left-color:var(--green)}
.toast.warn{border-left-color:var(--amber)}

@keyframes fadeIn{from{opacity:0}}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.99)}}
@keyframes popIn{from{opacity:0;transform:translateY(5px) scale(.99)}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}}

.modal-title{margin:0 0 5px;font-size:19px;font-weight:600;letter-spacing:-.02em}
.modal-sub{margin:0 0 16px;font-size:12.5px;line-height:1.6;color:var(--muted);max-width:580px}
.pin-list{display:flex;flex-direction:column;gap:6px}
.pin-row{display:flex;align-items:center;gap:2px;padding:4px;border-radius:8px;border:1px solid var(--line)}

.pin-main{flex:1;min-width:0;display:flex;align-items:flex-start;gap:9px;padding:6px;border:none;background:none;color:inherit;text-align:left;cursor:pointer}
.pin-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.pin-top{display:flex;align-items:baseline;gap:8px}
.pin-top b{font-size:12.5px;color:var(--ink);font-weight:500}
.pin-top span{font-size:10px;color:var(--faint)}
.pin-text{font-size:12px;line-height:1.5;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.is-flash{animation:flashMsg 1.4s ease}
@keyframes flashMsg{0%,100%{background:transparent}18%,55%{background:rgba(255,255,255,.05);box-shadow:inset 2px 0 0 rgba(232,228,218,.7)}}
.lb-video{max-width:100%;max-height:100%;border-radius:8px;background:#000;box-shadow:0 30px 90px rgba(0,0,0,.7)}
.mc-stats div{display:flex;flex-direction:column;gap:1px}
.mc-stats span{font-size:10.5px;color:var(--muted)}
.about-rows b{display:inline-flex;align-items:center;gap:4px;font-weight:500}
.about-rows b .icon{width:12px;height:12px;color:var(--faint)}
.mc-name .icon{width:16px;height:16px;color:var(--faint);flex:none}
.popover{max-height:calc(100vh - 16px);overflow-y:auto;overflow-x:hidden}
.pop-stats{flex-wrap:wrap}

.ob-screen {

  z-index: 460;
  display: grid;
  place-items: center;
  padding: 28px 20px;
  overflow: auto;
  background:
    radial-gradient(58vw 58vw at 12% 6%, rgba(62, 96, 255, .28), transparent 62%),
    radial-gradient(52vw 52vw at 88% 14%, rgba(138, 45, 240, .26), transparent 64%),
    radial-gradient(70vw 48vw at 50% 104%, rgba(64, 120, 255, .16), transparent 70%),
    #070708;

  background: linear-gradient(180deg, rgba(28, 28, 32, .95), rgba(13, 13, 15, .98));

.ob-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
.ob-logo { width: 46px; height: 46px; border-radius: 14px; box-shadow: 0 10px 26px rgba(0, 0, 0, .5); }

.ob-lead { margin: 6px 0 0; font-size: 12.8px; line-height: 1.45; color: #a3a2a0; }

.ob-preview {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, .08);
  background: #101012;
  margin-bottom: 18px;
}
.ob-banner { position: relative; height: 112px; overflow: hidden; background: #141416; }
.ob-banner .banner { height: 100%; border-radius: 0; }
.ob-idrow { display: flex; align-items: center; gap: 14px; padding: 0 18px 14px; margin-top: -34px; }
.ob-avatar { flex: none; border-radius: 50%; outline: 4px solid #101012; }
.ob-avatar .avatar { --s: 76px; }
.ob-idtext { min-width: 0; padding-top: 30px; }
.ob-name { font-size: 18px; font-weight: 650; color: var(--ink, #ecebe7); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ob-user { font-size: 12.5px; color: #9a9997; margin-top: 2px; }

.ob-form { display: grid; gap: 14px; }
.ob-field { display: grid; gap: 6px; min-width: 0; }
.ob-label {
  font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  color: #8d8c8a; display: flex; align-items: baseline; gap: 6px;
}
.ob-label i { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 500; color: #6d6c6a; }
.ob-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ob-userinput {
  display: flex; align-items: center; gap: 6px;
  border: 1px solid rgba(255, 255, 255, .1); border-radius: 12px;

  transition: border-color .16s ease;

.ob-userinput:focus-within { border-color: rgba(255, 255, 255, .26); }

.ob-userinput .input:focus { border-color: transparent; }
.ob-note { font-size: 11.5px; color: #75746f; min-height: 15px; line-height: 1.3; }
.ob-note.ok { color: #9ad3ae; }
.ob-note.bad { color: #e6a3a0; }
.ob-media { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }
.ob-banners {

.ob-banners .bn-name { font-size: 9.5px; padding: 10px 6px 4px; }
.ob-error { margin: 0; font-size: 12.5px; color: #efa5a1; }
.ob-actions {
  position: sticky; bottom: -1px; z-index: 2;
  padding: 10px 0 6px;
  background: linear-gradient(180deg, rgba(13, 13, 15, 0), rgba(13, 13, 15, .96) 34%);
}
.ob-submit { width: 100%; margin-top: 2px; }
.ob-hint { margin: 0; font-size: 11.5px; line-height: 1.4; color: #71706e; text-align: center; }

@media (max-width: 560px) {

  .ob-banner { height: 112px; }
}

const hashStr = (str) => {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {

};

    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

const artCache = new Map();
function artSrc(seed, width = 1200, height = 900) {
  const key = `${seed}|${width}x${height}`;
  if (artCache.has(key)) return artCache.get(key);
  const rand = mulberry32(hashStr(String(seed)));
  const range = (a, b) => a + (b - a) * rand();
  const palette = ART_PALETTES[Math.floor(rand() * ART_PALETTES.length)];
  let blobs = '';
  for (let i = 0; i < 5; i++) {
    const cx = range(-0.05, 1.05) * width;
    const cy = range(-0.05, 1.05) * height;
    const rx = range(0.18, 0.44) * width;
    const ry = range(0.2, 0.5) * height;
    const color = palette.blobs[i % palette.blobs.length];
    blobs += `<ellipse cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" rx="${rx.toFixed(0)}" ry="${ry.toFixed(0)}" fill="${color}" opacity="${range(0.4, 0.8).toFixed(2)}"/>`;
  }
  const rx = range(0.12, 0.26) * Math.min(width, height);
  const cx = range(0.2, 0.8) * width;
  const cy = range(0.2, 0.8) * height;
  const tilt = range(-30, 30).toFixed(1);
  const beamY = range(0.15, 0.7) * height;
  const beamH = range(0.05, 0.16) * height;
  const dots = Array.from({ length: 26 }, () => {
    const x = (range(0, 1) * width).toFixed(0);
    const y = (range(0, 1) * height).toFixed(0);
    return `<circle cx="${x}" cy="${y}" r="${range(0.7, 2.4).toFixed(1)}" fill="#fff" opacity="${range(0.15, 0.7).toFixed(2)}"/>`;
  }).join('');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${palette.bg[0]}"/><stop offset="1" stop-color="${palette.bg[1]}"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="vig" cx="50%" cy="45%" r="75%"><stop stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="${(width * 0.06).toFixed(0)}"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="${width}" height="${height}" fill="url(#g)"/>
<g filter="url(#blur)">${blobs}</g>
<circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${rx.toFixed(0)}" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="${Math.max(1, width * 0.0016).toFixed(1)}"/>
<circle cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" r="${(rx * 0.72).toFixed(0)}" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="${Math.max(1, width * 0.0012).toFixed(1)}"/>
<g transform="rotate(${tilt} ${(width / 2).toFixed(0)} ${(height / 2).toFixed(0)})"><rect x="${(-width * 0.2).toFixed(0)}" y="${beamY.toFixed(0)}" width="${(width * 1.4).toFixed(0)}" height="${beamH.toFixed(0)}" fill="url(#beam)" opacity=".5"/></g>
${dots}
<rect width="${width}" height="${height}" filter="url(#grain)" opacity=".14" style="mix-blend-mode:overlay"/>
<rect width="${width}" height="${height}" fill="url(#vig)"/>
</svg>`;
  const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  if (artCache.size > 140) artCache.clear();
  artCache.set(key, src);
  return src;
}

const fmtTime = (ts) => new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
const fmtDayLong = (ts) => new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
const fmtMonthShort = (ts) => new Date(ts).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
const fmtDay = (ts) => {
  const d = new Date(ts);
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const diff = Math.round((start - day) / 86400000);
  if (diff === 0) return 'Сегодня';
  if (diff === 1) return 'Вчера';
  if (diff > 1 && diff < 7) return d.toLocaleDateString('ru-RU', { weekday: 'long' });
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
};
const fmtShort = (ts) => {
  const d = new Date(ts);
  const now = new Date();
  const same = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  if (same(d, now)) return fmtTime(ts);
  const y = new Date(now);
  y.setDate(y.getDate() - 1);
  if (same(d, y)) return 'вчера';
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
};
const fmtDur = (sec) => {
  const s = Math.max(0, Math.round(sec || 0));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};

const orderedPairs = (obj) => Object.entries(obj).sort((a, b) => a[1] - b[1]);
const ago = (days, hours = 0, minutes = 0) => Date.now() - ((days * 24 + hours) * 60 + minutes) * 60000;

function demoState() {
  const people = {
    me: {
      id: 'me', name: 'Мой профиль', username: 'user', grad: 0, accent: '#e6e2d8', status: 'online',
      custom: '', bio: '', banner: 'mono', joined: new Date().toISOString().slice(0, 10), avatar: null
    }
  };

  const conversations = [];

  return {
    v: 3,
    me: 'me',
    people,
    conversations,
    activeId: null,
    prefs: { membersOpen: window.innerWidth > 1180 }
  };
}

const STORE_KEY = 'aurora.messenger.v3';
let memoryStore = null;

function loadState() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORE_KEY);
  } catch (error) {
    raw = memoryStore;
  }
  if (!raw) return null;
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.v !== 3 || !parsed.people || !Array.isArray(parsed.conversations)) return null;
    if (!parsed.conversations.some((c) => c.id === parsed.activeId)) parsed.activeId = parsed.conversations[0]?.id || null;
    parsed.prefs = parsed.prefs || { membersOpen: true };
    const used = new Set([parsed.me]);
    parsed.conversations.forEach((c) => {
      if (c.peer) used.add(c.peer);
      (c.members || []).forEach((id) => used.add(id));
      (c.messages || []).forEach((m) => used.add(m.author));
    });
    Object.keys(parsed.people).forEach((id) => {
      const p = parsed.people[id];
      if (!used.has(id) || (id !== parsed.me && ['liza', 'artem', 'mark', 'sonya', 'kirill'].includes(id))) delete parsed.people[id];
    });
    parsed.conversations = parsed.conversations.filter((c) => c.type !== 'dm' || parsed.people[c.peer]);
    parsed.conversations.forEach((c) => {
      c.messages = c.messages || [];
      c.pinnedMsgs = c.pinnedMsgs || [];
      c.hiddenFor = c.hiddenFor || [];
      if (c.type === 'group') {
        c.members = Array.from(new Set((c.members || []).filter((id) => parsed.people[id])));
        c.roles = c.roles || {};
        Object.keys(c.roles).forEach((id) => { if (!c.members.includes(id) || !['owner', 'admin', 'member'].includes(c.roles[id])) delete c.roles[id]; });
        const owners = c.members.filter((id) => c.roles[id] === 'owner');
        const ownerId = owners.includes(parsed.me) ? parsed.me : (owners[0] || (c.members.includes(parsed.me) ? parsed.me : c.members[0]));
        c.members.forEach((id) => { c.roles[id] = id === ownerId ? 'owner' : (c.roles[id] === 'admin' ? 'admin' : 'member'); });
        c.access = c.access === 'open' ? 'open' : 'closed';
        c.requestsOn = c.requestsOn !== false;
        c.joinRequests = (c.joinRequests || []).filter((r) => r && r.personId && parsed.people[r.personId] && !c.members.includes(r.personId));
        c.perms = c.perms && c.perms.admins ? c.perms : { admins: { deleteMessages: true, removeMembers: true, acceptRequests: true } };
        ['deleteMessages', 'removeMembers', 'acceptRequests'].forEach((key) => { c.perms.admins[key] = c.perms.admins[key] !== false; });
      }
      c.messages.forEach((m) => {
        m.att = m.att || [];
        m.react = m.react || {};
        m.hiddenFor = m.hiddenFor || [];
        m.att.forEach((a) => { if (!a.aid) a.aid = uid('a'); });
      });
    });
    return parsed;
  } catch (error) {
    return null;
  }
}

let state = loadState() || demoState();
let storageOK = true;
let saveTimer = null;

function persist() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(flushPersist, 220);
}

function flushPersist() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = null;
  if (typeof NET !== 'undefined' && NET.online) return;
  {
    try {
      const clone = JSON.parse(JSON.stringify(state, (key, value) => {
        if (key === 'src' && typeof value === 'string' && value.startsWith('blob:')) return null;
        return value;
      }));
      localStorage.setItem(STORE_KEY, JSON.stringify(clone));
      memoryStore = JSON.stringify(clone);
      storageOK = true;
    } catch (error) {
      if (storageOK) {
        storageOK = false;
        if (typeof toast === 'function') toast('Локальное хранилище заполнено — изменения останутся до перезагрузки', 'warn');
      }
    }
  }
}

const me = () => state.people[state.me];

function statusText(p) {
  if (p.status === 'online') return 'в сети';
  if (p.status === 'idle') return 'неактивен';
  if (p.status === 'dnd') return 'не беспокоить';
  return 'не в сети';
}

function lastMessage(conv) {
  const list = conv.messages;
  for (let i = list.length - 1; i >= 0; i--) {
    if (!list[i].sys) return list[i];
  }
  return list[list.length - 1] || null;
}

function previewOf(conv) {
  const msg = lastMessage(conv);
  if (!msg) return 'Начните переписку';
  if (msg.deleted) return 'Сообщение удалено';
  let text = msg.text || '';
  if (!text && msg.att && msg.att.length) {
    const video = msg.att.find((a) => a.k === 'vid');
    text = video ? 'Видео' : msg.att.length > 1 ? `Фото · ${msg.att.length}` : 'Фото';
  }
  if (msg.sys) return msg.sys;
  return conv.type === 'group' ? `${person(msg.author).name.split(' ')[0]}: ${text}` : text;
}

function collectMedia(conv) {
  const out = [];
  if (!conv) return out;
  conv.messages.forEach((m) => {
    (m.att || []).forEach((a) => out.push({ a, m, conv }));
  });
  return out;
}

function mediaForPerson(personId) {
  const out = [];
  state.conversations.forEach((conv) => {
    conv.messages.forEach((m) => {
      if (m.author !== personId) return;
      (m.att || []).forEach((a) => out.push({ a, m, conv }));
    });
  });
  return out;
}

const HOST = 'youchat-msg.ru';
const groupLink = (conv) => `https://${HOST}/g/${conv.handle || conv.id}`;
const profileLink = (p) => `https://${HOST}/u/${p.username || p.id}`;
const messageLink = (conv, m) => `https://${HOST}/m/${conv.id}/${m.id}`;

const EDIT_WINDOW = 24 * 60 * 60 * 1000;
const REC_LIMIT = 60;
const NAME_LIMIT = { person: { min: 3, max: 24 }, group: { min: 3, max: 24 } };
const TRANSLIT = {
  а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'e', ж: 'zh', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l',
  м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'h', ц: 'ts', ч: 'ch', ш: 'sh',
  щ: 'sch', ъ: '', ы: 'y', ь: '', э: 'e', ю: 'yu', я: 'ya'
};
function latinize(value) {
  return String(value || '').toLowerCase().replace(/[а-яё]/g, (ch) => (ch in TRANSLIT ? TRANSLIT[ch] : ''));
}
function cleanHandle(value, dash = true) {
  const allowed = dash ? /[^a-z0-9-]/g : /[^a-z0-9_]/g;
  return latinize(value).replace(/\s+/g, '-').replace(allowed, '').slice(0, 24);
}
function handleTaken(kind, value, selfId = null) {
  if (!value) return false;
  if (kind === 'group') return state.conversations.some((c) => c.type === 'group' && c.handle === value && c.id !== selfId);
  return Object.values(state.people).some((p) => p.id !== (selfId || state.me) && p.username === value);
}
const myRole = (conv) => (conv && conv.type === 'group' ? (conv.roles?.[state.me] || 'member') : null);
const isOwner = (conv) => myRole(conv) === 'owner';
const isGroupAdmin = (conv) => ['owner', 'admin'].includes(myRole(conv));
const adminPerm = (conv, key) => {
  if (!conv || conv.type !== 'group') return false;
  if (myRole(conv) === 'owner') return true;
  if (myRole(conv) !== 'admin') return false;
  return conv.perms?.admins?.[key] !== false;
};
const canManageMember = (conv, id) => {
  if (!conv || conv.type !== 'group' || id === state.me) return false;
  const target = conv.roles?.[id] || 'member';
  if (target === 'owner') return false;
  if (isOwner(conv)) return true;
  return target === 'member' && adminPerm(conv, 'removeMembers');
};
function logAdmin(conv, text) {
  conv.audit = conv.audit || [];
  conv.audit.unshift({ t: Date.now(), by: state.me, text });
  if (conv.audit.length > 50) conv.audit.length = 50;
}
const canDeleteForAll = (conv, m) => m.author === state.me || adminPerm(conv, 'deleteMessages');
const canEditMessage = (m) => m.author === state.me && !m.deleted && Date.now() - m.t < EDIT_WINDOW;
const accessLabel = (conv) => (conv.access === 'open' ? 'Открытая' : 'Закрытая');
const accessHint = (conv) => (conv.access === 'open' ? 'Вступить можно по ссылке без заявки' : 'Вступление по ссылке и заявке');

function unreadTotal() {

  return state.conversations.reduce((sum, c) => sum + (c.unread || 0), 0);
}

function contacts() {
  const ids = new Set(state.conversations
    .filter((c) => c.type === 'dm' && c.messages.some((m) => !m.sys && !m.deleted))
    .map((c) => c.peer));
  return Object.values(state.people).filter((p) => p.id !== state.me && ids.has(p.id));
}

function groupsOf(personId) {
  return state.conversations.filter((c) => c.type === 'group' && c.members.includes(personId));
}

function dmWith(personId) {
  return state.conversations.find((c) => c.type === 'dm' && c.peer === personId);
}

function titleBadge() {
  const n = unreadTotal();
  document.title = n ? `YouChat (${n})` : 'YouChat — мессенджер';
}

</script>

/* ui.js */
'use strict';

function avatarHTML(p, size = 40, opts = {}) {
  const grad = GRADS[(p.grad || 0) % GRADS.length];
  const inner = p.avatar ? `<img src="${p.avatar}" alt="">` : `<span>${esc(initials(p.name))}</span>`;
  const cls = p.avatar ? 'avatar has-img' : 'avatar';
  const av = `<span class="${cls}" style="--s:${size}px;--g1:${grad[0]};--g2:${grad[1]}">${inner}</span>`;
  if (!opts.status) return av;
  return `<span class="av-wrap" data-st="${p.status}" style="--st-border:${opts.border || 'var(--bg-1)'}">${av}<span class="av-status"></span></span>`;
}

function groupAvatarHTML(conv, size = 44, opts = {}) {
  const grad = GRADS[(conv.grad || 0) % GRADS.length];
  const radius = opts.round ? 'border-radius:50%;' : '';
  return `<span class="gicon" style="--s:${size}px;--g1:${grad[0]};--g2:${grad[1]};${radius}">${conv.avatar ? `<img src="${conv.avatar}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;position:relative">` : `<span>${esc(conv.icon || monogram(conv.name))}</span>`}</span>`;
}

function convAvatarHTML(conv, size = 40, opts = {}) {
  if (conv.type === 'group') {
    const wrap = `<span class="av-wrap">${groupAvatarHTML(conv, size, opts)}</span>`;
    return wrap;
  }
  return avatarHTML(person(conv.peer), size, opts);
}

function bannerHTML(id, cls = '', img = '') {
  if (img) {
    return `<div class="banner has-img ${cls}" aria-hidden="true" style="background-image:url('${String(img).replace(/'/g, '%27')}')"><b></b></div>`;
  }
  const safe = BANNERS.some((b) => b.id === id) ? id : 'mono';
  return `<div class="banner ${cls}" data-banner="${safe}" aria-hidden="true"><i></i><i></i><b></b></div>`;
}

function bannerOptionsHTML(selected, kind = 'all') {
  const list = kind === 'animated' ? BANNERS_ANIMATED : kind === 'static' ? BANNERS_STATIC : BANNERS;
  return list.map((b) => `
    <button type="button" class="bn-opt ${b.id === selected ? 'is-active' : ''}" data-banner-pick="${b.id}" aria-pressed="${b.id === selected}" aria-label="Баннер «${esc(b.name)}»">
      ${bannerHTML(b.id)}
      <span class="bn-kind">${isAnimatedBanner(b.id) ? 'анимация' : 'статика'}</span>
      <span class="bn-name">${esc(b.name)}</span>
      ${b.id === selected ? `<span class="bn-tick">${icon('check')}</span>` : ''}
    </button>`).join('');
}

function roleLabel(role) {
  if (role === 'owner') return 'Основатель';
  if (role === 'admin') return 'Админ';
  return 'Участник';
}

function roleIcon(role) {
  if (role === 'owner') return icon('crown');
  if (role === 'admin') return icon('shield');
  return '';
}

let toastId = 0;
function toast(text, kind = '') {
  const box = $('#toasts');
  if (!box) return;
  const node = document.createElement('div');
  node.className = 'toast ' + kind;
  node.dataset.toast = String(++toastId);
  node.innerHTML = `${icon(kind === 'warn' ? 'info' : 'sparkle')}<span>${esc(text)}</span>`;
  box.append(node);
  setTimeout(() => {
    node.style.opacity = '0';
    node.style.transform = 'translateY(6px)';
    node.style.transition = 'opacity .2s, transform .2s';
    setTimeout(() => node.remove(), 220);
  }, 3000);
}

const modalStack = [];
let modalBound = false;

function bindModalShell() {
  if (modalBound) return;
  modalBound = true;
  $('#modalLayer').addEventListener('click', (event) => {
    if (event.target.closest('[data-modal-close]')) closeModal();
  });
}

function openModal(html, opts = {}) {
  bindModalShell();
  const { size = 'md', onMount = null, label = 'Диалог' } = opts;
  const layer = $('#modalLayer');
  const node = document.createElement('div');
  node.className = 'modal-wrap';
  node.innerHTML = `
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal ${size}" role="dialog" aria-modal="true" aria-label="${esc(label)}" tabindex="-1">
      <button class="icon-btn modal-close" data-modal-close aria-label="Закрыть">${icon('close')}</button>
      <div class="modal-scroll">${html}</div>
    </div>`;
  layer.append(node);
  layer.hidden = false;
  const entry = { node, onMount, returnFocus: document.activeElement };
  modalStack.push(entry);
  if (onMount) onMount($('.modal', node), node);
  requestAnimationFrame(() => {
    const coarse = window.matchMedia('(pointer:coarse)').matches;
    const target = coarse ? $('.modal', node) : $('.modal-scroll input:not([type="file"]), .modal-scroll textarea, .modal-scroll select, .modal-scroll .btn.primary, .modal', node);
    if (target) target.focus({ preventScroll: true });
  });
  return entry;
}

function refreshModal(html, onMount = null, size = null) {
  const entry = modalStack[modalStack.length - 1];
  if (!entry) return;
  const modal = $('.modal', entry.node);
  const scroll = $('.modal-scroll', modal);
  const keep = scroll.scrollTop;
  if (size) modal.className = 'modal ' + size;
  scroll.innerHTML = html;
  entry.onMount = onMount;
  if (onMount) onMount(modal, entry.node);
  scroll.scrollTop = keep;
  return entry;
}

function closeModal() {
  const entry = modalStack.pop();
  if (!entry) return;
  const node = entry.node;
  node.style.opacity = '0';
  node.style.transition = 'opacity .14s';
  setTimeout(() => node.remove(), 150);
  if (!modalStack.length) {
    setTimeout(() => {
      if (!modalStack.length) $('#modalLayer').hidden = true;
    }, 160);
  }
  if (entry.returnFocus && typeof entry.returnFocus.focus === 'function') {
    try { entry.returnFocus.focus({ preventScroll: true }); } catch (error) {}
  }
}

function closeAllModals() {
  while (modalStack.length) closeModal();
}

let popoverReady = false;
let popoverAnchor = null;

function openPopover(anchor, content, opts = {}) {
  const { kind = 'card', onMount = null, align = 'start' } = opts;
  const pop = $('#popover');
  const sheet = window.innerWidth <= 640;
  pop.className = 'popover' + (kind === 'menu' ? ' is-menu' : '') + (sheet ? ' as-sheet' : '');
  document.body.classList.toggle('sheet-open', sheet);
  pop.innerHTML = content;
  pop.hidden = false;
  pop.style.visibility = 'hidden';
  const rect = pop.getBoundingClientRect();
  const r = anchor.getBoundingClientRect();
  let left = align === 'center' ? r.left + r.width / 2 - rect.width / 2 : r.left;
  let top = r.bottom + 8;
  left = clamp(left, 8, Math.max(8, window.innerWidth - rect.width - 8));
  if (top + rect.height > window.innerHeight - 8) {
    top = Math.max(8, r.top - rect.height - 8);
  }
  if (top < 8) top = 8;
  pop.style.left = Math.round(left) + 'px';
  pop.style.top = Math.round(top) + 'px';
  pop.style.visibility = '';
  popoverAnchor = anchor;
  popoverReady = false;
  requestAnimationFrame(() => { popoverReady = true; });
  if (onMount) onMount(pop);
}

function closePopover() {
  const pop = $('#popover');
  if (!pop || pop.hidden) return;
  pop.hidden = true;
  pop.innerHTML = '';
  pop.className = 'popover';
  document.body.classList.remove('sheet-open');
  popoverAnchor = null;
  popoverReady = false;
}

function menuHTML(items) {
  return items.map((item) => {
    if (item === 'sep') return '<div class="menu-sep"></div>';
    if (item.title) return `<div class="menu-title">${esc(item.title)}</div>`;
    return `<button type="button" class="menu-item ${item.danger ? 'danger' : ''}" data-menu-act="${esc(item.id)}">${item.icon ? icon(item.icon) : ''}<span>${esc(item.label)}</span></button>`;
  }).join('');
}

function openMenu(anchor, items) {
  const id = uid('menu');
  openPopover(anchor, menuHTML(items), {
    kind: 'menu',
    onMount: (pop) => {
      pop.dataset.menuId = id;
      $$('[data-menu-act]', pop).forEach((btn) => {
        btn.addEventListener('click', () => {
          const found = items.find((it) => it && it.id === btn.dataset.menuAct);
          closePopover();
          if (found && found.onClick) found.onClick();
        });
      });
    }
  });
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast('Скопировано в буфер обмена', 'ok');
    return true;
  } catch (error) {
    try {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.append(area);
      area.select();
      document.execCommand('copy');
      area.remove();
      toast('Скопировано в буфер обмена', 'ok');
      return true;
    } catch (e) {
      toast('Не удалось скопировать', 'warn');
      return false;
    }
  }
}

function downloadBlob(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function focusTrap(event) {
  if (event.key !== 'Tab' || !modalStack.length) return;
  const top = modalStack[modalStack.length - 1].node;
  const nodes = $$('button:not([disabled]), [href], input:not([type="hidden"]):not([disabled]), textarea:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])', top)
    .filter((el) => el.offsetParent !== null || el === document.activeElement);
  if (!nodes.length) return;
  const first = nodes[0];
  const last = nodes[nodes.length - 1];
  if (event.shiftKey && (document.activeElement === first || !top.contains(document.activeElement))) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
}

<script>
/* crop.js */
'use strict';

/* Ручная обрезка: фото или кадр из видео. kind: 'avatar' (круг) | 'banner' (прямоугольник 5:2). Возвращает dataURL или null. */
function cropMedia(file, kind) {
  return new Promise((resolve) => {
    const circle = kind === 'avatar';
    const isVideo = file.type.startsWith('video/');
    const [outW, outH] = circle ? [320, 320] : [1200, 480];
    const url = URL.createObjectURL(file);
    let settled = false;
    const finish = (value) => {
      if (settled) return;
      settled = true;
      URL.revokeObjectURL(url);
      resolve(value);
    };
    const html = `<div class="modal-pad crop">
      <h2 class="modal-title">${circle ? 'Фото профиля' : 'Баннер'}</h2>
      <p class="modal-sub">Двигайте фото пальцем и приближайте — в рамке останется то, что вы выбрали.</p>
      <div class="crop-stage" id="cropStage"><img id="cropImg" alt="" draggable="false"><div class="crop-frame ${circle ? 'is-circle' : ''}" id="cropFrame"></div></div>
      ${isVideo ? '<label class="crop-row"><span>Кадр</span><input type="range" id="cropSeek" min="0" max="1000" value="0"></label>' : ''}
      <label class="crop-row"><span>Масштаб</span><input type="range" id="cropZoom" min="100" max="400" value="100"></label>
      <div class="form-actions">
        <button type="button" class="btn" data-modal-close>Отмена</button>
        <button type="button" class="btn primary" id="cropOk" disabled>${icon('check')}<span>Готово</span></button>
      </div>
    </div>`;
    const entry = openModal(html, {
      size: 'sm',
      label: circle ? 'Обрезка фото профиля' : 'Обрезка баннера',
      onMount: (modal) => {
        const stage = $('#cropStage', modal);
        const frame = $('#cropFrame', modal);
        const img = $('#cropImg', modal);
        const zoom = $('#cropZoom', modal);
        const ok = $('#cropOk', modal);
        const stageW = stage.clientWidth || 300;
        const fw = circle ? Math.min(260, stageW - 40) : stageW - 40;
        const fh = circle ? fw : fw * (outH / outW);
        stage.style.height = Math.round(fh + 56) + 'px';
        frame.style.width = fw + 'px';
        frame.style.height = fh + 'px';

        let source = null;
        let iw = 1;
        let ih = 1;
        let z = 1;
        let cx = 0;
        let cy = 0;
        const base = () => Math.max(fw / iw, fh / ih);
        const apply = () => {
          const s = base() * z;
          const mx = Math.max(0, (iw * s - fw) / 2);
          const my = Math.max(0, (ih * s - fh) / 2);
          cx = clamp(cx, -mx, mx);
          cy = clamp(cy, -my, my);
          img.style.width = iw + 'px';
          img.style.height = ih + 'px';
          img.style.transform = `translate(-50%,-50%) translate(${cx}px,${cy}px) scale(${s})`;
          zoom.value = String(Math.round(z * 100));
        };
        const ready = (src, w, h, imgSrc) => {
          source = src;
          iw = w;
          ih = h;
          if (imgSrc) img.src = imgSrc;
          ok.disabled = false;
          apply();
        };

        if (isVideo) {
          const video = document.createElement('video');
          video.muted = true;
          video.playsInline = true;
          video.preload = 'auto';
          const grab = () => {
            const k = Math.min(1, 1600 / Math.max(video.videoWidth, video.videoHeight));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(video.videoWidth * k);
            canvas.height = Math.round(video.videoHeight * k);
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            ready(canvas, canvas.width, canvas.height, canvas.toDataURL('image/jpeg', 0.9));
          };
          video.addEventListener('loadedmetadata', () => { video.currentTime = Math.min(0.1, video.duration || 0); });
          video.addEventListener('seeked', grab);
          video.addEventListener('error', () => { toast('Не удалось открыть видео', 'warn'); closeModal(); });
          video.src = url;
          $('#cropSeek', modal).addEventListener('input', (event) => {
            if (video.duration) video.currentTime = (Number(event.target.value) / 1000) * video.duration;
          });
        } else {
          const image = new Image();
          image.onload = () => ready(image, image.naturalWidth, image.naturalHeight, url);
          image.onerror = () => { toast('Не удалось открыть изображение', 'warn'); closeModal(); };
          image.src = url;
        }

        const pointers = new Map();
        let pinch = null;
        stage.addEventListener('pointerdown', (event) => {
          stage.setPointerCapture(event.pointerId);
          pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
          if (pointers.size === 2) {
            const [a, b] = Array.from(pointers.values());
            pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z };
          }
        });
        stage.addEventListener('pointermove', (event) => {
          const prev = pointers.get(event.pointerId);
          if (!prev) return;
          const now = { x: event.clientX, y: event.clientY };
          pointers.set(event.pointerId, now);
          if (pointers.size === 2 && pinch) {
            const [a, b] = Array.from(pointers.values());
            z = clamp(pinch.z * (Math.hypot(a.x - b.x, a.y - b.y) / pinch.d), 1, 4);
          } else if (pointers.size === 1) {
            cx += now.x - prev.x;
            cy += now.y - prev.y;
          }
          apply();
        });
        const drop = (event) => { pointers.delete(event.pointerId); pinch = null; };
        stage.addEventListener('pointerup', drop);
        stage.addEventListener('pointercancel', drop);
        stage.addEventListener('wheel', (event) => {
          event.preventDefault();
          z = clamp(z * Math.exp(-event.deltaY * 0.0015), 1, 4);
          apply();
        }, { passive: false });
        zoom.addEventListener('input', () => { z = clamp(Number(zoom.value) / 100, 1, 4); apply(); });

        ok.addEventListener('click', () => {
          if (!source) return;
          const s = base() * z;
          const sw = fw / s;
          const sh = fh / s;
          const ix = iw / 2 - cx / s;
          const iy = ih / 2 - cy / s;
          const canvas = document.createElement('canvas');
          canvas.width = outW;
          canvas.height = outH;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#111';
          ctx.fillRect(0, 0, outW, outH);
          ctx.drawImage(source, ix - sw / 2, iy - sh / 2, sw, sh, 0, 0, outW, outH);
          const data = canvas.toDataURL('image/jpeg', circle ? 0.9 : 0.82);
          closeModal();
          finish(data);
        });
      }
    });
    const watch = new MutationObserver(() => {
      if (!document.body.contains(entry.node)) { watch.disconnect(); finish(null); }
    });
    watch.observe($('#modalLayer'), { childList: true });
  });
}
