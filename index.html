<script>
/* media.js */
'use strict';

const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function mediaSrc(a, width = 1200, height = 900) {
  if (a.src) return a.src;
  if (a.k === 'vid') return artSrc('video-poster:' + (a.seed || a.aid), width, height);
  return artSrc(a.seed || a.aid, width, height);
}

function posterSrc(a) {
  return mediaSrc(a, 960, 540);
}

let lightboxState = null;
let clipState = null;

function initMedia() {
  const layer = $('#lightbox');
  $('#lbClose').addEventListener('click', closeLightbox);
  $('#lbPrev').addEventListener('click', () => stepLightbox(-1));
  $('#lbNext').addEventListener('click', () => stepLightbox(1));
  $('#lbDownload').addEventListener('click', downloadCurrentMedia);
  layer.addEventListener('click', (event) => {
    if (event.target === layer) closeLightbox();
  });
}

function openLightbox(items, index = 0, opts = {}) {
  if (!items || !items.length) return;
  lightboxState = { items, index: clamp(index, 0, items.length - 1), title: opts.title || '' };
  $('#lightbox').hidden = false;
  renderLightbox();
}

function closeLightbox() {
  stopClip();
  $('#lightbox').hidden = true;
  lightboxState = null;
}

function stepLightbox(delta) {
  if (!lightboxState) return;
  stopClip();
  const total = lightboxState.items.length;
  lightboxState.index = (lightboxState.index + delta + total) % total;
  renderLightbox();
}

function currentMediaItem() {
  if (!lightboxState) return null;
  return lightboxState.items[lightboxState.index];
}

function downloadCurrentMedia() {
  const item = currentMediaItem();
  if (!item) return;
  const a = item.a;
  if (a.k === 'vid') {
    if (a.src) {
      const link = document.createElement('a');
      link.href = a.src;
      link.download = a.title || 'youchat-video';
      document.body.append(link);
      link.click();
      link.remove();
      toast('Видеофайл сохранён', 'ok');
    } else {
      toast('Это демо-клип: у него нет видеофайла для скачивания', 'warn');
    }
    return;
  }
  const src = mediaSrc(a);
  const img = new Image();
  img.onload = () => {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth || 1200;
      canvas.height = img.naturalHeight || 900;
      canvas.getContext('2d').drawImage(img, 0, 0);
      canvas.toBlob((blob) => {
        if (!blob) { toast('Не удалось подготовить файл', 'warn'); return; }
        const base = (a.title || 'youchat-image').replace(/\.[a-z0-9]+$/i, '');
        downloadBlob(base + '.png', blob);
        toast('Файл сохранён', 'ok');
      }, 'image/png');
    } catch (error) {
      toast('Не удалось сохранить файл', 'warn');
    }
  };
  img.onerror = () => toast('Не удалось загрузить изображение', 'warn');
  img.src = src;
}

function renderLightbox() {
  if (!lightboxState) return;
  const { items, index } = lightboxState;
  const item = items[index];
  const { a, m, conv } = item;
  const author = person(m.author);
  const stage = $('#lbStage');
  stopClip();
  $('#lbMeta').innerHTML = `
    <b>${esc(a.title || (a.k === 'vid' ? 'Видео' : 'Изображение'))}</b>
    <span>${esc(author.name)} · ${esc(fmtDayLong(m.t))}${conv ? ' · ' + esc(convTitle(conv)) : ''}</span>`;
  $('#lbDownload').hidden = !(a.k === 'img' || (a.k === 'vid' && a.src));
  $('#lbFoot').innerHTML = `
    <span>${a.k === 'vid' ? 'Видео' : 'Изображение'} ${index + 1} из ${items.length}</span>
    <span>← → для навигации · Esc для выхода</span>`;
  $('#lbPrev').hidden = items.length < 2;
  $('#lbNext').hidden = items.length < 2;

  if (a.k === 'vid' && a.src && !a.demo) {
    stage.innerHTML = `<video class="lb-video" src="${esc(a.src)}" controls playsinline poster="${posterSrc(a)}"></video>`;
    return;
  }
  if (a.k === 'vid') {
    mountClip(stage, a);
    return;
  }
  stage.innerHTML = `<img src="${mediaSrc(a)}" alt="${esc(a.title || 'Изображение')}">`;
}

function stopClip() {
  if (clipState) {
    if (clipState.raf) cancelAnimationFrame(clipState.raf);
    clipState = null;
  }
  const video = $('#lbStage video');
  if (video) {
    try { video.pause(); } catch (error) {}
  }
}

function mountClip(stage, att) {
  const duration = Math.max(4, att.dur || 12);
  const seed = att.seed || att.aid;
  const rand = mulberry32(hashStr(String(seed)));
  const palette = ART_PALETTES[Math.floor(rand() * ART_PALETTES.length)];
  const stars = Array.from({ length: 70 }, () => ({
    x: rand(), y: rand(), r: 0.4 + rand() * 1.5, p: rand() * Math.PI * 2
  }));
  stage.innerHTML = `
    <div class="player">
      <canvas id="clipCanvas" width="880" height="495" role="img" aria-label="Демонстрационный анимированный клип «${esc(att.title || 'YouChat clip')}»"></canvas>
      <button type="button" class="big-play" id="clipBig" aria-label="Воспроизвести">${icon('play')}</button>
      <div class="player-ui">
        <button type="button" class="icon-btn" id="clipToggle" aria-label="Пауза">${icon('pause')}</button>
        <div class="progress" id="clipProgress" role="slider" aria-label="Позиция клипа" aria-valuemin="0" aria-valuemax="${duration}" aria-valuenow="0"><i id="clipBar"></i></div>
        <span class="ptime" id="clipTime">0:00 / ${fmtDur(duration)}</span>
        <span class="pbadge">демо-клип</span>
      </div>
    </div>`;
  const canvas = $('#clipCanvas');
  const ctx = canvas.getContext('2d');
  const width = canvas.width;
  const height = canvas.height;
  let time = reducedMotion ? 2.4 : 0;
  let playing = !reducedMotion;
  let last = performance.now();
  let raf = 0;

  const big = $('#clipBig');
  const toggle = $('#clipToggle');
  const bar = $('#clipBar');
  const timeLabel = $('#clipTime');
  const progress = $('#clipProgress');

  const syncUI = () => {
    big.hidden = playing;
    toggle.innerHTML = icon(playing ? 'pause' : 'play');
    toggle.setAttribute('aria-label', playing ? 'Пауза' : 'Воспроизвести');
    bar.style.width = `${(time / duration) * 100}%`;
    timeLabel.textContent = `${fmtDur(time)} / ${fmtDur(duration)}`;
    progress.setAttribute('aria-valuenow', String(Math.round(time)));
  };

  const setPlaying = (value) => {
    playing = value;
    last = performance.now();
    syncUI();
  };

  const draw = (t) => {
    const bg = ctx.createLinearGradient(0, 0, width * 0.7, height);
    bg.addColorStop(0, '#0e0e10');
    bg.addColorStop(0.55, palette.bg[0]);
    bg.addColorStop(1, '#08080a');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, width, height);

    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < 5; i++) {
      const color = palette.blobs[i % palette.blobs.length];
      const cx = width * (0.2 + 0.6 * (0.5 + 0.5 * Math.sin(t * 0.14 + i * 1.7)));
      const cy = height * (0.25 + 0.5 * (0.5 + 0.5 * Math.cos(t * 0.12 + i * 2.1)));
      const radius = height * (0.32 + 0.16 * Math.sin(t * 0.2 + i));
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      glow.addColorStop(0, color + 'cc');
      glow.addColorStop(0.5, color + '55');
      glow.addColorStop(1, color + '00');
      ctx.fillStyle = glow;
      ctx.globalAlpha = 0.38;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    ctx.filter = 'blur(14px)';
    for (let i = 0; i < 3; i++) {
      const offset = i * 0.9;
      const amp = height * (0.08 + i * 0.025);
      const yBase = height * (0.36 + i * 0.13);
      const grad = ctx.createLinearGradient(0, 0, width, 0);
      grad.addColorStop(0, palette.blobs[i % palette.blobs.length] + '00');
      grad.addColorStop(0.35, palette.blobs[i % palette.blobs.length] + 'cc');
      grad.addColorStop(0.65, palette.blobs[(i + 2) % palette.blobs.length] + 'bb');
      grad.addColorStop(1, palette.blobs[(i + 2) % palette.blobs.length] + '00');
      ctx.strokeStyle = grad;
      ctx.lineWidth = 18 + i * 9;
      ctx.beginPath();
      for (let x = -20; x <= width + 20; x += 12) {
        const n = x / width;
        const y = yBase + Math.sin(n * 5.2 + t * 0.55 + offset) * amp + Math.sin(n * 2.1 - t * 0.3) * amp * 0.45;
        if (x === -20) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    ctx.filter = 'none';
    ctx.globalCompositeOperation = 'source-over';

    stars.forEach((s, idx) => {
      const alpha = 0.18 + 0.55 * (0.5 + 0.5 * Math.sin(t * 1.3 + s.p));
      ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(s.x * width, s.y * height, s.r, 0, Math.PI * 2);
      ctx.fill();
    });

    const vignette = ctx.createRadialGradient(width / 2, height * 0.45, height * 0.2, width / 2, height * 0.5, width * 0.72);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,.55)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, width, height);
  };

  const frame = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (playing) {
      time = (time + dt) % duration;
      draw(time);
      syncUI();
    }
    raf = requestAnimationFrame(frame);
  };

  clipState = {
    raf,
    stop() {},
    time: () => time
  };

  big.addEventListener('click', () => setPlaying(true));
  toggle.addEventListener('click', () => setPlaying(!playing));
  canvas.addEventListener('click', () => setPlaying(!playing));
  progress.addEventListener('click', (event) => {
    const r = progress.getBoundingClientRect();
    time = clamp((event.clientX - r.left) / r.width, 0, 0.999) * duration;
    draw(time);
    syncUI();
  });

  draw(time);
  syncUI();
  last = performance.now();
  raf = requestAnimationFrame(frame);
  clipState.raf = raf;
}

</script>
<script>
/* views.js */
'use strict';

function openConfirm(opts) {
  const { title, text, confirmLabel = 'Подтвердить', danger = false, onConfirm } = opts;
  const html = `<div class="modal-pad">
    <h2 class="modal-title">${esc(title)}</h2>
    <p class="modal-sub">${esc(text)}</p>
    <div class="form-actions">
      <button type="button" class="btn" data-modal-close>Отмена</button>
      <button type="button" class="btn ${danger ? 'danger' : 'primary'}" id="confirmAction">${esc(confirmLabel)}</button>
    </div>
  </div>`;
  openModal(html, {
    size: 'sm',
    label: title,
    onMount: (modal) => {
      $('#confirmAction', modal).addEventListener('click', () => {
        closeModal();
        if (typeof onConfirm === 'function') onConfirm();
      });
    }
  });
}

function openProfileCard(personId, anchor) {
  const p = person(personId);
  const media = mediaForPerson(personId).length;
  const groups = groupsOf(personId).length;
  const self = p.id === state.me;
  const html = `
    <div class="pop-banner">${bannerHTML(p.banner, '', p.bannerImg)}</div>
    <div class="pop-body">
      <span class="pop-av">${avatarHTML(p, 56, { status: true, border: '#17171a' })}</span>
      <h3 class="pop-name">${esc(p.name)}${self ? '<span class="status-pill">это вы</span>' : ''}</h3>
      <div class="pop-handle">@${esc(p.username)}</div>
      <div class="pop-status"><span class="dot" data-st="${p.status}"></span>${statusText(p)}${p.custom ? ' · ' + esc(p.custom) : ''}</div>
      <p class="pop-bio">${esc(p.bio || 'Пользователь пока ничего не рассказал о себе.')}</p>
      <div class="pop-actions">
        <button type="button" class="btn sm" data-pop-profile="${p.id}">${icon('users')}<span>Профиль</span></button>
        ${self ? '' : `<button type="button" class="btn sm primary" data-pop-write="${p.id}">${icon('dm')}<span>Написать</span></button>`}
      </div>
      <div class="pop-stats">
        <span><b>${media}</b> медиа</span>
        <span><b>${groups}</b> групп</span>
        <span>с ${esc(fmtJoined(p.joined || Date.now()))}</span>
      </div>
      <div class="link-row">${icon('link')}<code>${esc(profileLink(p))}</code><button type="button" class="btn sm" data-copy-link>Копировать</button></div>
    </div>`;
  openPopover(anchor, html, {
    onMount: (pop) => {
      const profileBtn = $('[data-pop-profile]', pop);
      if (profileBtn) profileBtn.addEventListener('click', () => {
        closePopover();
        openProfile(p.id);
      });
    const writeBtn = $('[data-pop-write]', pop);
    if (writeBtn) writeBtn.addEventListener('click', () => {
      closePopover();
      openDM(p.id);
    });
    const copyBtn = $('[data-copy-link]', pop);
    if (copyBtn) copyBtn.addEventListener('click', () => copyText(profileLink(p)));
    }
  });
}

function openProfile(personId, tab = 'about') {
  const p = person(personId);
  if (!p || !p.id) return;
  let active = tab;
  const media = mediaForPerson(p.id);
  const groups = groupsOf(p.id);
  const self = p.id === state.me;
  const closedGroups = groups.filter((g) => !g.members.includes(state.me)).length;

  const aboutHTML = () => `
    ${p.custom ? `<div class="about-block"><h4>Статус</h4><p>${esc(p.custom)}</p></div>` : ''}
    <div class="mc-stats">
      <div><b>${media.length}</b><span>медиа</span></div>
      <div><b>${groups.length}</b><span>групп</span></div>
      <div><b>${groups.length - closedGroups}</b><span>общих чатов</span></div>
      <div><b>${esc(fmtJoined(p.joined || Date.now()))}</b><span>в YouChat</span></div>
    </div>
    <div class="about-block"><h4>Обо мне</h4><p>${esc(p.bio || 'Пользователь пока ничего не рассказал о себе.')}</p></div>
    <div class="about-block"><h4>Адрес</h4><p>@${esc(p.username)} · <span class="status-pill"><span class="dot" data-st="${p.status}"></span>${statusText(p)}</span></p></div>`;

  const mediaHTML = () => media.length
    ? `<div class="gallery">${media.map((item, index) => `
        <button type="button" class="gal-item" data-media-index="${index}" aria-label="Открыть ${esc(item.a.title || 'медиа')}">
          <img src="${posterSrc(item.a)}" alt="${esc(item.a.title || 'Медиа')}">
          ${item.a.k === 'vid' ? `<span class="vtag">${icon('play')}</span>` : ''}
        </button>`).join('')}</div>
        <p class="hint" style="margin-top:10px">${media.length} файлов · клик открывает просмотрщик с навигацией</p>`
    : `<div class="tab-empty">Пока нет фото и видео. Стоит начать с чего-нибудь красивого.</div>`;

  const groupsHTML = () => groups.length
    ? `<div class="mem-list">${groups.map((g) => {
        const role = g.roles?.[p.id];
        return `<button type="button" class="mem-row" data-group-open="${g.id}">
          ${groupAvatarHTML(g, 36)}
          <span class="member-meta">
            <span class="member-name">${esc(g.name)}</span>
            <span class="member-sub">${membersLabel(g.members.length)} · ${esc(g.handle ? '@' + g.handle : '')}</span>
          </span>
          <span class="mem-role ${role === 'owner' ? 'owner' : ''}">${esc(roleLabel(role || 'member'))}</span>
        </button>`;
      }).join('')}</div>`
    : `<div class="tab-empty">Пользователь пока не состоит в группах.</div>`;

  const tabContent = () => active === 'media' ? mediaHTML() : active === 'groups' ? groupsHTML() : aboutHTML();

  const build = () => `
    <div class="mc-banner">${bannerHTML(p.banner, '', p.bannerImg)}</div>
    <div class="mc-top">
      <span class="mc-av">${avatarHTML(p, 88, { status: true, border: 'var(--bg-3)' })}</span>
      <div class="mc-id">
        <h2 class="mc-name">${esc(p.name)}${self ? '<span class="status-pill">это вы</span>' : ''}</h2>
        <div class="mc-handle">@${esc(p.username)} <span class="status-pill"><span class="dot" data-st="${p.status}"></span>${statusText(p)}</span></div>
      </div>
      <div class="mc-actions">
        ${self
          ? `<button type="button" class="btn primary" data-edit-profile>${icon('edit')}<span>Редактировать профиль</span></button>`
          : `<button type="button" class="btn primary" data-write-person="${p.id}">${icon('dm')}<span>Написать сообщение</span></button>`}
      </div>
    </div>
    <div class="mc-body">
      <div class="link-row">${icon('link')}<code>${esc(profileLink(p))}</code><button type="button" class="btn sm" data-copy-profile>Копировать</button></div>
      <div class="tabs" role="tablist" style="margin-top:14px">
        <button type="button" class="tab ${active === 'about' ? 'is-active' : ''}" data-ptab="about" role="tab" aria-selected="${active === 'about'}">Обо мне</button>
        <button type="button" class="tab ${active === 'media' ? 'is-active' : ''}" data-ptab="media" role="tab" aria-selected="${active === 'media'}">Медиа · ${media.length}</button>
        <button type="button" class="tab ${active === 'groups' ? 'is-active' : ''}" data-ptab="groups" role="tab" aria-selected="${active === 'groups'}">Группы · ${groups.length}</button>
      </div>
      ${tabContent()}
    </div>`;

  const mount = (modal) => {
    $$('[data-ptab]', modal).forEach((btn) => {
      btn.addEventListener('click', () => {
        active = btn.dataset.ptab;
        refreshModal(build(), mount, 'lg');
      });
    });
    const edit = $('[data-edit-profile]', modal);
    if (edit) edit.addEventListener('click', () => { closeAllModals(); openProfileEditor(); });
    const write = $('[data-write-person]', modal);
    if (write) write.addEventListener('click', () => openDM(write.dataset.writePerson));
    const copyProfile = $('[data-copy-profile]', modal);
    if (copyProfile) copyProfile.addEventListener('click', () => copyText(profileLink(p)));
    $$('[data-media-index]', modal).forEach((btn) => {
      btn.addEventListener('click', () => openLightbox(media, Number(btn.dataset.mediaIndex), { title: p.name }));
    });
    $$('[data-group-open]', modal).forEach((btn) => {
      btn.addEventListener('click', () => openGroupCard(btn.dataset.groupOpen));
    });
  };

  openModal(build(), { size: 'lg', label: `Профиль ${p.name}`, onMount: mount });
}

function membersTabHTML(conv) {
  const order = ['owner', 'admin', 'member'];
  const labels = { owner: 'Основатель', admin: 'Админы', member: 'Участники' };
  const rank = { online: 0, idle: 1, dnd: 2, offline: 3 };
  let html = '<div class="mem-list" style="gap:7px">';
  order.forEach((role) => {
    const ids = conv.members.filter((id) => (conv.roles?.[id] || 'member') === role);
    if (!ids.length) return;
    html += `<div class="mem-label" style="padding-left:2px">${labels[role]} <span>${ids.length}</span></div>`;
    ids.map((id) => person(id))
      .sort((a, b) => (rank[a.status] ?? 4) - (rank[b.status] ?? 4) || a.name.localeCompare(b.name, 'ru'))
      .forEach((p) => {
        const canMenu = canManageMember(conv, p.id);
        html += `<div class="member-wrap">
          <button type="button" class="mem-row" data-profile-open="${p.id}">
            ${avatarHTML(p, 38, { status: true, border: 'var(--bg-3)' })}
            <span class="member-meta">
              <span class="member-name">${esc(p.name)}</span>
              <span class="member-sub">${esc(p.custom || statusText(p))}</span>
            </span>
            <span class="mem-role ${role === 'owner' ? 'owner' : ''}">${esc(roleLabel(role))}</span>
          </button>
          ${canMenu ? `<button type="button" class="member-menu-btn" data-member-menu="${conv.id}|${p.id}" aria-label="Действия с участником">${icon('more')}</button>` : ''}
        </div>`;
      });
  });
  return html + '</div>';
}

function openGroupCard(convId, tab = 'members') {
  const conv = findConv(convId);
  if (!conv || conv.type !== 'group') return;
  let active = tab;
  const media = collectMedia(conv);
  const canManage = ['owner', 'admin'].includes(conv.roles?.[state.me]);
  const canEditGroup = isOwner(conv);
  const owner = person(conv.members.find((id) => conv.roles?.[id] === 'owner') || conv.members[0]);
  const isMember = conv.members.includes(state.me);
  const requests = conv.joinRequests || [];
  const showRequests = isGroupAdmin(conv) && conv.requestsOn !== false;
  const showAdmin = isGroupAdmin(conv);

  const aboutHTML = () => `
    <p class="mc-desc">${esc(conv.desc || 'Описание пока не добавлено.')}</p>
    <div class="link-row">${icon('link')}<code>${esc(groupLink(conv))}</code><button type="button" class="btn sm" data-copy-group>Копировать</button></div>
    <div class="about-rows" style="margin-top:16px">
      <div><span>Создана</span><b>${esc(fmtDayLong(conv.created || Date.now()))}</b></div>
      <div><span>Владелец</span><b>${esc(owner.name)}</b></div>
      <div><span>Доступ</span><b>${conv.access === 'open' ? icon('unlock') : icon('lock')} ${esc(accessLabel(conv))}</b></div>
      <div><span>Заявки</span><b>${conv.requestsOn === false ? 'Выключены' : 'Включены'}</b></div>
      <div><span>Медиа</span><b>${media.length} файлов</b></div>
    </div>
    <div class="about-block"><h4>Роли</h4><p>Владелец — создатель группы: только он меняет настройки, назначает админов и может передать владение. Админы следят за порядком в рамках выданных прав. Участники общаются и делятся медиа.</p></div>`;

  const requestsHTML = () => {
    if (!showRequests) return `<div class="tab-empty">Заявки видят владелец и админы.</div>`;
    const canDecide = adminPerm(conv, 'acceptRequests');
    if (!canDecide) return `<div class="tab-empty">Владелец не дал админам право принимать заявки.</div>`;
    if (!requests.length) {
      return `<div class="req-empty">
        <span>Пока никто не просится в группу.</span>
      </div>`;
    }
    return `<div class="req-list">${requests.map((r) => {
      const p = person(r.personId);
      return `<div class="req-row">
        ${avatarHTML(p, 36, { status: true, border: 'var(--bg-3)' })}
        <span class="member-meta">
          <span class="member-name">${esc(p.name)}</span>
          <span class="member-sub">@${esc(p.username)} · ${fmtShort(r.at)}</span>
        </span>
        <button type="button" class="btn sm primary" data-req-accept="${r.id}">Принять</button>
        <button type="button" class="btn sm" data-req-reject="${r.id}">Отклонить</button>
      </div>`;
    }).join('')}</div>`;
  };

  const mediaHTML = () => media.length
    ? `<div class="gallery">${media.map((item, index) => `
        <button type="button" class="gal-item" data-card-media="${index}" aria-label="Открыть ${esc(item.a.title || 'медиа')}">
          <img src="${posterSrc(item.a)}" alt="${esc(item.a.title || 'Медиа')}">
          ${item.a.k === 'vid' ? `<span class="vtag">${icon('play')}</span>` : ''}
        </button>`).join('')}</div>
        <p class="hint" style="margin-top:10px">Все фото и видео из переписки группы</p>`
    : `<div class="tab-empty">В группе пока нет фото и видео.</div>`;

  const adminHTML = () => {
    const perms = conv.perms?.admins || {};
    const admins = conv.members.filter((id) => conv.roles?.[id] === 'admin').length;
    const msgs = conv.messages.filter((m) => !m.sys && !m.deleted).length;
    const stat = (n, label) => `<div class="adm-stat"><b>${n}</b><span>${label}</span></div>`;
    const permRow = (key, title, hint) => `<label class="perm-row">
      <span class="switch-meta"><b>${title}</b><span>${hint}</span></span>
      <input type="checkbox" data-perm="${key}" ${perms[key] !== false ? 'checked' : ''} ${isOwner(conv) ? '' : 'disabled'}>
    </label>`;
    const log = (conv.audit || []).slice(0, 20).map((e) => `<div class="adm-log"><span>${esc(fmtShort(e.t))}</span><b>${esc(person(e.by).name.split(' ')[0])}</b><span class="adm-log-text">${esc(e.text)}</span></div>`).join('');
    return `<div class="adm-stats">${stat(conv.members.length, 'участников')}${stat(admins, 'админов')}${stat(msgs, 'сообщений')}${stat(requests.length, 'заявок')}</div>
      ${requests.length && adminPerm(conv, 'acceptRequests') ? `<button type="button" class="btn sm primary adm-bulk" data-accept-all>${icon('user-plus')}<span>Принять все заявки · ${requests.length}</span></button>` : ''}
      <div class="about-block"><h4>Права админов</h4>${isOwner(conv) ? '' : '<p class="hint" style="margin:0 0 6px">Менять права может только владелец.</p>'}
        <div class="perms">
          ${permRow('deleteMessages', 'Удалять чужие сообщения', 'Иначе админ удаляет только свои.')}
          ${permRow('removeMembers', 'Исключать участников', 'Только обычных участников — админов исключает владелец.')}
          ${permRow('acceptRequests', 'Принимать заявки', 'Одобрять вступление по ссылке.')}
        </div>
      </div>
      <div class="about-block"><h4>Журнал действий</h4>${log || '<p class="hint" style="margin:0">Пока пусто — здесь появятся действия владельца и админов.</p>'}</div>`;
  };

  const content = () => active === 'admin' ? adminHTML() : active === 'media' ? mediaHTML() : active === 'about' ? aboutHTML() : active === 'requests' ? requestsHTML() : membersTabHTML(conv);

  const build = () => `
    <div class="mc-banner">${bannerHTML(conv.banner, '', conv.bannerImg)}</div>
    <div class="mc-top">
      <span class="mc-av">${groupAvatarHTML(conv, 88)}</span>
      <div class="mc-id">
        <h2 class="mc-name">${esc(conv.name)}${conv.access === 'open' ? icon('unlock') : icon('lock')}</h2>
        <div class="mc-handle">@${esc(conv.handle || 'group')} <span class="status-pill">${membersLabel(conv.members.length)}</span> <span class="status-pill">${groupOnlineCount(conv)} в сети</span> <span class="status-pill">${esc(accessLabel(conv))}</span></div>
      </div>
      <div class="mc-actions">
        ${canManage ? `<button type="button" class="btn primary" data-invite-people>${icon('user-plus')}<span>Пригласить</span></button>` : ''}
        ${canEditGroup ? `<button type="button" class="btn" data-edit-group>${icon('edit')}<span>Изменить</span></button>` : ''}
        ${isMember && !isOwner(conv) ? `<button type="button" class="btn danger" data-leave-group>${icon('logout')}<span>Покинуть</span></button>` : isOwner(conv) ? `<p class="hint">Владелец не может покинуть группу, пока не передаст владение.</p>` : ''}
      </div>
    </div>
    <div class="mc-body">
      ${conv.desc ? `<p class="mc-desc">${esc(conv.desc)}</p>` : ''}
      <div class="link-row">${icon('link')}<code>${esc(groupLink(conv))}</code><button type="button" class="btn sm" data-copy-group>Копировать</button></div>
      <div class="tabs" role="tablist" style="margin-top:14px">
        <button type="button" class="tab ${active === 'members' ? 'is-active' : ''}" data-gtab="members" role="tab" aria-selected="${active === 'members'}">Участники · ${conv.members.length}</button>
        <button type="button" class="tab ${active === 'media' ? 'is-active' : ''}" data-gtab="media" role="tab" aria-selected="${active === 'media'}">Медиа · ${media.length}</button>
        ${showRequests ? `<button type="button" class="tab ${active === 'requests' ? 'is-active' : ''}" data-gtab="requests" role="tab" aria-selected="${active === 'requests'}">Заявки · ${requests.length}</button>` : ''}
        ${showAdmin ? `<button type="button" class="tab ${active === 'admin' ? 'is-active' : ''}" data-gtab="admin" role="tab" aria-selected="${active === 'admin'}">${icon('shield')}Управление</button>` : ''}
        <button type="button" class="tab ${active === 'about' ? 'is-active' : ''}" data-gtab="about" role="tab" aria-selected="${active === 'about'}">О группе</button>
      </div>
      ${content()}
    </div>`;

  const mount = (modal) => {
    $$('[data-gtab]', modal).forEach((btn) => {
      btn.addEventListener('click', () => {
        active = btn.dataset.gtab;
        refreshModal(build(), mount, 'xl');
      });
    });
    $$('[data-profile-open]', modal).forEach((btn) => {
      btn.addEventListener('click', () => { closeAllModals(); openProfile(btn.dataset.profileOpen); });
    });
    $$('[data-card-media]', modal).forEach((btn) => {
      btn.addEventListener('click', () => openLightbox(media, Number(btn.dataset.cardMedia)));
    });
    const edit = $('[data-edit-group]', modal);
    if (edit) edit.addEventListener('click', () => { closeAllModals(); openGroupEditor(conv.id); });
    const invite = $('[data-invite-people]', modal);
    if (invite) invite.addEventListener('click', () => { closeAllModals(); openInvite(conv.id); });
    const leave = $('[data-leave-group]', modal);
    if (leave) leave.addEventListener('click', () => {
      openConfirm({
        title: `Покинуть «${conv.name}»?`,
        text: 'Группа исчезнет из вашего списка вместе с историей сообщений и вложениями.',
        confirmLabel: 'Покинуть группу',
        danger: true,
        onConfirm: () => removeConversation(conv)
      });
    });
    const copyGroup = $('[data-copy-group]', modal);
    if (copyGroup) copyGroup.addEventListener('click', () => copyText(groupLink(conv)));
    $$('[data-req-accept]', modal).forEach((btn) => btn.addEventListener('click', () => decideRequest(conv.id, btn.dataset.reqAccept, true)));
    $$('[data-req-reject]', modal).forEach((btn) => btn.addEventListener('click', () => decideRequest(conv.id, btn.dataset.reqReject, false)));
    $$('[data-perm]', modal).forEach((input) => input.addEventListener('change', () => {
      setAdminPerm(conv.id, input.dataset.perm, input.checked);
      toast('Права обновлены', 'ok');
    }));
    const acceptAll = $('[data-accept-all]', modal);
    if (acceptAll) acceptAll.addEventListener('click', () => acceptAllRequests(conv.id));
  };

  openModal(build(), { size: 'xl', label: `Группа ${conv.name}`, onMount: mount });
}

function openPins(conv) {
  const target = conv || activeConv();
  if (!target) return;
  const ids = target.pinnedMsgs || [];
  const msgs = ids.map((id) => target.messages.find((m) => m.id === id)).filter(Boolean);
  const rows = msgs.length ? msgs.map((m) => {
    const a = person(m.author);
    const snippet = m.text || (m.att?.length ? (m.att[0].k === 'vid' ? 'Видео' : `Фото · ${m.att.length}`) : 'Сообщение');
    return `<div class="pin-row">
      <button type="button" class="pin-main" data-pin-jump="${m.id}">
        ${avatarHTML(a, 36, { status: true, border: '#161618' })}
        <span class="pin-meta">
          <span class="pin-top"><b>${esc(a.name)}</b><span>${fmtShort(m.t)}</span></span>
          <span class="pin-text">${esc(snippet.slice(0, 150))}</span>
        </span>
      </button>
      <button type="button" class="icon-btn sm" data-pin-remove="${m.id}" aria-label="Открепить сообщение">${icon('close')}</button>
    </div>`;
  }).join('') : `<div class="tab-empty">В этой беседе пока нет закреплённых сообщений.</div>`;

  const html = `<div class="modal-pad">
    <h2 class="modal-title">Закреплённые сообщения</h2>
    <p class="modal-sub">${msgs.length ? `${msgs.length} в «${esc(convTitle(target))}»` : 'Здесь появятся важные сообщения'}</p>
    <div class="pin-list">${rows}</div>
  </div>`;

  openModal(html, {
    size: 'md',
    label: 'Закреплённые сообщения',
    onMount: (modal) => {
      $$('[data-pin-jump]', modal).forEach((btn) => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.pinJump;
          closeAllModals();
          if (typeof closeSearchPanel === 'function') closeSearchPanel();
          setTimeout(() => scrollToMessage(id), 160);
        });
      });
      $$('[data-pin-remove]', modal).forEach((btn) => {
        btn.addEventListener('click', () => {
          togglePin(btn.dataset.pinRemove);
          closeAllModals();
          openPins(target);
        });
      });
    }
  });
}

function openMediaGallery(items, title) {
  if (!items.length) return;
  const html = `<div class="modal-pad">
    <h2 class="modal-title">${esc(title || 'Медиа')}</h2>
    <p class="modal-sub">${items.length} фото и видео · клик открывает просмотрщик</p>
    <div class="gallery">
      ${items.map((item, index) => `
        <button type="button" class="gal-item" data-gal-index="${index}" aria-label="Открыть ${esc(item.a.title || 'медиа')}">
          <img src="${posterSrc(item.a)}" alt="${esc(item.a.title || 'Медиа')}">
          ${item.a.k === 'vid' ? `<span class="vtag">${icon('play')}</span>` : ''}
        </button>`).join('')}
    </div>
  </div>`;
  openModal(html, {
    size: 'lg',
    label: 'Медиа',
    onMount: (modal) => {
      $$('[data-gal-index]', modal).forEach((btn) => {
        btn.addEventListener('click', () => openLightbox(items, Number(btn.dataset.galIndex), { title }));
      });
    }
  });
}

function openInvite(convId) {
  const conv = findConv(convId);
  if (!conv) return;
  const candidates = contacts().filter((p) => !conv.members.includes(p.id));
  if (!candidates.length) {
    openModal(`<div class="modal-pad">
      <h2 class="modal-title">Пригласить в группу</h2>
      <p class="modal-sub">Добавить можно только тех, с кем вы уже переписывались. Сейчас таких нет или все уже в группе.</p>
      <div class="form-actions"><button type="button" class="btn primary" data-modal-close>Понятно</button></div>
    </div>`, { size: 'sm', label: 'Пригласить' });
    return;
  }
  const html = `<div class="modal-pad">
    <h2 class="modal-title">Пригласить в «${esc(conv.name)}»</h2>
    <p class="modal-sub">Ссылка открывает вступление в группу (${esc(accessLabel(conv).toLowerCase())}). Или добавьте людей сразу.</p>
    <div class="link-row">${icon('link')}<code>${esc(groupLink(conv))}</code><button type="button" class="btn sm" data-copy-invite>Копировать</button></div>
    <form id="inviteForm" novalidate style="margin-top:12px">
      <div class="pick-list" style="max-height:320px;overflow:auto;margin:6px -6px 4px">
        ${candidates.map((p) => `<label class="pick">
          ${avatarHTML(p, 34, { status: true, border: '#161618' })}
          <span class="pick-meta"><span class="pick-name">${esc(p.name)}</span><span class="pick-sub">@${esc(p.username)} · ${esc(p.custom || statusText(p))}</span></span>
          <input type="checkbox" value="${p.id}">
        </label>`).join('')}
      </div>
      <div class="form-actions">
        <button type="button" class="btn" data-modal-close>Отмена</button>
        <button type="submit" class="btn primary">${icon('user-plus')}<span>Добавить</span></button>
      </div>
    </form>
  </div>`;
  openModal(html, {
    size: 'md',
    label: 'Пригласить в группу',
    onMount: (modal) => {
      const copyInvite = $('[data-copy-invite]', modal);
      if (copyInvite) copyInvite.addEventListener('click', () => copyText(groupLink(conv)));
      $$('.pick input', modal).forEach((input) => {
        input.addEventListener('change', () => input.closest('.pick').classList.toggle('is-on', input.checked));
      });
      $('#inviteForm', modal).addEventListener('submit', async (event) => {
        event.preventDefault();
        const ids = $$('.pick input:checked', modal).map((i) => i.value);
        if (!ids.length) { toast('Выберите хотя бы одного человека', 'warn'); return; }
        if (typeof NET !== 'undefined' && NET.online) {
          try {
            await NET.addMembers(conv, ids);
          } catch (error) {
            toast(error.message || 'Не удалось добавить участников', 'warn');
            return;
          }
          closeAllModals();
          renderAll();
          openGroupCard(conv.id, 'members');
          toast(ids.length === 1 ? 'Участник добавлен' : `Добавлено: ${ids.length}`, 'ok');
          return;
        }
        ids.forEach((id) => {
          if (!conv.members.includes(id)) {
            conv.members.push(id);
            conv.roles[id] = 'member';
          }
        });
        conv.messages.push({
          id: uid('m'), author: state.me, t: Date.now(), sys: `${me().name} добавила в группу: ${ids.map((id) => person(id).name).join(', ')}`,
          text: '', att: [], react: {}, reply: null, pinned: false
        });
        closeAllModals();
        renderAll();
        openGroupCard(conv.id, 'members');
        persist();
        toast(ids.length === 1 ? 'Участник добавлен' : `Добавлено: ${ids.length}`, 'ok');
      });
    }
  });
}

</script>
<script>
/* editors.js */
'use strict';

function bannerPickerHTML(draft) {
  return `<div data-banner-picker>
    <div class="bn-gallery">
      <div class="bn-shot" data-bn-shot>${draft.bannerImg ? `<img src="${draft.bannerImg}" alt="">` : '<span>Загрузите своё фото — оно станет баннером</span>'}</div>
      <div class="bn-gallery-actions">
        <button type="button" class="btn sm primary" data-bn-upload>${icon('image')}<span>Загрузить из галереи</span></button>
        <button type="button" class="btn sm" data-bn-clear ${draft.bannerImg ? '' : 'disabled'}>Убрать фото</button>
      </div>
    </div>
    <input type="file" accept="image/*,video/*" data-bn-file hidden aria-label="Баннер из галереи">
  </div>`;
}

function syncBannerPicker(container, draft) {
  if (!container) return;
  $$('[data-banner-pick]', container).forEach((btn) => {
    const on = !draft.bannerImg && btn.dataset.bannerPick === draft.banner;
    btn.classList.toggle('is-active', on);
    btn.setAttribute('aria-pressed', String(on));
    const tick = $('.bn-tick', btn);
    if (on && !tick) btn.insertAdjacentHTML('beforeend', `<span class="bn-tick">${icon('check')}</span>`);
    if (!on && tick) tick.remove();
  });
  const shot = $('[data-bn-shot]', container);
  if (shot) shot.innerHTML = draft.bannerImg ? `<img src="${draft.bannerImg}" alt="">` : '<span>Загрузите своё фото — оно станет баннером</span>';
  const clear = $('[data-bn-clear]', container);
  if (clear) clear.disabled = !draft.bannerImg;
}

function bindBannerPicks(container, draft, onChange) {
  $$('[data-bn-tab]', container).forEach((tab) => {
    tab.addEventListener('click', () => {
      const name = tab.dataset.bnTab;
      $$('[data-bn-tab]', container).forEach((btn) => {
        const on = btn === tab;
        btn.classList.toggle('is-on', on);
        btn.setAttribute('aria-selected', String(on));
      });
      $$('[data-bn-panel]', container).forEach((panel) => { panel.hidden = panel.dataset.bnPanel !== name; });
    });
  });
  $$('[data-banner-pick]', container).forEach((btn) => {
    btn.addEventListener('click', () => {
      draft.banner = btn.dataset.bannerPick;
      draft.bannerImg = '';
      syncBannerPicker(container, draft);
      onChange();
    });
  });
  const file = $('[data-bn-file]', container);
  const upload = $('[data-bn-upload]', container);
  if (upload && file) upload.addEventListener('click', () => file.click());
  const preview = container.closest('.modal')?.querySelector('.ep-banner');
  if (preview && file) { preview.classList.add('is-editable'); preview.addEventListener('click', () => file.click()); }
  if (file) {
    file.addEventListener('change', async (event) => {
      const chosen = event.target.files?.[0];
      event.target.value = '';
      if (!chosen) return;
      if (!/^(image|video)\//.test(chosen.type)) { toast('Нужно фото или видео', 'warn'); return; }
      const cropped = await cropMedia(chosen, 'banner');
      if (!cropped) return;
      draft.bannerImg = cropped;
      syncBannerPicker(container, draft);
      onChange();
      toast('Баннер готов', 'ok');
    });
  }
  const clear = $('[data-bn-clear]', container);
  if (clear) {
    clear.addEventListener('click', () => {
      draft.bannerImg = '';
      syncBannerPicker(container, draft);
      onChange();
      toast('Баннер убран', 'ok');
    });
  }
}

function bindHandleInput(input, draft, paint, selfId = null) {
  input.addEventListener('input', () => {
    const clean = cleanHandle(input.value);
    input.value = clean;
    draft.handle = clean;
    if (clean.length >= 3 && handleTaken('group', clean, selfId)) {
      markFieldError(input, true, 'Такой адрес уже занят');
    } else {
      markFieldError(input, false);
    }
    paint();
  });
}

function markFieldError(input, hasError, message) {
  if (!input) return;
  const field = input.closest('.field');
  if (field) {
    field.classList.toggle('has-err', hasError);
    if (message) {
      const err = $('.err-text', field);
      if (err) err.textContent = message;
    }
  }
  input.classList.toggle('err', hasError);
}

function fileToAvatar(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      try {
        const side = Math.min(image.naturalWidth, image.naturalHeight);
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        canvas.getContext('2d').drawImage(
          image,
          (image.naturalWidth - side) / 2,
          (image.naturalHeight - side) / 2,
          side, side, 0, 0, 256, 256
        );
        resolve(canvas.toDataURL('image/jpeg', 0.9));
      } catch (error) {
        reject(error);
      } finally {
        URL.revokeObjectURL(url);
      }
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('image'));
    };
    image.src = url;
  });
}

function fileToBanner(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      try {
        const ratio = 1200 / 480;
        const sourceRatio = image.naturalWidth / image.naturalHeight;
        let sw = image.naturalWidth;
        let sh = image.naturalHeight;
        if (sourceRatio > ratio) sw = image.naturalHeight * ratio;
        else sh = image.naturalWidth / ratio;
        const canvas = document.createElement('canvas');
        canvas.width = 1200;
        canvas.height = 480;
        canvas.getContext('2d').drawImage(
          image,
          (image.naturalWidth - sw) / 2, (image.naturalHeight - sh) / 2, sw, sh,
          0, 0, 1200, 480
        );
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      } catch (error) {
        reject(error);
      } finally {
        URL.revokeObjectURL(url);
      }
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('image'));
    };
    image.src = url;
  });
}

function setHandleState(node, kind, value, selfId = null) {
  if (!node) return;
  if (!value) { node.textContent = ''; node.className = 'field-note'; return; }
  if (value.length < 3) { node.textContent = 'Минимум 3 символа'; node.className = 'field-note warn'; return; }
  if (handleTaken(kind, value, selfId)) {
    node.textContent = 'Занят — выберите другой';
    node.className = 'field-note bad';
    return;
  }
  node.textContent = 'Свободен';
  node.className = 'field-note ok';
}

function swatchesHTML(selected) {
  return GRADS.map((grad, index) => `
    <button type="button" class="swatch ${index === selected ? 'is-active' : ''}" data-grad="${index}"
      style="--g1:${grad[0]};--g2:${grad[1]}" aria-label="Цвет аватара ${index + 1}" aria-pressed="${index === selected}"></button>`).join('');
}

function openProfileEditor() {
  const source = me();
  const draft = {
    name: source.name, username: source.username, custom: source.custom || '',
    bio: source.bio || '', grad: source.grad || 0, banner: source.banner || 'mono',
    bannerImg: source.bannerImg || '', avatar: source.avatar || null
  };
  const html = `<div class="modal-pad">
    <h2 class="modal-title">Редактировать профиль</h2>
    <p class="modal-sub">Этот профиль видят участники групп и личных переписок.</p>
    <div class="editor-preview">
      <div class="ep-banner" id="epBanner">${bannerHTML(draft.banner, '', draft.bannerImg)}</div>
      <div class="ep-row">
        <span class="av-edit">
          <span class="ep-av" id="epAvatar">${avatarHTML(draft, 76, { status: true, border: '#141416' })}</span>
          <button type="button" class="av-edit-btn" id="avatarPick" aria-label="Загрузить фото профиля">${icon('camera')}</button>
        </span>
        <div class="ep-id">
          <div class="ep-name" id="epName">${esc(draft.name)}</div>
          <div class="ep-user" id="epUser">@${esc(draft.username)}</div>
        </div>
      </div>
      <div class="ep-bio" id="epBio">${esc(draft.bio || 'Пара строк о себе — и профиль станет живым.')}</div>
    </div>
    <form id="profileForm" novalidate>
      <div class="form-grid">
        <div class="field">
          <label class="flabel" for="pfName">Отображаемое имя</label>
          <input class="input" id="pfName" maxlength="32" value="${esc(draft.name)}" autocomplete="off">
          <div class="err-text">Введите имя (минимум 2 символа)</div>
        </div>
        <div class="field">
          <label class="flabel" for="pfUser">Короткий адрес</label>
          <input class="input" id="pfUser" maxlength="24" value="${esc(draft.username)}" autocomplete="off">
          <div class="err-text">Только латиница, цифры и _ — 3–24 символа</div>
          <div class="field-note" id="pfUserState"></div>
        </div>
      </div>
      <div class="field">
        <label class="flabel" for="pfStatus">Статус</label>
        <input class="input" id="pfStatus" maxlength="48" value="${esc(draft.custom)}" >
      </div>
      <div class="field">
        <label class="flabel" for="pfBio">О себе</label>
        <textarea class="input" id="pfBio" maxlength="190" >${esc(draft.bio)}</textarea>
        <div class="hint">До 190 символов. Показывается в профиле и карточке.</div>
      </div>
      <div class="field">
        <span class="flabel">Аватар</span>
        <div class="swatches" id="pfSwatches">${swatchesHTML(draft.grad)}</div>
        <div class="hint" style="margin-top:8px">Выберите фото или видео из галереи и сами выберите, что попадёт в круг.</div>
        <div class="av-pick-row">
          <button type="button" class="btn sm" id="avatarPickBtn">${icon('image')}<span>Выбрать из галереи</span></button>
          <button type="button" class="btn ghost sm" id="avatarClear">Убрать фото</button>
        </div>
      </div>
      <div class="field">
        <span class="flabel">Баннер профиля</span>
        <div class="hint" style="margin:-1px 0 8px">Загрузите фото из галереи — оно станет баннером профиля.</div>
        <div id="bannerPicker">${bannerPickerHTML(draft)}</div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn" data-cancel-edit>Отмена</button>
        <button type="submit" class="btn primary">${icon('check')}<span>Сохранить</span></button>
      </div>
    </form>
    <input type="file" id="avatarFile" accept="image/*,video/*" hidden aria-label="Загрузить фото профиля">
  </div>`;

  const mount = (modal) => {
    const previewAvatar = () => {
      $('#epAvatar', modal).innerHTML = avatarHTML(draft, 76, { status: true, border: '#141416' });
    };
    const previewText = () => {
      $('#epName', modal).textContent = draft.name || 'Без имени';
      $('#epUser', modal).textContent = '@' + (draft.username || 'username');
      $('#epBio', modal).textContent = draft.bio || 'Пара строк о себе — и профиль станет живым.';
    };

    $('#pfName', modal).addEventListener('input', (event) => {
      draft.name = event.target.value;
      markFieldError(event.target, false);
      previewText();
      previewAvatar();
    });
    const userState = $('#pfUserState', modal);
    setHandleState(userState, 'person', draft.username, state.me);
    $('#pfUser', modal).addEventListener('input', (event) => {
      const clean = cleanHandle(event.target.value, false);
      event.target.value = clean;
      draft.username = clean;
      setHandleState(userState, 'person', clean, state.me);
      if (clean.length >= 3 && handleTaken('person', clean, state.me)) {
        markFieldError(event.target, true, 'Этот адрес уже занят');
      } else {
        markFieldError(event.target, false);
      }
      previewText();
    });
    $('#pfStatus', modal).addEventListener('input', (event) => { draft.custom = event.target.value; });
    $('#pfBio', modal).addEventListener('input', (event) => {
      draft.bio = event.target.value;
      previewText();
    });
    $$('[data-grad]', modal).forEach((btn) => {
      btn.addEventListener('click', () => {
        draft.grad = Number(btn.dataset.grad);
        $$('[data-grad]', modal).forEach((b) => {
          b.classList.toggle('is-active', b === btn);
          b.setAttribute('aria-pressed', String(b === btn));
        });
        previewAvatar();
      });
    });

    const picker = $('#bannerPicker', modal);
    const paintBanner = () => {
      $('#epBanner', modal).innerHTML = bannerHTML(draft.banner, '', draft.bannerImg);
    };
    bindBannerPicks(picker, draft, paintBanner);

    const openAvatarPicker = () => $('#avatarFile', modal).click();

    const avatarPickBtn = $('#avatarPickBtn', modal);
    if (avatarPickBtn) avatarPickBtn.addEventListener('click', openAvatarPicker);
    $('#avatarFile', modal).addEventListener('change', async (event) => {
      const file = event.target.files?.[0];
      if (!file) return;
      event.target.value = '';
      if (!/^(image|video)\//.test(file.type)) { toast('Нужно фото или видео', 'warn'); return; }
      const cropped = await cropMedia(file, 'avatar');
      if (!cropped) return;
      draft.avatar = cropped;
      previewAvatar();
      toast('Фото профиля готово', 'ok');
    });
    $('#avatarClear', modal).addEventListener('click', () => {
      draft.avatar = null;
      previewAvatar();
      toast('Фото профиля убрано', 'ok');
    });
    $('[data-cancel-edit]', modal).addEventListener('click', closeModal);

    $('#profileForm', modal).addEventListener('submit', async (event) => {
      event.preventDefault();
      const nameInput = $('#pfName', modal);
      const userInput = $('#pfUser', modal);
      const name = nameInput.value.trim();
      const username = userInput.value.trim().toLowerCase();
      let bad = false;
      if (name.length < 2) {
        markFieldError(nameInput, true, 'Введите имя (минимум 2 символа)');
        bad = true;
      } else {
        markFieldError(nameInput, false);
      }
      if (!/^[a-z0-9_]{3,24}$/.test(username)) {
        markFieldError(userInput, true, 'Только латиница, цифры и _ — от 3 до 24 символов');
        bad = true;
      } else if (handleTaken('person', username, state.me)) {
        markFieldError(userInput, true, 'Этот адрес уже занят');
        bad = true;
      } else {
        markFieldError(userInput, false);
      }
      if (bad) {
        toast('Проверьте имя и адрес', 'warn');
        return;
      }
      const patch = {
        name,
        username,
        custom: draft.custom.trim().slice(0, 48),
        bio: draft.bio.trim().slice(0, 190),
        grad: draft.grad,
        banner: draft.banner,
        bannerImg: draft.bannerImg || '',
        avatar: draft.avatar
      };
      if (typeof NET !== 'undefined' && NET.online) {
        try {
          await NET.saveProfile(patch);
        } catch (error) {
          toast(error.message || 'Не удалось сохранить профиль', 'warn');
          return;
        }
      }
      Object.assign(state.people[state.me], patch);
      closeAllModals();
      renderAll();
      persist();
      openProfile(state.me);
      toast('Профиль обновлён', 'ok');
    });
  };

  openModal(html, { size: 'lg', label: 'Редактировать профиль', onMount: mount });
}

function groupIconInner(draft, text) {
  return draft.avatar
    ? `<img src="${draft.avatar}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;position:relative">`
    : `<span>${esc(text)}</span>`;
}

function bindGroupPhoto(modal, draft, paintIcon) {
  const file = document.createElement('input');
  file.type = 'file';
  file.accept = 'image/*,video/*';
  const pick = () => file.click();
  const btn = $('[data-grp-photo]', modal);
  const clear = $('[data-grp-photo-clear]', modal);
  const icon0 = $('#grpIcon', modal);
  if (btn) btn.addEventListener('click', pick);
  if (icon0) { icon0.style.cursor = 'pointer'; icon0.addEventListener('click', pick); }
  file.addEventListener('change', async () => {
    const chosen = file.files?.[0];
    file.value = '';
    if (!chosen) return;
    if (!/^(image|video)\//.test(chosen.type)) { toast('Нужно фото или видео', 'warn'); return; }
    const cropped = await cropMedia(chosen, 'avatar');
    if (!cropped) return;
    draft.avatar = cropped;
    if (clear) clear.disabled = false;
    paintIcon();
  });
  if (clear) clear.addEventListener('click', () => { draft.avatar = ''; clear.disabled = true; paintIcon(); });
}

function groupMemberPickerHTML(selected) {

  return list
    .map((p) => `<label class="pick ${selected.includes(p.id) ? 'is-on' : ''}">

      <span class="pick-meta">

            deleteMessages: Boolean($('#permDelete', modal)?.checked),
            removeMembers: Boolean($('#permRemove', modal)?.checked),
            acceptRequests: Boolean($('#permRequests', modal)?.checked)
          }
        }
      };
      if (typeof NET !== 'undefined' && NET.online) {
        try {
          await NET.updateGroup(conv, patch);
        } catch (error) {
          toast(error.message || 'Не удалось сохранить настройки группы', 'warn');
          return;
        }
      }
      Object.assign(conv, patch);
      closeAllModals();
      renderAll();
      openGroupCard(conv.id, 'members');
      persist();
      toast('Группа обновлена', 'ok');
    });
  };

  openModal(html, { size: 'lg', label: 'Настроить группу', onMount: mount });
}

</script>
<script>
/* app.js */
'use strict';

const ui = {
  view: 'all',
  filter: '',
  msgQuery: '',
  replyTo: null,
  pending: [],
  emojiReady: false
};

let emojiReady = false;
let suppressPopover = false;

function scrollBottom(smooth = false) {
  const scroller = $('#chatScroll');
  if (!scroller) return;
  scroller.scrollTo({ top: scroller.scrollHeight, behavior: smooth && !reducedMotion ? 'smooth' : 'auto' });
}

function groupOnlineCount(conv) {
  return conv.members.filter((id) => ['online', 'idle'].includes(person(id).status)).length;
}

function renderAll() {
  if (!state.conversations.length) state.activeId = null;
  if (state.activeId && !findConv(state.activeId)) state.activeId = state.conversations[0]?.id || null;
  renderRail();
  renderSidebar();
  renderChat();
  renderMe();
  refreshTitle();
}

function renderMe() {
  const p = me();
  $('#meAvatar').innerHTML = avatarHTML(p, 30);
  $('#meName').textContent = p.name;
  $('#meStatus').textContent = p.custom || statusText(p);
  $('#btnMic').setAttribute('aria-pressed', state.prefs.micMuted ? 'false' : 'true');
  $('#btnSound').setAttribute('aria-pressed', state.prefs.soundOff ? 'false' : 'true');
}

function renderRail() {
  $$('.rail-btn[data-view]').forEach((btn) => {
    const on = ui.view === btn.dataset.view;
    btn.classList.toggle('is-active', on);
    btn.setAttribute('aria-pressed', String(on));
  });
  const groups = state.conversations.filter((c) => c.type === 'group');
  $('#railShortcuts').innerHTML = groups.map((conv) => {
    const grad = GRADS[(conv.grad || 0) % GRADS.length];
    return `<button class="rail-shortcut ${conv.id === state.activeId ? 'is-active' : ''}" data-rail-conv="${conv.id}"
      style="--g1:${grad[0]};--g2:${grad[1]}" aria-label="Открыть группу «${esc(conv.name)}»" data-tip="${esc(conv.name)}">${esc(conv.icon || monogram(conv.name))}</button>`;
  }).join('');
}

function lastTs(conv) {
  const msg = lastMessage(conv);
  return msg ? msg.t : 0;
}

function matchConv(conv, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  const name = convTitle(conv).toLowerCase();
  const handle = String(conv.handle || '').toLowerCase();
  const user = conv.type === 'dm' ? person(conv.peer).username.toLowerCase() : '';
  return name.includes(q) || handle.includes(q) || user.includes(q);
}

function convItemHTML(conv) {
  const msg = lastMessage(conv);
  const grp = conv.type === 'group';
  const id = conv.id;
  const active = state.activeId === id;
  const role = grp ? conv.roles?.[state.me] : null;
  const preview = previewOf(conv);
  const time = msg ? fmtShort(msg.t) : '';
  const badge = conv.unread ? `<span class="conv-badge">${conv.unread > 99 ? '99+' : conv.unread}</span>` : '';
  const pin = conv.pinned ? `<span class="conv-pin" title="Закреплено">${icon('pin')}</span>` : '';
  return `<div class="conv ${active ? 'is-active' : ''} ${conv.unread ? 'unread' : ''}" role="button" tabindex="0" data-conv="${id}" aria-label="${esc(convTitle(conv))}${conv.unread ? `, ${conv.unread} непрочитанных` : ''}">
    <span class="conv-av">${convAvatarHTML(conv, 40, { status: !grp, border: 'var(--bg-1)' })}</span>
    <span class="conv-main">
      <span class="conv-row">
        <span class="conv-name">${esc(convTitle(conv))}</span>
        ${pin}
        <span class="conv-time">${time}</span>
      </span>
      <span class="conv-row">
        <span class="conv-prev">${esc(preview)}</span>
        ${badge}
      </span>
    </span>
    <button type="button" class="conv-more" data-conv-menu="${id}" aria-label="Действия с беседой «${esc(convTitle(conv))}»">${icon('more')}</button>
  </div>`;
}

function sectionHTML(label, list) {
  if (!list.length) return '';
  return `<div class="side-section">
    <div class="side-label"><span>${esc(label)}</span><span>${list.length}</span></div>
    ${list.map(convItemHTML).join('')}
  </div>`;
}

function renderSidebar() {
  const query = ui.filter.trim();
  const all = state.conversations.filter((c) => matchConv(c, query));
  const dms = all.filter((c) => c.type === 'dm').sort((a, b) => (Number(b.pinned) - Number(a.pinned)) || (lastTs(b) - lastTs(a)));
  const groups = all.filter((c) => c.type === 'group').sort((a, b) => (Number(b.pinned) - Number(a.pinned)) || (lastTs(b) - lastTs(a)));
  let html = '';
  if (ui.view !== 'groups') html += sectionHTML('Личные сообщения', dms);
  html += sectionHTML('Группы', groups);
  if (!html) {
    html = `<div class="empty" style="padding:34px 16px">
      <span class="empty-ico">${query ? icon('search') : icon('dm')}</span>
      <h3>${query ? 'Ничего не найдено' : 'Пока нет бесед'}</h3>
      <p>${query ? `По запросу «${esc(query)}» бесед нет.` : 'Создайте группу или напишите человеку — начните с любого.'}</p>
      <div class="empty-actions">
        <button class="btn sm primary" data-create-group>${icon('plus')}<span>Новая группа</span></button>
        <button class="btn sm" data-new-chat>${icon('dm')}<span>Переписка</span></button>
      </div>
    </div>`;
  }
  $('#convList').innerHTML = html;
}

function roleBadge(role) {
  if (role === 'owner') return `<span class="msg-role">Основатель</span>`;
  if (role === 'admin') return `<span class="msg-role">Админ</span>`;
  return '';
}

function formatText(text) {
  let out = esc(text);
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[\s(])@([a-zA-Z0-9_]{2,32})/g, (match, pre, user) => `${pre}<span class="mention">@${user}</span>`);
  out = out.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
  return out;
}

function videoHTML(a) {
  const poster = posterSrc(a);
  return `<button type="button" class="att-video" data-media-aid="${a.aid}" aria-label="Воспроизвести видео «${esc(a.title || 'Видео')}»">
    <img src="${poster}" alt="">
    <span class="play-circle">${icon('play')}</span>
    <span class="vname">${esc(a.title || 'Видео')}</span>
    <span class="dur">${fmtDur(a.dur || 12)}</span>
  </button>`;
}

function attachmentHTML(m) {
  const atts = m.att || [];
  if (!atts.length) return '';
  const imgs = atts.filter((a) => a.k === 'img');
  const vids = atts.filter((a) => a.k === 'vid');
  let html = '<div class="att">';
  if (imgs.length) {
    const count = imgs.length;
    if (count === 1) {
      const a = imgs[0];
      html += `<button type="button" class="att-item single" style="--ar:${a.w || 4}/${a.h || 3}" data-media-aid="${a.aid}" aria-label="Открыть изображение «${esc(a.title || 'Фото')}»">
        <img src="${mediaSrc(a, 1000, 760)}" alt="${esc(a.title || 'Изображение')}">
      </button>`;
    } else {
      const shown = count > 3 ? imgs.slice(0, 3) : imgs;
      const cls = count === 2 ? 'two' : 'three';
      html += `<div class="att-row ${cls}">` + shown.map((a, i) => `
        <button type="button" class="att-item" data-media-aid="${a.aid}" aria-label="Открыть изображение «${esc(a.title || 'Фото')}»">
          <img src="${mediaSrc(a, 520, 420)}" alt="${esc(a.title || 'Изображение')}">
          ${count > 3 && i === 2 ? `<span class="att-more">+${count - 3}</span>` : ''}
        </button>`).join('') + '</div>';
    }
  }
  vids.forEach((a) => { html += videoHTML(a); });
  atts.filter((a) => a.k === 'voice').forEach((a) => {
    if (!a.src) {
      html += `<div class="voice"><span class="voice-dur">Запись недоступна</span></div>`;
      return;
    }
    const bars = Array.from({ length: 22 }, (_, i) => {
      const h = 24 + Math.round(52 * Math.abs(Math.sin((i + 1) * 1.7 + (a.dur || 1))) );
      return `<i style="--h:${h}%"></i>`;
    }).join('');
    html += `<div class="voice">
      <button type="button" class="voice-btn" data-voice-btn aria-label="Воспроизвести голосовое">${icon('play')}</button>
      <span class="wave">${bars}</span>
      <span class="voice-dur">${fmtDur(a.dur || 0)}</span>
      <audio preload="metadata" src="${a.src}"></audio>
    </div>`;
  });
  atts.filter((a) => a.k === 'note').forEach((a) => {
    if (!a.src) {
      html += `<div class="note-lost">Кружок недоступен после перезагрузки</div>`;
      return;
    }
    html += `<button type="button" class="note is-paused ${a.mirror ? 'is-mirror' : ''}" data-note-aid="${a.aid}" aria-label="Кружок, ${fmtDur(a.dur || 0)}">
      <video src="${a.src}" playsinline loop preload="metadata"></video>
      <span class="note-toggle">${icon('play')}</span>
      <span class="note-dur">${fmtDur(a.dur || 0)}</span>
    </button>`;
  });
  return html + '</div>';
}

function messageHTML(m, conv, prev) {
  if (m.sys) {
    return `<div class="sys">${icon('sparkle')}<span>${esc(m.sys)}</span></div>`;
  }
  if (m.deleted) {
    return `<div class="msg is-deleted" data-msg="${m.id}">
      <div class="msg-gutter"></div>
      <div class="msg-body">
        <div class="msg-meta"><span class="msg-time">${fmtTime(m.t)}</span></div>
        <div class="msg-deleted">Сообщение удалено</div>
      </div>
    </div>`;
  }
  const author = person(m.author);
  const role = conv.type === 'group' ? conv.roles?.[m.author] : null;
  const grouped = prev && !prev.sys && prev.author === m.author && (m.t - prev.t) < 6 * 60000 && !m.reply;
  const mine = m.author === state.me;
  const reply = m.reply ? conv.messages.find((x) => x.id === m.reply) : null;
  const isMention = !mine && typeof m.text === 'string' && new RegExp('@' + (me().username || '-') + '\\b', 'i').test(m.text);
  const reacts = Object.entries(m.react || {}).filter((entry) => entry[1] && entry[1].length);
  const picked = Boolean(ui.sel && ui.sel.has(m.id));
  let html = `<div class="msg ${grouped ? 'is-grouped' : 'is-first'} ${isMention ? 'is-mention' : ''} ${picked ? 'is-picked' : ''} ${ui.sel ? 'is-picking' : ''}" data-msg="${m.id}">
    ${ui.sel ? `<span class="pick-check">${picked ? icon('check') : ''}</span>` : ''}
    <div class="msg-gutter">${grouped
      ? `<time>${fmtTime(m.t)}</time>`
      : `<button type="button" class="msg-avatar" data-profile="${author.id}" aria-label="Профиль ${esc(author.name)}">${avatarHTML(author, 40)}</button>`}
    </div>
    <div class="msg-body">`;
  if (m.forwardedFrom) {
    html += `<div class="fwd-label">${icon('forward')}<span>Переслано от ${esc(m.forwardedFrom)}</span></div>`;
  }
  if (!grouped) {
    html += `<div class="msg-meta">
      <button type="button" class="msg-author" data-profile="${author.id}" style="--name:${esc(author.accent)}">${esc(author.name)}</button>
      <span class="msg-time">${fmtTime(m.t)}</span>
      ${m.editedAt ? '<span class="msg-edited">изм.</span>' : ''}
      ${roleBadge(role)}
      ${m.pinned ? `<span class="msg-time" title="Закреплено">${icon('pin')}</span>` : ''}
    </div>`;
  }
  if (reply) {
    const rp = person(reply.author);
    const snippet = reply.text || (reply.att?.length ? (reply.att[0].k === 'vid' ? 'Видео' : 'Фото') : 'Сообщение');
    html += `<button type="button" class="msg-reply" data-jump="${reply.id}">
      <b>${esc(rp.name.split(' ')[0])}</b><span>${esc(snippet.slice(0, 110))}</span>
    </button>`;
  }
  if (m.text) html += `<div class="msg-text">${formatText(m.text)}</div>`;
  html += attachmentHTML(m);
  if (reacts.length) {
    html += '<div class="reactions">' + reacts.map(([emoji, users]) => `
      <button type="button" class="react ${users.includes(state.me) ? 'is-mine' : ''}" data-react="${esc(emoji)}" data-msg="${m.id}"
        aria-pressed="${users.includes(state.me)}" aria-label="Реакция ${esc(emoji)}, ${users.length}">${esc(emoji)}<b>${users.length}</b></button>`).join('') + '</div>';
  }
  html += `</div>
    <div class="msg-tools">
      <button type="button" class="icon-btn" data-react-add="${m.id}" aria-label="Добавить реакцию">${icon('smile')}</button>
      <button type="button" class="icon-btn" data-reply="${m.id}" aria-label="Ответить">${icon('reply')}</button>
      <button type="button" class="icon-btn" data-msg-more="${m.id}" aria-label="Действия с сообщением">${icon('more')}</button>
    </div>
  </div>`;
  return html;
}

function renderMessages(conv) {
  const box = $('#messages');
  if (!conv) {
    box.innerHTML = `<div class="empty">
      <span class="empty-ico">${icon('sparkle')}</span>
      <h3>Начните с беседы</h3>
      <p>Выберите переписку слева, напишите человеку или создайте группу.</p>
      <div class="empty-actions">
        <button class="btn primary" data-create-group>${icon('plus')}<span>Создать группу</span></button>
        <button class="btn" data-new-chat>${icon('dm')}<span>Начать переписку</span></button>
      </div>
    </div>`;
    $('#msgSearchCount').textContent = '';
    return;
  }
  let list = conv.messages.filter((m) => !(m.hiddenFor || []).includes(state.me));
  const q = ui.msgQuery.trim().toLowerCase();
  if (q) {
    list = list.filter((m) => {
      if (m.sys) return false;
      return (m.text || '').toLowerCase().includes(q)
        || person(m.author).name.toLowerCase().includes(q)
        || (m.att || []).some((a) => String(a.title || '').toLowerCase().includes(q));
    });
  }
  const found = q ? list.length : 0;
  $('#msgSearchCount').textContent = q ? `${found}` : '';
  let html = '';
  if (q) {
    html += `<div class="search-info">${icon('search')}<span>Найдено: <b>${found}</b> по запросу «${esc(ui.msgQuery.trim())}»</span><button type="button" class="btn sm ghost" data-clear-search>Сбросить</button></div>`;
  }
  if (!list.length) {
    html += `<div class="empty">
      <span class="empty-ico">${q ? icon('search') : icon('sparkle')}</span>
      <h3>${q ? 'Совпадений нет' : 'Пока тихо'}</h3>
      <p>${q ? 'Попробуйте другое слово или имя участника.' : 'Напишите первое сообщение — оно сразу появится здесь.'}</p>
    </div>`;
    box.innerHTML = html;
    return;
  }
  let lastDay = '';
  let prev = null;
  list.forEach((m) => {
    const dayKey = new Date(m.t).toDateString();
    if (dayKey !== lastDay) {
      html += `<div class="day">${fmtDay(m.t)}</div>`;
      lastDay = dayKey;
      prev = null;
    }
    html += messageHTML(m, conv, prev);
    prev = m.sys ? null : m;
  });
  box.innerHTML = html;
}

function renderIntro(conv) {
  const intro = $('#chatIntro');
  if (!conv) {
    intro.innerHTML = '';
    return;
  }
  const media = collectMedia(conv);
  if (conv.type === 'group') {
    const owner = conv.members.find((id) => conv.roles?.[id] === 'owner');
    intro.innerHTML = `
      <div class="intro-banner">${bannerHTML(conv.banner, '', conv.bannerImg)}</div>
      <div class="intro-main">
        <span class="intro-av">${groupAvatarHTML(conv, 56)}</span>
        <div class="intro-info">
          <h2 class="intro-name">${esc(conv.name)}<span class="lock" title="Приватная группа">${icon('lock')}</span></h2>
          <div class="intro-meta">
            <span><b>${conv.members.length}</b> ${pluralMembers(conv.members.length)}</span>
            <span><b>${groupOnlineCount(conv)}</b> в сети</span>
            <span>Медиа: <b>${media.length}</b></span>
            <span>Создана ${fmtJoined(conv.created || Date.now())}</span>
          </div>
        </div>
        <div class="intro-actions">
          <button type="button" class="btn sm primary" data-open-group="${conv.id}">${icon('info')}<span>Карточка группы</span></button>
          <button type="button" class="btn sm" data-open-media>${icon('grid')}<span>Медиа</span></button>
        </div>
      </div>
      <p class="intro-desc">${esc(conv.desc || '')}</p>`;
  } else {
    const p = person(conv.peer);
    intro.innerHTML = `
      <div class="intro-banner">${bannerHTML(p.banner, '', p.bannerImg)}</div>
      <div class="intro-main">
        <span class="intro-av">${avatarHTML(p, 56, { status: true, border: 'var(--bg-3)' })}</span>
        <div class="intro-info">
          <h2 class="intro-name">${esc(p.name)}</h2>
          <div class="intro-meta">
            <span class="status-pill"><span class="dot" data-st="${p.status}"></span>${statusText(p)}</span>
            <span>@${esc(p.username)}</span>
            <span>Медиа: <b>${media.length}</b></span>
            <span>В YouChat с ${fmtJoined(p.joined || Date.now())}</span>
          </div>
        </div>
        <div class="intro-actions">
          <button type="button" class="btn sm primary" data-open-profile="${p.id}">${icon('users')}<span>Профиль</span></button>
          <button type="button" class="btn sm" data-open-media>${icon('grid')}<span>Медиа</span></button>
        </div>
      </div>
      <p class="intro-desc">${esc(p.bio || '')}</p>`;
  }
}

function renderChatHeader(conv) {
  const btn = $('#chatTitleBtn');
  if (!conv) {
    $('#chatName').textContent = 'YouChat';
    $('#chatSub').textContent = 'Нет активной беседы';
    $('#chatAvatar').innerHTML = '';
    $('#composerArea').hidden = true;
    btn.disabled = true;
    $('#chat').setAttribute('aria-label', 'YouChat');
    return;
  }
  btn.disabled = false;
  $('#composerArea').hidden = false;
  $('#chatName').textContent = convTitle(conv);
  if (conv.type === 'group') {
    $('#chatSub').textContent = `${membersLabel(conv.members.length)} · ${groupOnlineCount(conv)} в сети`;
    $('#chatAvatar').innerHTML = groupAvatarHTML(conv, 30);
    $('#chat').setAttribute('aria-label', `Группа ${conv.name}`);
  } else {
    const p = person(conv.peer);
    $('#chatSub').textContent = statusText(p);
    $('#chatAvatar').innerHTML = avatarHTML(p, 30, { status: true, border: 'var(--bg-2)' });
    $('#chat').setAttribute('aria-label', `Переписка с ${p.name}`);
  }
  $('#composerInput').placeholder = 'Написать сообщение';
}

function renderMembers(conv) {
  const panel = $('#membersPanel');
  panel.classList.toggle('is-hidden', !state.prefs.membersOpen);
  $('#btnMembers').setAttribute('aria-pressed', String(Boolean(state.prefs.membersOpen)));
  if (!conv) {
    panel.innerHTML = '';
    return;
  }
  if (conv.type === 'dm') {
    const p = person(conv.peer);
    const media = collectMedia(conv);
    panel.innerHTML = `
      <div class="mem-head"><span>Профиль</span><button type="button" class="icon-btn sm" data-close-members aria-label="Скрыть панель">${icon('close')}</button></div>
      <div class="mem-scroll">
        <div class="dm-card">
          <div class="dm-card-banner">${bannerHTML(p.banner, '', p.bannerImg)}</div>
          <div class="dm-card-body">
            <span class="dm-card-av">${avatarHTML(p, 58, { status: true, border: 'var(--bg-3)' })}</span>
            <h3 class="dm-card-name">${esc(p.name)}</h3>
            <div class="dm-card-status"><span class="dot" data-st="${p.status}"></span>${statusText(p)}</div>
            <p class="dm-card-bio">${esc(p.bio || '')}</p>
            <div class="dm-actions">
              <button type="button" class="btn sm" data-open-profile="${p.id}">${icon('users')}<span>Профиль</span></button>
              <button type="button" class="btn sm" data-open-media>${icon('grid')}<span>Медиа</span></button>
            </div>
            <div class="dm-media-label">Медиа ${media.length ? '· ' + media.length : ''}</div>
            <div class="media-strip">${media.slice(0, 6).map((item) => `
              <button type="button" data-media-aid="${item.a.aid}" aria-label="Открыть ${esc(item.a.title || 'медиа')}">
                <img src="${posterSrc(item.a)}" alt="">
                ${item.a.k === 'vid' ? `<span class="vdot">${icon('play')}</span>` : ''}
              </button>`).join('')}</div>
            ${media.length ? '' : '<p class="dm-card-bio">Пока нет фото и видео.</p>'}
          </div>
        </div>
      </div>`;
    return;
  }
  const order = ['owner', 'admin', 'member'];
  const labels = { owner: 'Основатель', admin: 'Админы', member: 'Участники' };
  const sorted = (role) => conv.members
    .filter((id) => (conv.roles?.[id] || 'member') === role)
    .map((id) => person(id))
    .sort((a, b) => {
      const rank = { online: 0, idle: 1, dnd: 2, offline: 3 };
      return (rank[a.status] ?? 4) - (rank[b.status] ?? 4) || a.name.localeCompare(b.name, 'ru');
    });
  let rows = '';
  order.forEach((role) => {
    const people = sorted(role);
    if (!people.length) return;
    rows += `<div class="mem-label">${labels[role]} <span>${people.length}</span></div>`;
    rows += people.map((p) => {
      const ownerRole = role === 'owner';
      const adminRole = role === 'admin';
      const canMenu = canManageMember(conv, p.id);
      return `<div class="member-wrap">
        <button type="button" class="member" data-profile="${p.id}" aria-label="Профиль ${esc(p.name)}">
          ${avatarHTML(p, 32, { status: true, border: 'var(--bg-1)' })}
          <span class="member-meta">
            <span class="member-name">${esc(p.name)}${ownerRole ? `<span class="member-badge owner">${icon('crown')}</span>` : adminRole ? `<span class="member-badge">${icon('shield')}</span>` : ''}</span>
            <span class="member-sub">${esc(p.custom || statusText(p))}</span>
          </span>
        </button>
        ${canMenu ? `<button type="button" class="member-menu-btn" data-member-menu="${conv.id}|${p.id}" aria-label="Действия с участником">${icon('more')}</button>` : ''}
      </div>`;
    }).join('');
  });
  panel.innerHTML = `<div class="mem-head"><span>Участники</span><span>${conv.members.length}</span></div><div class="mem-scroll">${rows}</div>`;
}

function renderChat() {
  const conv = activeConv() || null;
  renderChatHeader(conv);
  renderIntro(conv);
  renderMessages(conv);
  renderMembers(conv);
  renderReply();
  renderPending();
  if (typeof renderSelectionBar === 'function') renderSelectionBar();
  if (typeof renderEditChip === 'function') renderEditChip();
  if (conv) resizeComposer();
}

function renderReply() {
  const chip = $('#replyChip');
  const conv = activeConv();
  if (!ui.replyTo || !conv) {
    chip.hidden = true;
    chip.innerHTML = '';
    return;
  }
  const msg = conv.messages.find((m) => m.id === ui.replyTo);
  if (!msg) {
    ui.replyTo = null;
    chip.hidden = true;
    return;
  }
  const author = person(msg.author);
  const snippet = msg.text || (msg.att?.length ? (msg.att[0].k === 'vid' ? 'видео' : 'фото') : 'сообщение');
  chip.hidden = false;
  chip.innerHTML = `${icon('reply')}<span>Ответ <b>${esc(author.name)}</b> · ${esc(snippet.slice(0, 120))}</span>
    <button type="button" class="icon-btn xs" data-reply-cancel aria-label="Отменить ответ">${icon('close')}</button>`;
}

function renderPending() {
  const box = $('#pending');
  if (!ui.pending.length) {
    box.innerHTML = '';
    box.hidden = true;
    return;
  }
  box.hidden = false;
  box.innerHTML = ui.pending.map((a) => `
    <div class="pend">
      ${a.k === 'img'
        ? `<img src="${a.src}" alt="">`
        : `<video src="${a.src}" muted preload="metadata" aria-hidden="true"></video>`}
      <span class="kind">${a.k === 'img' ? 'фото' : 'видео'}</span>
      <button type="button" class="rm" data-pend-rm="${a.aid}" aria-label="Убрать вложение">×</button>
    </div>`).join('');
}

function resizeComposer() {
  const input = $('#composerInput');
  if (!input) return;
  input.style.height = 'auto';
  input.style.height = Math.min(168, Math.max(22, input.scrollHeight)) + 'px';
}

function refreshTitle() {
  titleBadge();
}

function setView(view) {
  ui.view = view;
  renderRail();
  renderSidebar();
}

function openConversation(id, opts = {}) {
  const conv = findConv(id);
  if (!conv) return;
  state.activeId = id;
  conv.unread = 0;
  ui.msgQuery = '';
  ui.replyTo = null;
  ui.pending = [];
  ui.sel = null;
  ui.editing = null;
  closePopover();
  closeEmojiPicker();
  const searchWrap = $('#msgSearchWrap');
  if (searchWrap) searchWrap.hidden = true;
  $('.chat-head')?.classList.remove('searching');
  $('#msgSearch').value = '';
  $('#composerInput').value = '';
  renderAll();
  requestAnimationFrame(() => scrollBottom(false));
  persist();
  if (typeof NET !== 'undefined' && NET.online) NET.read(conv);
  if (window.innerWidth <= 960 || opts.mobile) $('#app').classList.add('chat-open');
}

function markRead(conv) {
  if (!conv || !conv.unread) return;
  conv.unread = 0;
  renderSidebar();
  refreshTitle();
  persist();
  if (typeof NET !== 'undefined' && NET.online) NET.read(conv);
}

function sendCurrent() {
  const conv = activeConv();
  if (!conv) return;
  const input = $('#composerInput');
  const text = input.value.trim();
  if (ui.editing) {
    if (!text) { toast('Текст не может быть пустым', 'warn'); return; }
    commitEdit(text);
    return;
  }
  const atts = ui.pending.slice();
  if (!text && !atts.length) return;
  const message = {
    id: uid('m'), author: state.me, t: Date.now(), text, att: atts,
    react: {}, reply: ui.replyTo || null, pinned: false
  };
  conv.messages.push(message);
  ui.pending = [];
  ui.replyTo = null;
  input.value = '';
  resizeComposer();
  renderSidebar();
  renderIntro(conv);
  renderMessages(conv);
  renderPending();
  renderReply();
  renderMembers(conv);
  requestAnimationFrame(() => scrollBottom(true));
  closePopover();
  closeEmojiPicker();
  persist();
  if (typeof NET !== 'undefined' && NET.online) NET.sendMessage(conv, message);
  input.focus();
}

function toggleReaction(msgId, emoji) {
  const conv = activeConv();
  if (!conv) return;
  const msg = conv.messages.find((m) => m.id === msgId);
  if (!msg) return;
  msg.react = msg.react || {};
  const list = msg.react[emoji] || [];
  const at = list.indexOf(state.me);
  if (at >= 0) list.splice(at, 1);
  else list.push(state.me);
  if (list.length) msg.react[emoji] = list;
  else delete msg.react[emoji];
  renderMessages(conv);
  persist();
  if (typeof NET !== 'undefined' && NET.online) NET.react(conv, msg, emoji);
}

function openMessageMenu(anchor, msgId) {
  const conv = activeConv();
  const msg = conv?.messages.find((m) => m.id === msgId);

  const items = [
