  if (conv.type === 'group') {
    items.push({ id: 'link', label: 'Ссылка на сообщение', icon: 'link', onClick: () => copyText(messageLink(conv, msg)) });
  }
  if (canEditMessage(msg)) {
    const label = msg.text ? 'Изменить текст' : ((msg.att || []).length ? 'Добавить текст' : 'Изменить');
    items.push({ id: 'edit', label, icon: 'edit', onClick: () => startEdit(msgId) });
  }
  const voiceAtt = (msg.att || []).find((a) => a.k === 'voice');
  const noteAtt = (msg.att || []).find((a) => a.k === 'note');
  if (voiceAtt) {
    items.push({
      id: 'rerecord-voice', label: 'Перезаписать голосовое', icon: 'mic',
      onClick: () => { closePopover(); startRecording('voice', { replaceId: msg.id }); }
    });
  }
  if (noteAtt) {
    items.push({
      id: 'rerecord-note', label: 'Перезаписать кружок', icon: 'camera',
      onClick: () => { closePopover(); startRecording('note', { replaceId: msg.id }); }
    });
  }
  items.push({
    id: 'pin', label: msg.pinned ? 'Открепить' : 'Закрепить', icon: 'pin',
    onClick: () => togglePin(msgId)
  });
  items.push('sep');
  const ownOrModerated = canDeleteForAll(conv, msg);
  items.push({
    id: 'delete',
    label: ownOrModerated ? 'Удалить у всех' : 'Удалить у себя',
    icon: 'trash',
    danger: true,
    onClick: () => confirmDeleteMessages([msg])
  });
  openMenu(anchor, items);
}

function togglePin(msgId) {
  const conv = activeConv();
  if (!conv) return;
  const msg = conv.messages.find((m) => m.id === msgId);
  if (!msg) return;
  msg.pinned = !msg.pinned;
  conv.pinnedMsgs = conv.pinnedMsgs || [];
  if (msg.pinned) {
    if (!conv.pinnedMsgs.includes(msgId)) conv.pinnedMsgs.push(msgId);
  } else {
    conv.pinnedMsgs = conv.pinnedMsgs.filter((id) => id !== msgId);
  }
  renderMessages(conv);
  persist();
  if (typeof NET !== 'undefined' && NET.online) NET.pinMessage(conv, msg);
  toast(msg.pinned ? 'Сообщение закреплено' : 'Сообщение откреплено', 'ok');
}

function setReply(msgId) {
  ui.replyTo = msgId;
  renderReply();
  $('#composerInput').focus();
}

function openConversationMenu(conv, anchor) {
  const items = [];
  if (conv.unread) items.push({ id: 'read', label: 'Отметить прочитанным', icon: 'check', onClick: () => markRead(conv) });
  items.push({
    id: 'pin', label: conv.pinned ? 'Открепить беседу' : 'Закрепить беседу', icon: 'pin',
    onClick: () => {
      conv.pinned = !conv.pinned;
      renderSidebar();
      persist();
      if (typeof NET !== 'undefined' && NET.online) NET.pinConversation(conv, conv.pinned);
      toast(conv.pinned ? 'Беседа закреплена' : 'Беседа откреплена', 'ok');
    }
  });
  items.push('sep');
  if (!(conv.type === 'group' && isOwner(conv))) items.push({
    id: 'remove', label: conv.type === 'group' ? 'Покинуть группу' : 'Удалить переписку', icon: 'logout', danger: true,
    onClick: () => {
      openConfirm({
        title: conv.type === 'group' ? `Покинуть «${conv.name}»?` : 'Удалить переписку?',
        text: conv.type === 'group'
          ? 'Группа исчезнет из вашего списка вместе с историей. Вернуть её можно только сбросом демо-данных.'
          : 'Переписка и все вложения будут удалены с этого устройства.',
        confirmLabel: conv.type === 'group' ? 'Покинуть' : 'Удалить',
        danger: true,
        onConfirm: () => removeConversation(conv)
      });
    }
  });
  openMenu(anchor, items);
}

function removeConversation(conv) {
  if (conv?.type === 'group' && isOwner(conv)) { toast('Сначала передайте владение другому участнику', 'warn'); return; }
  if (typeof NET !== 'undefined' && NET.online) NET.leave(conv);
  state.conversations = state.conversations.filter((c) => c.id !== conv.id);
  if (state.activeId === conv.id) {
    state.activeId = state.conversations[0]?.id || null;
    $('#app').classList.remove('chat-open');
  }
  closeAllModals();
  renderAll();
  persist();
  toast(conv.type === 'group' ? 'Вы покинули группу' : 'Переписка удалена', 'ok');
}

async function prepareImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => {
      const image = new Image();
      image.onload = () => resolve(image);
      image.onerror = reject;
      image.src = url;
    });
    const max = 1400;
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    return { src: canvas.toDataURL('image/jpeg', 0.85), w, h };
  } finally {
    setTimeout(() => URL.revokeObjectURL(url), 800);
  }
}

function prepareVideo(file) {
  const url = URL.createObjectURL(file);
  return new Promise((resolve) => {
    let done = false;
    const finish = (dur, w, h) => {
      if (done) return;
      done = true;
      resolve({ src: url, dur: Math.round(dur) || 12, w: w || 16, h: h || 9 });
    };
    try {
      const video = document.createElement('video');
      video.preload = 'metadata';
      video.muted = true;
      video.onloadedmetadata = () => finish(video.duration, video.videoWidth, video.videoHeight);
      video.onerror = () => finish(12, 16, 9);
      video.src = url;
      setTimeout(() => finish(12, 16, 9), 3500);
    } catch (error) {
      finish(12, 16, 9);
    }
  });
}

async function handleFiles(files) {
  const list = Array.from(files || []);
  if (!list.length) return;
  const online = typeof NET !== 'undefined' && NET.online;
  for (const file of list) {
    if (file.type.startsWith('image/')) {
      if (file.size > 22 * 1024 * 1024) { toast('Изображение слишком большое (до 22 МБ)', 'warn'); continue; }
      try {
        const prepared = await prepareImage(file);
        let src = prepared.src;
        if (online) {
          try {
            src = await NET.uploadDataUrl(prepared.src, file.name || 'photo.jpg');
          } catch (error) {
            toast('Не удалось загрузить фото на сервер', 'warn');
            continue;
          }
        }
        ui.pending.push({ aid: uid('a'), k: 'img', src, title: file.name, w: prepared.w, h: prepared.h });
      } catch (error) {
        toast('Не удалось открыть изображение', 'warn');
      }
    } else if (file.type.startsWith('video/')) {
      if (file.size > 120 * 1024 * 1024) { toast('Видео слишком большое (до 120 МБ)', 'warn'); continue; }
      try {
        const prepared = await prepareVideo(file);
        let src = prepared.src;
        const att = { aid: uid('a'), k: 'vid', src, title: file.name, dur: prepared.dur, w: prepared.w, h: prepared.h, session: true };
        if (online) {
          try {
            src = await NET.uploadBlob(file, file.name || 'video.mp4');
            att.src = src;
            delete att.session;
          } catch (error) {
            toast('Не удалось загрузить видео на сервер', 'warn');
            continue;
          }
        }
        ui.pending.push(att);
      } catch (error) {
        toast('Не удалось открыть видео', 'warn');
      }
    } else {
      toast('Можно прикрепить фото или видео', 'warn');
    }
  }
  renderPending();
  $('#composerInput').focus();
}

function fillEmojiPicker() {
  const pop = $('#emojiPop');
  if (pop.dataset.ready) return;
  pop.innerHTML = `<div class="emoji-pop-label">Эмодзи</div><div class="emoji-grid">${EMOJIS.map((e) => `<button type="button" data-emoji="${esc(e)}" aria-label="${esc(e)}">${esc(e)}</button>`).join('')}</div>`;
  pop.dataset.ready = '1';
}

function openEmojiPicker() {
  const pop = $('#emojiPop');
  if (!pop.hidden) { closeEmojiPicker(); return; }
  fillEmojiPicker();
  pop.hidden = false;
  const r = $('#btnEmoji').getBoundingClientRect();
  const pr = pop.getBoundingClientRect();
  pop.style.left = Math.round(clamp(r.left + r.width / 2 - pr.width / 2, 8, window.innerWidth - pr.width - 8)) + 'px';
  pop.style.top = Math.round(Math.max(8, r.top - pr.height - 10)) + 'px';
  emojiReady = false;
  requestAnimationFrame(() => { emojiReady = true; });
}

function closeEmojiPicker() {
  const pop = $('#emojiPop');
  if (!pop || pop.hidden) return;
  pop.hidden = true;
  emojiReady = false;
}

function insertEmoji(emoji) {
  const input = $('#composerInput');
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? start;
  input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
  input.focus();
  const pos = start + emoji.length;
  input.setSelectionRange(pos, pos);
  resizeComposer();
}

function openMediaFor(conv, aid) {
  const items = collectMedia(conv);
  if (!items.length) return;
  const index = Math.max(0, items.findIndex((item) => item.a.aid === aid));
  openLightbox(items, index);
}

function openGalleryFor(conv) {
  const items = collectMedia(conv);
  if (!items.length) {
    toast('В этой беседе пока нет фото и видео', 'warn');
    return;
  }
  openMediaGallery(items, convTitle(conv));
}

function resetDemo() {
  openConfirm({
    title: 'Сбросить демо-данные?',
    text: 'Все беседы, группы и сообщения будут удалены. Это действие нельзя отменить.',
    confirmLabel: 'Сбросить',
    danger: true,
    onConfirm: () => {
      try { localStorage.removeItem(STORE_KEY); } catch (error) {}
      memoryStore = null;
      state = demoState();
      ui.msgQuery = '';
      ui.replyTo = null;
      ui.pending = [];
      ui.filter = '';
      ui.view = 'all';
      $('#convFilter').value = '';
      $('#composerInput').value = '';
      closeAllModals();
      closePopover();
      closeEmojiPicker();
      renderAll();
      requestAnimationFrame(() => scrollBottom(false));
      toast('Данные сброшены', 'ok');
    }
  });
}

function openMeMenu(anchor) {
  const p = me();
  const items = [
    { title: 'Аккаунт' },
    { id: 'profile', label: 'Мой профиль', icon: 'users', onClick: () => openProfile(p.id) },
    { id: 'edit', label: 'Редактировать профиль', icon: 'edit', onClick: () => openProfileEditor() }
  ];
  if (typeof NET !== 'undefined' && NET.online) {
    items.push('sep');
    items.push({ id: 'people', label: 'Найти людей', icon: 'user-plus', onClick: () => NET.openPeopleSearch('') });
    items.push({ id: 'logout', label: 'Выйти из аккаунта', icon: 'logout', danger: true, onClick: () => NET.logout() });
  } else {
    items.push('sep');
    items.push({ id: 'logout', label: 'Выйти из аккаунта', icon: 'logout', danger: true, onClick: logoutLocal });
  }
  openMenu(anchor, items);
}

function logoutLocal() {
  openConfirm({
    title: 'Выйти из аккаунта?',
    text: 'Локальные данные в этом браузере будут очищены, откроется экран входа.',
    confirmLabel: 'Выйти',
    danger: true,
    onConfirm: () => {
      try { localStorage.removeItem(STORE_KEY); } catch (error) { /* ignore */ }
      memoryStore = null;
      location.reload();
    }
  });
}

function toggleMembers() {
  state.prefs.membersOpen = !state.prefs.membersOpen;
  $('#membersPanel').classList.toggle('is-hidden', !state.prefs.membersOpen);
  $('#btnMembers').setAttribute('aria-pressed', String(state.prefs.membersOpen));
  persist();
}

function togglePinFromPins(msgId) {
  const conv = activeConv();
  if (!conv) return;
  const msg = conv.messages.find((m) => m.id === msgId);
  if (msg) msg.pinned = false;
  conv.pinnedMsgs = (conv.pinnedMsgs || []).filter((id) => id !== msgId);
  renderMessages(conv);
  persist();
  if (msg && typeof NET !== 'undefined' && NET.online) NET.pinMessage(conv, msg);
}

function scrollToMessage(msgId) {
  const node = $(`[data-msg="${msgId}"]`);
  if (!node) return;
  node.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'center' });
  node.classList.add('is-flash');
  setTimeout(() => node.classList.remove('is-flash'), 1400);
}

function openDM(personId) {
  if (personId === state.me) {
    openProfile(state.me);
    return;
  }
  if (typeof NET !== 'undefined' && NET.online) {
    NET.openDM(personId).then((id) => {
      if (!id) return;
      closeAllModals();
      openConversation(id);
    }).catch(() => toast('Не удалось открыть переписку', 'warn'));
    return;
  }
  let conv = dmWith(personId);
  if (!conv) {
    conv = { id: 'dm-' + personId, type: 'dm', peer: personId, messages: [], pinnedMsgs: [], pinned: false, unread: 0 };
    state.conversations.push(conv);
  }
  closeAllModals();
  openConversation(conv.id);
}

<script>
/* social.js */
'use strict';

/* ---------- links ---------- */
function copyLink(url, label = 'Ссылка') {
  copyText(url);
}

/* ---------- selection ---------- */
function isPicking() {
  return Boolean(ui.sel);
}

function selectedIds() {
  return ui.sel ? Array.from(ui.sel) : [];
}

function setPickingClasses() {
  const box = $('#messages');
  if (box) box.classList.toggle('is-picking', Boolean(ui.sel));
}

function renderSelectionBar() {
  const bar = $('#selBar');
  if (!bar) return;
  setPickingClasses();
  if (!ui.sel) {
    bar.hidden = true;
    bar.innerHTML = '';
    return;
  }
  const n = ui.sel.size;
  bar.hidden = false;
  bar.innerHTML = `
    <button type="button" class="icon-btn xs" data-sel-cancel aria-label="Отменить выбор">${icon('close')}</button>
    <span class="sel-count">Выбрано: <b>${n}</b></span>
    <button type="button" class="btn sm" data-sel-forward ${n ? '' : 'disabled'}>${icon('forward')}<span>Переслать</span></button>
    <button type="button" class="btn sm danger" data-sel-delete ${n ? '' : 'disabled'}>${icon('trash')}<span>Удалить</span></button>`;
}

function startSelection(id) {
  ui.sel = new Set();
  if (id) ui.sel.add(id);
  renderSelectionBar();
  renderMessages(activeConv());
}

function toggleSelection(id) {
  if (!ui.sel) return;
  if (ui.sel.has(id)) ui.sel.delete(id);
  else ui.sel.add(id);
  renderSelectionBar();
  renderMessages(activeConv());
}

function cancelSelection() {
  if (!ui.sel) return;
  ui.sel = null;
  renderSelectionBar();
  renderMessages(activeConv());
}

function selectedMessages() {
  const conv = activeConv();
  if (!conv || !ui.sel) return [];
  return conv.messages.filter((m) => ui.sel.has(m.id) && !m.hiddenFor?.includes(state.me));
}

/* ---------- delete ---------- */
function deleteMessages(conv, msgs, opts = {}) {
  if (!conv || !msgs.length) return;
  let forAll = 0;
  let forMe = 0;
  msgs.forEach((m) => {
    if (m.sys) return;
    if (canDeleteForAll(conv, m)) {
      m.deleted = true;
      m.text = '';
      m.att = [];
      m.react = {};
      m.editedAt = null;
      m.hiddenFor = [];
      forAll += 1;
      conv.pinnedMsgs = (conv.pinnedMsgs || []).filter((id) => id !== m.id);
      if (ui.replyTo === m.id) ui.replyTo = null;
    } else {
      m.hiddenFor = m.hiddenFor || [];
      if (!m.hiddenFor.includes(state.me)) m.hiddenFor.push(state.me);
      forMe += 1;
    }
  });
  renderMessages(conv);
  renderSidebar();
  renderIntro(conv);
  renderReply();
  persist();
  if (typeof NET !== 'undefined' && NET.online) NET.deleteMessages(conv, msgs);
  const parts = [];
  if (forAll) parts.push(`у всех: ${forAll}`);
  if (forMe) parts.push(`только у себя: ${forMe}`);
  toast(`Удалено${parts.length ? ' · ' + parts.join(', ') : ''}`, 'ok');
}

function confirmDeleteMessages(msgs) {
  const conv = activeConv();
  if (!conv || !msgs.length) return;
  const allMine = msgs.every((m) => canDeleteForAll(conv, m));
  openConfirm({
    title: msgs.length === 1 ? 'Удалить сообщение?' : `Удалить сообщений: ${msgs.length}?`,
    text: allMine
      ? 'Сообщения исчезнут у всех участников беседы. Отменить действие нельзя.'
      : 'Свои сообщения удалятся у всех, чужие — только у вас.',
    confirmLabel: 'Удалить',
    danger: true,
    onConfirm: () => {
      deleteMessages(conv, msgs);
      cancelSelection();
      closePopover();
    }
  });
}

/* ---------- forwarding ---------- */
function forwardMessages(msgs) {
  if (!msgs.length) return;
  const convs = state.conversations.slice().sort((a, b) => lastTs(b) - lastTs(a));
  if (!convs.length) {
    toast('Пока нет других бесед — создайте группу', 'warn');
    return;
  }
  const rows = convs.map((c) => `
    <button type="button" class="pick" data-fwd-to="${c.id}">
      ${convAvatarHTML(c, 34)}
      <span class="pick-meta">
        <span class="pick-name">${esc(convTitle(c))}</span>
        <span class="pick-sub">${c.type === 'group' ? membersLabel(c.members.length) : 'личная переписка'}</span>
      </span>
      ${icon('chev-right')}
    </button>`).join('');
  const html = `<div class="modal-pad">
    <h2 class="modal-title">Переслать ${msgs.length === 1 ? 'сообщение' : `сообщений: ${msgs.length}`}</h2>
    <p class="modal-sub">Выберите беседу — сообщения отправятся от вашего имени.</p>
    <div class="mem-list">${rows}</div>
  </div>`;
  openModal(html, {
    size: 'sm',
    label: 'Переслать сообщения',
    onMount: (modal) => {
      $$('[data-fwd-to]', modal).forEach((btn) => {
        btn.addEventListener('click', () => {
          const target = findConv(btn.dataset.fwdTo);
          if (!target) return;
          const fresh = msgs.map((m) => {
            const copy = {
              id: uid('m'),
              author: state.me,
              t: Date.now(),
              text: m.text || '',
              att: JSON.parse(JSON.stringify(m.att || [])),
              react: {},
              reply: null,
              pinned: false,
              forwardedFrom: person(m.author).name
            };
            target.messages.push(copy);
            return copy;
          });
          if (typeof NET !== 'undefined' && NET.online) fresh.forEach((copy) => NET.sendMessage(target, copy));
          closeAllModals();
          cancelSelection();
          renderSidebar();
          const cur = activeConv();
          if (cur) { renderMessages(cur); renderIntro(cur); }
          persist();
          toast(`Переслано в «${convTitle(target)}»`, 'ok');
        });
      });
    }
  });
}

/* ---------- editing ---------- */
function renderEditChip() {
  const chip = $('#editChip');
  if (!chip) return;
  const conv = activeConv();
  const msg = ui.editing && conv ? conv.messages.find((m) => m.id === ui.editing) : null;
  if (!msg) {
    ui.editing = null;
    chip.hidden = true;
    chip.innerHTML = '';
    return;
  }
  chip.hidden = false;
  chip.innerHTML = `${icon('edit')}<span>Изменение сообщения · <b>${esc(fmtTime(msg.t))}</b></span>
    <button type="button" class="icon-btn xs" data-edit-cancel aria-label="Отменить изменение">${icon('close')}</button>`;
}

function startEdit(msgId) {
  const conv = activeConv();
  const msg = conv?.messages.find((m) => m.id === msgId);
  if (!msg || !canEditMessage(msg)) return;
  ui.editing = msgId;
  ui.replyTo = null;
  renderReply();
  const input = $('#composerInput');
  input.value = msg.text || '';
  resizeComposer();
  renderEditChip();
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  closePopover();
}

function cancelEdit() {
  ui.editing = null;
  const input = $('#composerInput');
  if (input) input.value = '';
  renderEditChip();
  resizeComposer();
}

function commitEdit(text) {
  const conv = activeConv();
  if (!conv || !ui.editing) return false;
  const msg = conv.messages.find((m) => m.id === ui.editing);
  if (!msg || !canEditMessage(msg)) { cancelEdit(); return false; }
  msg.text = text;
  msg.editedAt = Date.now();
  ui.editing = null;
  $('#composerInput').value = '';
  renderEditChip();
  resizeComposer();
  renderMessages(conv);
  renderSidebar();
  persist();
  if (typeof NET !== 'undefined' && NET.online) NET.editMessage(conv, msg, text);
  toast('Сообщение изменено', 'ok');
  return true;
}

/* ---------- message playback ---------- */
function toggleVoice(btn) {
  const wrap = btn.closest('.voice');
  const audio = wrap?.querySelector('audio');
  if (!audio) return;
  if (audio.paused) {
    document.querySelectorAll('.voice audio').forEach((a) => { if (a !== audio) { a.pause(); a.closest('.voice')?.classList.remove('playing'); } });
    audio.play().catch(() => toast('Не удалось воспроизвести запись', 'warn'));
    wrap.classList.add('playing');
    btn.innerHTML = icon('pause');
  } else {
    audio.pause();
    wrap.classList.remove('playing');
    btn.innerHTML = icon('play');
  }
}

function toggleNote(node) {
  const video = node.querySelector('video');
  if (!video) return;
  if (video.paused) {
    document.querySelectorAll('.note video').forEach((v) => { if (v !== video) { v.pause(); v.closest('.note')?.classList.add('is-paused'); } });
    video.play().catch(() => toast('Не удалось воспроизвести кружок', 'warn'));
    node.classList.remove('is-paused');
  } else {
    video.pause();
    node.classList.add('is-paused');
  }
}

/* ---------- recording ---------- */
const recState = {
  active: false, starting: false, abort: false, locked: false, stopping: false,
  kind: 'voice', stream: null, recorder: null, chunks: [],
  startedAt: 0, timer: null, facing: 'user', save: true,
  replaceId: null, mirror: false
};

function pickMime(kind) {
  const list = kind === 'note'
    ? ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4']
    : ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
  return list.find((type) => window.MediaRecorder && MediaRecorder.isTypeSupported(type)) || '';
}

function recorderHTML() {
  const hintIdle = recState.replaceId
    ? 'Потяните вверх, чтобы зафиксировать запись'
    : 'Удерживайте · свайп вверх фиксирует';
  if (recState.kind === 'note') {
    return `<div class="rec-round"><video autoplay muted playsinline></video>
        <span class="rec-badge"><span class="rec-dot"></span>запись</span>
        <span class="rec-timer">0:00 / ${fmtDur(REC_LIMIT)}</span>
      </div>
      <div class="rec-round-label">Кружок · камера ${recState.facing === 'user' ? 'фронтальная' : 'основная'}</div>
      <span class="rec-hint" data-rec-hint>${hintIdle}</span>
      <div class="rec-actions">
        <button type="button" class="rec-btn" data-rec-flip aria-label="Переключить камеру" data-tip="Переключить камеру">${icon('switch')}</button>
        <button type="button" class="rec-btn danger" data-rec-cancel aria-label="Отменить запись">${icon('close')}</button>
        <button type="button" class="rec-btn primary" data-rec-send aria-label="Отправить кружок">${icon('arrow-up')}</button>
      </div>`;
  }
  return `<span class="rec-dot"></span>
    <span class="rec-time">0:00</span>
    <span class="rec-limit">/ ${fmtDur(REC_LIMIT)}</span>
    <span class="rec-hint" data-rec-hint>${hintIdle}</span>
    <div class="rec-actions">
      <button type="button" class="rec-btn danger" data-rec-cancel aria-label="Отменить запись">${icon('trash')}</button>
      <button type="button" class="rec-btn primary" data-rec-send aria-label="Отправить голосовое">${icon('arrow-up')}</button>
    </div>`;
}

function recHintText(locked) {
  if (locked) return 'Зафиксировано — отправьте кнопкой';
  if (recState.replaceId) return 'Потяните вверх, чтобы зафиксировать запись';
  return 'Удерживайте · свайп вверх фиксирует';
}

function setRecLocked(locked) {
  recState.locked = locked;
  const box = $('#recorder');
  if (!box || box.hidden) return;
  box.classList.toggle('is-locked', locked);
  const hint = box.querySelector('[data-rec-hint]');
  if (hint) hint.textContent = recHintText(locked);
}

function showRecorder() {
  const box = $('#recorder');
  const conv = activeConv();
  if (!conv) return;
  box.hidden = false;
  box.className = 'recorder ' + (recState.kind === 'note' ? 'round-mode' : 'voice-mode');
  box.innerHTML = recorderHTML();
  if (recState.kind === 'note') {
    const video = box.querySelector('video');
    if (video) video.srcObject = recState.stream;
    const wrap = box.querySelector('.rec-round');
    if (wrap) wrap.classList.toggle('mirror-off', recState.facing !== 'user');
  }
  setRecLocked(recState.locked);
  $('#composerArea').classList.add('is-recording');
}

function hideRecorder() {
  const box = $('#recorder');
  if (!box) return;
  box.hidden = true;
  box.innerHTML = '';
  $('#composerArea').classList.remove('is-recording');
}

function tickRecorder() {
  const el = $('.rec-time') || $('.rec-timer');
  const elapsed = (Date.now() - recState.startedAt) / 1000;
  if (el) {
    el.textContent = recState.kind === 'note'
      ? `${fmtDur(elapsed)} / ${fmtDur(REC_LIMIT)}`
      : fmtDur(elapsed);
  }
  if (elapsed >= REC_LIMIT && recState.active) {
    stopRecording(true);
    toast('Лимит записи — 1 минута', 'ok');
  }
}

async function startRecording(kind, opts = {}) {
  if (recState.active || recState.starting) return;
  if (!activeConv()) { toast('Сначала выберите беседу', 'warn'); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    toast('Запись не поддерживается этим браузером', 'warn');
    return;
  }
  recState.kind = kind;
  recState.facing = 'user';
  recState.replaceId = opts.replaceId || null;
  recState.locked = false;
  recState.abort = false;
  recState.stopping = false;
  recState.save = true;
  recState.starting = true;
  try {
    const constraints = kind === 'note'
      ? { audio: true, video: { facingMode: recState.facing, width: { ideal: 720 }, height: { ideal: 720 } } }
      : { audio: true };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    if (recState.abort) {
      recState.abort = false;
      recState.starting = false;
      stream.getTracks().forEach((track) => track.stop());
      return;
    }
    const mime = pickMime(kind);
    const recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    recState.stream = stream;
    recState.recorder = recorder;
    recState.chunks = [];
    recState.startedAt = Date.now();
    recState.mirror = kind === 'note' && recState.facing === 'user';
    recorder.ondataavailable = (event) => { if (event.data && event.data.size) recState.chunks.push(event.data); };
    recorder.onstop = finishRecording;
    recorder.start(250);
    recState.active = true;
    recState.starting = false;
    showRecorder();
    tickRecorder();
    recState.timer = setInterval(tickRecorder, 250);
  } catch (error) {
    recState.starting = false;
    toast(kind === 'note' ? 'Нет доступа к камере' : 'Нет доступа к микрофону', 'warn');
    cleanupRecording();
  }
}

function stopRecording(save = true) {
  if (!recState.active || !recState.recorder || recState.stopping) return;
  recState.stopping = true;
  recState.save = save;
  try { recState.recorder.stop(); } catch (error) { finishRecording(); }
}

async function finishRecording() {
  const dur = Math.min(REC_LIMIT, Math.max(1, Math.round((Date.now() - recState.startedAt) / 1000)));
  const save = recState.save;
  const kind = recState.kind;
  const replaceId = recState.replaceId;
  const mirror = recState.mirror;
  const mime = recState.recorder?.mimeType || '';
  const blob = recState.chunks.length ? new Blob(recState.chunks, { type: mime }) : null;
  cleanupRecording();
  hideRecorder();
  if (!save || !blob) return;
  const conv = activeConv();
  if (!conv) return;
  let url;
  if (typeof NET !== 'undefined' && NET.online) {
    try {
      url = await NET.uploadBlob(blob, kind === 'note' ? 'video.webm' : 'voice.webm');
    } catch (error) {
      toast(kind === 'note' ? 'Кружок не загрузился на сервер' : 'Голосовое не загрузилось на сервер', 'warn');
      return;
    }
  } else {
    url = URL.createObjectURL(blob);
  }
  if (replaceId) {
    const msg = conv.messages.find((m) => m.id === replaceId);
    const target = msg?.att?.find((a) => a.k === (kind === 'note' ? 'note' : 'voice'));
    if (msg && target) {
      target.src = url;
      target.dur = dur;
      target.session = true;
      target.mirror = mirror;
      msg.editedAt = Date.now();
      renderMessages(conv);
      renderSidebar();
      persist();
      toast(kind === 'note' ? 'Кружок перезаписан' : 'Голосовое перезаписано', 'ok');
      return;
    }
  }
  const att = kind === 'note'
    ? { aid: uid('a'), k: 'note', src: url, dur, session: true, mirror, title: 'Кружок' }
    : { aid: uid('a'), k: 'voice', src: url, dur, session: true, title: 'Голосовое' };
  ui.pending.push(att);
  renderPending();
  sendCurrent();
}

function cleanupRecording() {
  if (recState.timer) clearInterval(recState.timer);
  recState.timer = null;
  if (recState.stream) recState.stream.getTracks().forEach((track) => track.stop());
  recState.stream = null;
  recState.recorder = null;
  recState.chunks = [];
  recState.active = false;
  recState.starting = false;
  recState.abort = false;
  recState.locked = false;
  recState.stopping = false;
  recState.replaceId = null;
  recState.mirror = false;
  recState.save = true;
}

async function flipCamera() {
  if (!recState.active || recState.kind !== 'note' || !recState.stream) return;
  const track = recState.stream.getVideoTracks()[0];
  if (!track) return;
  const next = recState.facing === 'user' ? 'environment' : 'user';
  try {
    await track.applyConstraints({ facingMode: { ideal: next } });
    recState.facing = next;
    recState.mirror = next === 'user';
    const label = $('.rec-round-label');
    if (label) label.textContent = `Кружок · камера ${next === 'user' ? 'фронтальная' : 'основная'}`;
    const wrap = $('.rec-round');
    if (wrap) wrap.classList.toggle('mirror-off', next !== 'user');
    toast('Камера переключена', 'ok');
  } catch (error) {
    toast('Вторая камера не найдена', 'warn');
  }
}

/* ---------- roles ---------- */
function refreshGroupCard(convId, tab = 'members') {
  closeAllModals();
  openGroupCard(convId, tab);
}

function setMemberRole(conv, personId, role) {
  if (!conv || conv.type !== 'group' || !isOwner(conv) || personId === state.me) return;
  if (!['admin', 'member'].includes(role) || !conv.members.includes(personId)) { toast('Нельзя изменить роль этого пользователя', 'warn'); return; }
  if (conv.roles?.[personId] === 'owner') { toast('Нельзя изменить роль владельца', 'warn'); return; }
  conv.roles = conv.roles || {};
  conv.roles[personId] = role;
  logAdmin(conv, role === 'admin' ? `Назначен админом: ${person(personId).name}` : `Снят с роли админа: ${person(personId).name}`);
  conv.messages.push({
    id: uid('m'), author: state.me, t: Date.now(),
    sys: role === 'admin' ? `${me().name} назначил(а) ${person(personId).name} админом` : `${me().name} снял(а) ${person(personId).name} с роли админа`,
    text: '', att: [], react: {}, reply: null, pinned: false
  });
  persist();
  renderMessages(conv);
  refreshGroupCard(conv.id, 'members');
  if (typeof NET !== 'undefined' && NET.online) {
    NET.setRole(conv, personId, role).catch((error) => { if (error.status !== 401) toast(error.message || 'Не удалось изменить роль', 'warn'); });
  }
  toast(role === 'admin' ? 'Назначен админом' : 'Права админа сняты', 'ok');
}

function kickMember(conv, personId) {
  openConfirm({
    title: `Исключить ${person(personId).name}?`,
    text: 'Участник потеряет доступ к группе и её истории.',
    confirmLabel: 'Исключить',
    danger: true,
    onConfirm: () => {
      if (!canManageMember(conv, personId)) { toast('Недостаточно прав', 'warn'); return; }
      logAdmin(conv, `Исключён(а): ${person(personId).name}`);
      conv.members = conv.members.filter((id) => id !== personId);
      if (conv.roles) delete conv.roles[personId];
      conv.messages.push({
        id: uid('m'), author: state.me, t: Date.now(),
        sys: `${person(personId).name} исключён(а) из группы`, text: '', att: [], react: {}, reply: null, pinned: false
      });
      persist();
      renderMessages(conv);
      renderSidebar();
      refreshGroupCard(conv.id, 'members');
      if (typeof NET !== 'undefined' && NET.online) {
        NET.kickMember(conv, personId).catch((error) => { if (error.status !== 401) toast(error.message || 'Не удалось исключить участника', 'warn'); });
      }
      toast('Участник исключён', 'ok');
    }
  });
}

function transferOwnership(conv, personId) {
  if (!conv || conv.type !== 'group' || !isOwner(conv) || personId === state.me || !conv.members.includes(personId)) {
    toast('Передать владение можно только участнику этой группы', 'warn'); return;
  }
  openConfirm({
    title: 'Передать владение?',
    text: `${person(personId).name} станет владельцем группы, а вы — админом. Вернуть права сможет только новый владелец.`,
    confirmLabel: 'Передать',
    danger: true,
    onConfirm: () => {
      if (!isOwner(conv) || !conv.members.includes(personId) || personId === state.me) { toast('Передача владения отменена: изменились права или состав группы', 'warn'); return; }
      conv.roles = conv.roles || {};
      Object.keys(conv.roles).forEach((id) => { if (conv.roles[id] === 'owner') conv.roles[id] = 'admin'; });
      conv.roles[state.me] = 'admin';
      conv.roles[personId] = 'owner';
      logAdmin(conv, `Владение передано: ${person(personId).name}`);
      conv.messages.push({
        id: uid('m'), author: state.me, t: Date.now(),
        sys: `${person(personId).name} теперь владелец группы`, text: '', att: [], react: {}, reply: null, pinned: false
      });
      persist();
      renderMessages(conv);
      refreshGroupCard(conv.id, 'members');
      if (typeof NET !== 'undefined' && NET.online) {
        NET.transfer(conv, personId).catch((error) => { if (error.status !== 401) toast(error.message || 'Не удалось передать владение', 'warn'); });
      }
      toast('Владение передано', 'ok');
    }
  });
}

function openMemberMenu(anchor, convId, personId) {
  const conv = findConv(convId);
  if (!conv || personId === state.me) return;
  const targetRole = conv.roles?.[personId] || 'member';
  const items = [];
  if (isOwner(conv)) {
    if (targetRole !== 'owner') {
      items.push(targetRole === 'admin'
        ? { id: 'demote', label: 'Снять админа', icon: 'shield', onClick: () => setMemberRole(conv, personId, 'member') }
        : { id: 'promote', label: 'Назначить админом', icon: 'shield', onClick: () => setMemberRole(conv, personId, 'admin') });
      items.push({ id: 'transfer', label: 'Передать владение', icon: 'crown', onClick: () => transferOwnership(conv, personId) });
    }
  }
  if (canManageMember(conv, personId)) {
    if (items.length) items.push('sep');
    items.push({ id: 'kick', label: 'Исключить из группы', icon: 'logout', danger: true, onClick: () => kickMember(conv, personId) });
  }
  if (!items.length) return;
  openMenu(anchor, items);
}

/* ---------- join requests ---------- */
function simulateRequest(convId) {
  const conv = findConv(convId);
  if (!conv || !isGroupAdmin(conv)) { toast('Недостаточно прав', 'warn'); return; }
  toast('Заявки от других устройств требуют серверной версии YouChat', 'warn');
}

function decideRequest(convId, reqId, accept) {
  const conv = findConv(convId);
  if (!conv) return;
  if (!adminPerm(conv, 'acceptRequests')) { toast('Недостаточно прав', 'warn'); return; }
  const req = (conv.joinRequests || []).find((r) => r.id === reqId);
  if (req && (!req.personId || conv.members.includes(req.personId) || !state.people[req.personId])) {
    conv.joinRequests = (conv.joinRequests || []).filter((r) => r.id !== reqId); persist(); toast('Некорректная заявка удалена', 'warn'); refreshGroupCard(conv.id, 'requests'); return;
  }
  if (req) logAdmin(conv, `${accept ? 'Принята' : 'Отклонена'} заявка: ${person(req.personId).name}`);
  conv.joinRequests = (conv.joinRequests || []).filter((r) => r.id !== reqId);
  if (req && accept) {
    if (!conv.members.includes(req.personId)) conv.members.push(req.personId);
    conv.roles = conv.roles || {};
    conv.roles[req.personId] = conv.roles[req.personId] || 'member';
    conv.messages.push({
      id: uid('m'), author: req.personId, t: Date.now(),
      sys: `${person(req.personId).name} вступил(а) в группу по заявке`, text: '', att: [], react: {}, reply: null, pinned: false
    });
    toast('Заявка принята', 'ok');
  } else if (req) {
    toast('Заявка отклонена', 'ok');
  }
  persist();
  renderMessages(conv);
  renderSidebar();
  refreshGroupCard(conv.id, 'requests');
  if (typeof NET !== 'undefined' && NET.online) {
    NET.decideRequest(conv, reqId, accept).catch((error) => { if (error.status !== 401) toast(error.message || 'Не удалось обработать заявку', 'warn'); });
  }
}

function acceptAllRequests(convId) {
  const conv = findConv(convId);
  if (!conv || !adminPerm(conv, 'acceptRequests')) { toast('Недостаточно прав', 'warn'); return; }
  const list = (conv.joinRequests || []).filter((r) => r.personId && state.people[r.personId] && !conv.members.includes(r.personId));
  if (!list.length) { toast('Нет заявок для обработки', 'warn'); return; }
  list.forEach((r) => {
    if (!conv.members.includes(r.personId)) conv.members.push(r.personId);
    conv.roles[r.personId] = conv.roles[r.personId] || 'member';
    logAdmin(conv, `Принята заявка: ${person(r.personId).name}`);
  });
  conv.joinRequests = [];
  conv.messages.push({ id: uid('m'), author: state.me, t: Date.now(), sys: `Принято заявок: ${list.length}`, text: '', att: [], react: {}, reply: null, pinned: false });
  persist();
  renderMessages(conv);
  renderSidebar();
  refreshGroupCard(conv.id, 'admin');
  if (typeof NET !== 'undefined' && NET.online) {
    NET.acceptAllRequests(conv).catch((error) => { if (error.status !== 401) toast(error.message || 'Не удалось принять заявки', 'warn'); });
  }
  toast(`Принято заявок: ${list.length}`, 'ok');
}

const PERM_LABELS = { deleteMessages: 'удалять сообщения', removeMembers: 'исключать участников', acceptRequests: 'принимать заявки' };
function setAdminPerm(convId, key, value) {
  const conv = findConv(convId);
  if (!conv || !isOwner(conv) || !PERM_LABELS[key]) return;
  conv.perms = conv.perms || { admins: {} };
  conv.perms.admins[key] = value;
  logAdmin(conv, `Права админов: «${PERM_LABELS[key]}» — ${value ? 'вкл' : 'выкл'}`);
  persist();
  if (typeof NET !== 'undefined' && NET.online) {
    NET.updateGroup(conv, {
      name: conv.name,
      handle: conv.handle,
      desc: conv.desc || '',
      grad: conv.grad,
      banner: conv.banner,
      bannerImg: conv.bannerImg || '',
      avatar: conv.avatar || '',
      access: conv.access,
      requestsOn: conv.requestsOn !== false,
      perms: conv.perms
    }).catch((error) => { if (error.status !== 401) toast(error.message || 'Не удалось сохранить права', 'warn'); });
  }
}

/* ---------- new chat ---------- */
function openNewChat() {
  if (typeof NET !== 'undefined' && NET.online) {
    NET.openPeopleSearch('');
    return;
  }
  const people = Object.values(state.people)
    .filter((p) => p.id !== state.me)
    .sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  const rows = people.map((p) => `
    <button type="button" class="pick" data-new-dm="${p.id}">
      ${avatarHTML(p, 34, { status: true, border: 'var(--bg-3)' })}
      <span class="pick-meta">
        <span class="pick-name">${esc(p.name)}</span>
        <span class="pick-sub">@${esc(p.username)} · ${statusText(p)}</span>
      </span>
    </button>`).join('');
  openModal(`<div class="modal-pad">
    <h2 class="modal-title">Новая переписка</h2>
    <p class="modal-sub">${people.length ? 'Выберите человека — откроется личный чат.' : 'Пока здесь никого нет. Люди появятся, когда к вам присоединятся.'}</p>
    <div class="mem-list">${rows}</div>
  </div>`, {
    size: 'sm',
    label: 'Новая переписка',
    onMount: (modal) => {
      $$('[data-new-dm]', modal).forEach((btn) => btn.addEventListener('click', () => openDM(btn.dataset.newDm)));
    }
  });
}

/* ---------- binding ---------- */
let hold = null;

function bindRecordButton(btn, kind) {
  if (!btn) return;
  btn.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;
    if (recState.active || recState.starting) return;
    event.preventDefault();
    try { btn.setPointerCapture(event.pointerId); } catch (error) {}
    hold = { kind, y: event.clientY, at: Date.now(), pointerId: event.pointerId };
    startRecording(kind);
  });
  btn.addEventListener('pointermove', (event) => {
    if (!hold || hold.pointerId !== event.pointerId || recState.locked) return;
    if (hold.y - event.clientY < 44) return;
    setRecLocked(true);
    if (navigator.vibrate) navigator.vibrate(8);
    toast('Запись зафиксирована — жмите «Отправить»', 'ok');
  });
  const release = (event) => {
    if (!hold) return;
    if (event && event.pointerId !== undefined && event.pointerId !== hold.pointerId) return;
    const locked = recState.locked;
    const quick = Date.now() - hold.at < 320;
    hold = null;
    if (locked) return;
    if (recState.starting && !recState.active) { recState.abort = true; return; }
    if (!recState.active) return;
    if (quick) {
      stopRecording(false);
      toast('Удерживайте кнопку, чтобы записать', 'warn');
      return;
    }
    stopRecording(true);
  };
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('click', (event) => {
    if (event.detail !== 0) return;
    if (recState.active) stopRecording(true);
    else startRecording(kind);
  });
}

function bindSocial() {
  bindRecordButton($('#btnMicRec'), 'voice');
  bindRecordButton($('#btnRound'), 'note');

  const rec = $('#recorder');
  if (rec) rec.addEventListener('click', (event) => {
    if (event.target.closest('[data-rec-cancel]')) { stopRecording(false); return; }
    if (event.target.closest('[data-rec-send]')) { stopRecording(true); return; }
    if (event.target.closest('[data-rec-flip]')) flipCamera();
  });

  const sel = $('#selBar');
  if (sel) sel.addEventListener('click', (event) => {
    if (event.target.closest('[data-sel-cancel]')) { cancelSelection(); return; }
    if (event.target.closest('[data-sel-forward]')) { forwardMessages(selectedMessages()); return; }
    if (event.target.closest('[data-sel-delete]')) { confirmDeleteMessages(selectedMessages()); }
  });

  const editChip = $('#editChip');
  if (editChip) editChip.addEventListener('click', (event) => {
    if (event.target.closest('[data-edit-cancel]')) cancelEdit();
  });

  const messages = $('#messages');
  if (messages) {
    messages.addEventListener('click', (event) => {
      const voiceBtn = event.target.closest('[data-voice-btn]');
      if (voiceBtn) { event.stopPropagation(); toggleVoice(voiceBtn); return; }
      const note = event.target.closest('.note');
      if (note) { event.stopPropagation(); toggleNote(note); return; }
      if (event.target.closest('[data-profile],[data-media-aid],.msg-reply,[data-jump],[data-react],[data-react-add],[data-reply],[data-msg-more],a,button,audio,video')) return;
      const msgNode = event.target.closest('.msg');
      if (!msgNode || msgNode.classList.contains('is-deleted')) return;
      if (suppressNextClick) { suppressNextClick = false; return; }
      if (!ui.sel && window.matchMedia('(pointer:fine)').matches) return;
      if (String(window.getSelection && window.getSelection()).trim()) return;
      if (ui.sel) toggleSelection(msgNode.dataset.msg);
      else openMessageMenu(msgNode, msgNode.dataset.msg);
    });

    messages.addEventListener('pointerdown', (event) => {
      if (event.button !== 0 || ui.sel) return;
      if (event.target.closest('button,a,audio,video,input,textarea,[data-media-aid],.msg-tools')) return;
      const msgNode = event.target.closest('.msg');
      if (!msgNode || msgNode.classList.contains('is-deleted')) return;
      pressStart = { x: event.clientX, y: event.clientY };
      pressTimer = setTimeout(() => {
        suppressNextClick = true;
        openMessageMenu(msgNode, msgNode.dataset.msg);
      }, 520);
    });
    messages.addEventListener('contextmenu', (event) => {
      const msgNode = event.target.closest('.msg');
      if (!msgNode || msgNode.classList.contains('is-deleted') || event.target.closest('a,input,textarea')) return;
      event.preventDefault();
      clearTimeout(pressTimer);
      if (!ui.sel) openMessageMenu(msgNode, msgNode.dataset.msg);
    });
    messages.addEventListener('pointermove', (event) => {
      if (!pressStart) return;
      if (Math.abs(event.clientX - pressStart.x) > 8 || Math.abs(event.clientY - pressStart.y) > 8) clearTimeout(pressTimer);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => {
      messages.addEventListener(type, () => clearTimeout(pressTimer));
    });
  }

  document.addEventListener('click', (event) => {
    const acc = event.target.closest('[data-access]');
    if (acc) {
      const modal = acc.closest('.modal');
      if (modal) {
        $$('[data-access]', modal).forEach((b) => b.classList.toggle('is-on', b === acc));
        const hidden = $('#grpAccess', modal);
        if (hidden) hidden.value = acc.dataset.access;
        const req = $('#grpRequests', modal);
        if (req) {
          if (acc.dataset.access === 'open') { req.checked = false; req.disabled = true; }
          else req.disabled = false;
        }
      }
      return;
    }
    const newChat = event.target.closest('[data-new-chat]');
    if (newChat) { openNewChat(); return; }
    const memBtn = event.target.closest('[data-member-menu]');
    if (memBtn) {
      const [convId, personId] = memBtn.dataset.memberMenu.split('|');
      openMemberMenu(memBtn, convId, personId);
      return;
    }
    const selBtn = event.target.closest('[data-select-msg]');
    if (selBtn) { startSelection(selBtn.dataset.selectMsg); closePopover(); }
  });

  document.addEventListener('ended', (event) => {
    if (event.target.tagName === 'AUDIO') {
      const wrap = event.target.closest('.voice');
      if (wrap) {
        wrap.classList.remove('playing');
        const btn = wrap.querySelector('[data-voice-btn]');
        if (btn) btn.innerHTML = icon('play');
      }
    }
    if (event.target.tagName === 'VIDEO') {
      const note = event.target.closest('.note');
      if (note) note.classList.add('is-paused');
    }
  }, true);

}

let pressTimer = null;
let pressStart = null;
let suppressNextClick = false;

</script>
<script>
/* net.js */
'use strict';

const NET = (() => {
  const cfg = {
    enabled: true,
    online: false,
    booted: false,
    booting: false,
    starting: false,
    me: null,
    profile: null,
    mode: 'login',
    stream: null,
    timer: null,
    refreshing: false,
    again: false,
    authWired: false,
    bound: false,
    statusNode: null,
    presenceTimer: null
  };

  function api(path, opts = {}) {
    const init = { method: opts.method || 'GET', credentials: 'same-origin', headers: {} };
    if (opts.body !== undefined) {
      init.headers['content-type'] = 'application/json';
      init.body = JSON.stringify(opts.body);
    }
    return fetch(path, init).then(async (res) => {
      let data = null;
      const text = await res.text();
      if (text) {
        try { data = JSON.parse(text); } catch (error) { data = null; }
      }
      if (!res.ok) {
        if (res.status === 401 && !opts.allow401) onUnauthorized();
        const error = new Error((data && data.error) || 'Ошибка сервера');
        error.status = res.status;
        if (opts.allow404 && res.status === 404) return null;
        throw error;
      }
      return data;
    });
  }

  function online() {
    return cfg.enabled && cfg.online;
  }

  function applyState(payload) {
    if (!payload || !payload.me) return;
    const prevActive = typeof state !== 'undefined' ? state.activeId : null;
    const prevPrefs = typeof state !== 'undefined' ? state.prefs : null;
    const convs = Array.isArray(payload.conversations) ? payload.conversations : [];
    const keep = convs.some((c) => c.id === prevActive) ? prevActive : (convs[0] ? convs[0].id : null);
    state = {
      v: 3,
      me: payload.me,
      people: payload.people || {},
      conversations: convs,
      activeId: keep,
      prefs: prevPrefs || { membersOpen: window.innerWidth > 1180 }
    };
    cfg.me = payload.me;
    if (payload.profile) cfg.profile = payload.profile;
  }

  function applyAndRender(payload) {
    if (!payload || !cfg.booted) {
      applyState(payload);
      return;
    }
    const scroller = document.getElementById('chatScroll');
    const stick = scroller ? (scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight) < 120 : true;
    const top = scroller ? scroller.scrollTop : 0;
    applyState(payload);
    if (typeof renderAll === 'function') renderAll();
    if (scroller) {
      scroller.scrollTop = stick ? scroller.scrollHeight : top;
      requestAnimationFrame(() => {
        if (!scroller) return;
        const now = document.getElementById('chatScroll');
        if (!now) return;
        now.scrollTop = stick ? now.scrollHeight : top;
      });
    }
  }

  function refresh() {
    if (!online()) return;
    if (cfg.refreshing) {
      cfg.again = true;
      return;
    }
    clearTimeout(cfg.timer);
    cfg.timer = setTimeout(runRefresh, 130);
  }

  async function runRefresh() {
    if (!online()) return;
    cfg.refreshing = true;
    try {
      const data = await api('/api/state');
      if (data && data.state) applyAndRender(data.state);
    } catch (error) {
      if (!error.status || error.status >= 500) setStatus('Нет связи с сервером');
    } finally {
      cfg.refreshing = false;
      if (cfg.again) {
        cfg.again = false;
        refresh();
      }
    }
  }

  function setStatus(text) {
    if (!cfg.statusNode) {
      cfg.statusNode = document.createElement('div');
      cfg.statusNode.className = 'net-status';
      cfg.statusNode.hidden = true;
      cfg.statusNode.innerHTML = '<span class="dot"></span><span></span>';
      document.body.append(cfg.statusNode);
    }
    const label = cfg.statusNode.querySelector('span:last-child');
    if (!text) {
      cfg.statusNode.hidden = true;
      return;
    }
    if (label) label.textContent = text;
    cfg.statusNode.hidden = false;
  }

  function connectStream() {
    if (cfg.stream) {
      try { cfg.stream.close(); } catch (error) { /* ignore */ }
      cfg.stream = null;
    }
    if (!online() || typeof EventSource === 'undefined') return;
    const stream = new EventSource('/api/stream');
    cfg.stream = stream;
    stream.onopen = () => setStatus('');
    stream.onerror = () => {
      if (online()) setStatus('Переподключение…');
    };
    stream.onmessage = (event) => {
      let payload = null;
      try { payload = JSON.parse(event.data); } catch (error) { return; }
      if (!payload) return;
      if (payload.type === 'hello') {
        setStatus('');
        return;
      }
      if (payload.type === 'request-declined') {
        if (typeof toast === 'function') toast('Заявка на вступление отклонена', 'warn');
        refresh();
        return;
      }
      refresh();
    };
  }

  function stopStream() {
    if (!cfg.stream) return;
    try { cfg.stream.close(); } catch (error) { /* ignore */ }
    cfg.stream = null;
  }

  function onUnauthorized() {
    if (!cfg.online) return;
    cfg.online = false;
    stopStream();
    setStatus('');
    if (typeof toast === 'function') toast('Сессия истекла — войдите снова', 'warn');
    showAuth('login');
  }

  function bootApp() {
    if (cfg.booted) return;
    cfg.booted = true;
    document.body.classList.remove('app-booting');
    if (typeof initApp === 'function') initApp();
    bindExtras();
  }

  function enter(payload) {
    applyState(payload);
    cfg.online = true;
    hideAuth();
    document.body.classList.remove('app-booting');
    bootApp();
    if (typeof renderAll === 'function') renderAll();
    connectStream();
    if (!cfg.presenceTimer) {
      cfg.presenceTimer = setInterval(() => {
        if (document.visibilityState === 'visible' && online()) refresh();
      }, 45000);
    }
    setTimeout(handleDeepLink, 120);
    maybeOnboarding();
  }

  function authMarkup() {
    return `
    <div class="auth-card" role="dialog" aria-modal="true" aria-label="Вход в YouChat">
      <div class="auth-brand">
        <span class="auth-mark logo-art" aria-hidden="true"></span>
        <div class="auth-brand-text">
          <h1 class="auth-title">YouChat</h1>
          <p class="auth-tag">мессенджер, который живёт на сервере</p>
        </div>
      </div>
      <h2 class="auth-headline">Ваши люди.<br>В любом браузере.</h2>
      <p class="auth-lead">Один вход — и переписка, группы и профиль на месте. Через Яндекс ID это два клика: имя и фото придут из вашего профиля.</p>
      <button type="button" class="btn-yandex auth-yandex">
        <span class="yandex-mark" aria-hidden="true">Я</span>
        <span class="yandex-label">Войти через Яндекс ID</span>
        <span class="yandex-arrow" aria-hidden="true">→</span>
      </button>
      <p class="auth-note" data-yandex-note hidden></p>
      <button type="button" class="auth-details-toggle" aria-expanded="false">
        <span>Войти или зарегистрироваться по логину</span>
        <svg class="icon" aria-hidden="true"><use href="#i-chev"/></svg>
      </button>
      <form id="authForm" class="auth-form" novalidate hidden>
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab is-on" data-auth-mode="login" role="tab" aria-selected="true">Вход</button>
          <button type="button" class="auth-tab" data-auth-mode="register" role="tab" aria-selected="false">Регистрация</button>
        </div>
        <label class="auth-field">
          <span>Короткий адрес</span>
          <span class="auth-input"><b>@</b><input class="auth-username" maxlength="24" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="username" aria-label="Короткий адрес"></span>
        </label>
        <label class="auth-field" data-auth-name hidden>
          <span>Как вас показывать</span>
          <input class="auth-plain auth-name" maxlength="32" autocomplete="name" placeholder="Имя и фамилия" aria-label="Отображаемое имя">
        </label>
        <label class="auth-field">
          <span>Пароль</span>
          <input class="auth-plain auth-password" type="password" maxlength="72" autocomplete="current-password" placeholder="Минимум 6 символов" aria-label="Пароль">
        </label>
        <button type="submit" class="btn primary auth-submit">Войти</button>
      </form>
      <p class="auth-error" hidden></p>
      <p class="auth-hint">Аккаунт, переписки и вложения хранятся на сервере YouChat. Через Яндекс ID пароль не нужен.</p>
    </div>`;
  }

  function authBackground() {
    const screen = document.getElementById('authScreen');
    if (!screen || screen.querySelector('.auth-aurora')) return;
    const layer = document.createElement('div');
    layer.className = 'auth-aurora';
    layer.setAttribute('aria-hidden', 'true');
    layer.innerHTML = '<i></i><i></i><i></i><i></i><span class="auth-grid"></span>';
    screen.prepend(layer);
  }

  function yandexNote(text) {
    const screen = document.getElementById('authScreen');
    if (!screen) return;
    const note = screen.querySelector('[data-yandex-note]');
    if (!note) return;
    note.textContent = text || '';
    note.hidden = !text;
  }

  function ensureAuth() {
    let screen = document.getElementById('authScreen');
    if (!screen) {
      screen = document.createElement('div');
      screen.id = 'authScreen';
      screen.className = 'auth-screen';
      screen.hidden = true;
      document.body.append(screen);
    }
    if (!cfg.authWired) {
      cfg.authWired = true;
      screen.addEventListener('click', (event) => {
        const modeBtn = event.target.closest('[data-auth-mode]');
        if (modeBtn) {
          setAuthMode(modeBtn.dataset.authMode);
          return;
        }
        if (event.target.closest('.auth-yandex')) {
          startYandex();
          return;
        }
        if (event.target.closest('.auth-details-toggle')) {
          const form = screen.querySelector('#authForm');
          togglePasswordForm(!form || form.hidden);
        }
      });
      screen.addEventListener('submit', (event) => {
        event.preventDefault();
        submitAuth();
      });
    }
    return screen;
  }

  function startYandex() {
    location.assign('/api/auth/yandex/start');
  }

  function togglePasswordForm(show) {
    const screen = document.getElementById('authScreen');
    if (!screen) return;
    const form = screen.querySelector('#authForm');
    const toggle = screen.querySelector('.auth-details-toggle');
    if (!form) return;
    form.hidden = !show;
    if (toggle) {
      toggle.setAttribute('aria-expanded', String(show));
      const label = toggle.querySelector('span');
      if (label) label.textContent = show ? 'Скрыть вход по логину' : 'Войти или зарегистрироваться по логину';
    }
    if (show) {
      const field = form.querySelector('.auth-username');
      if (field) setTimeout(() => field.focus(), 60);
    }
  }

  function setAuthMode(mode) {
    cfg.mode = mode === 'register' ? 'register' : 'login';
    const screen = ensureAuth();
    const register = cfg.mode === 'register';
    screen.querySelectorAll('[data-auth-mode]').forEach((btn) => {
      const on = btn.dataset.authMode === cfg.mode;
      btn.classList.toggle('is-on', on);
      btn.setAttribute('aria-selected', String(on));
    });
    const nameField = screen.querySelector('[data-auth-name]');
    if (nameField) nameField.hidden = !register;
    const submit = screen.querySelector('.auth-submit');
    if (submit) submit.textContent = register ? 'Создать аккаунт' : 'Войти';
    const password = screen.querySelector('.auth-password');
    if (password) password.autocomplete = register ? 'new-password' : 'current-password';
    showError('');
  }

  async function submitAuth() {
    const screen = document.getElementById('authScreen');
    if (!screen) return;
    const usernameInput = screen.querySelector('.auth-username');
    const passwordInput = screen.querySelector('.auth-password');
    const nameInput = screen.querySelector('.auth-name');
    const submit = screen.querySelector('.auth-submit');
    if (!usernameInput || !passwordInput || !submit) return;
    const username = String(usernameInput.value || '').trim().toLowerCase().replace(/^@/, '');
    const password = String(passwordInput.value || '');
    const name = String(nameInput ? nameInput.value : '').trim();
    const register = cfg.mode === 'register';
    if (!/^[a-z0-9_]{3,24}$/.test(username)) {
      showError('Логин: 3–24 символа, латиница, цифры и _');
      usernameInput.focus();
      return;
    }
    if (password.length < 6) {
      showError('Пароль должен быть не короче 6 символов');
      passwordInput.focus();
      return;
    }
    if (register && (name.length < 2 || name.length > 32)) {
      showError('Имя от 2 до 32 символов');
      return;
    }
    submit.disabled = true;
    showError('');
    try {
      const data = await api(register ? '/api/auth/register' : '/api/auth/login', {
        method: 'POST',
        body: register ? { username, password, name } : { username, password },
        allow401: true
      });
      if (data && data.state) enter(data.state);
    } catch (error) {
      showError(error.message || 'Не удалось войти');
    } finally {
      submit.disabled = false;
    }
  }

  function showError(text) {
    const screen = document.getElementById('authScreen');
    if (!screen) return;
    const box = screen.querySelector('.auth-error');
    if (!box) return;
    box.textContent = text || '';
    box.hidden = !text;
  }

  function isLocalHost() {
    return ['localhost', '127.0.0.1', '::1'].includes(location.hostname);
  }

  function showAuth() {
    const screen = ensureAuth();
    if (!screen.querySelector('.auth-card')) screen.innerHTML = authMarkup();
    authBackground();
    screen.hidden = false;
    document.body.classList.add('app-booting');
    showError('');
    const userInput = screen.querySelector('.auth-username');
    const passInput = screen.querySelector('.auth-password');
    if (userInput) userInput.value = '';
    if (passInput) passInput.value = '';
    setAuthMode(cfg.mode === 'register' ? 'register' : 'login');
    if (cfg.yandex === false) {
      yandexNote('Вход через Яндекс ID не настроен на сервере: добавьте YANDEX_CLIENT_ID и YANDEX_CLIENT_SECRET в server/.env.');
      togglePasswordForm(true);
    } else {
      yandexNote('');
      togglePasswordForm(false);
      if (isLocalHost()) {
        togglePasswordForm(false);
        yandexNote('Локальный запуск: Яндекс вернёт вас на публичный адрес. Для проверки на localhost войдите по логину и паролю.');
      }
      const yandexBtn = screen.querySelector('.auth-yandex');
      if (yandexBtn) setTimeout(() => yandexBtn.focus(), 80);
    }
    applyAuthQuery();
  }

  function applyAuthQuery() {
    const params = new URLSearchParams(location.search);
    const kind = params.get('auth');
    if (!kind) return;
    const reason = params.get('reason') || '';
    const reasons = {
      cancelled: 'Вход через Яндекс ID отменён. Попробуйте ещё раз.',
      token: 'Яндекс не принял ключи приложения — проверьте YANDEX_CLIENT_ID и YANDEX_CLIENT_SECRET.',
      profile: 'Не удалось получить профиль Яндекса. Попробуйте ещё раз.',
      state: 'Сессия входа устарела — попробуйте снова.',
      disabled: 'Вход через Яндекс ID отключён на сервере.',
      error: 'Не получилось войти через Яндекс ID. Попробуйте ещё раз.'
    };
    if (kind === 'logout') {
      yandexNote('Вы вышли из аккаунта. Чтобы вернуться, войдите через Яндекс ID.');
    } else if (kind === 'yandex_error') {
      showError(reasons[reason] || reasons.error);
    } else if (kind === 'yandex_unconfigured') {
      showError('Вход через Яндекс ID не настроен на сервере.');
    }
    try { history.replaceState({}, '', location.pathname); } catch (error) { /* ignore */ }
  }

  function hideAuth() {
    const screen = document.getElementById('authScreen');
    if (screen) screen.hidden = true;
    document.body.classList.remove('app-booting');
  }

  function cleanUsername(value) {
    return String(value || '').toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 24);
  }

  function onboardingMarkup() {
    const person = (state.people && state.people[state.me]) || {};
    const draft = {
      name: person.name || '',
      username: person.username || '',
      bio: person.bio || '',
      birthday: (cfg.profile && cfg.profile.birthday) || '',
      grad: person.grad || 0,
      banner: person.banner || 'aurora',
      bannerImg: person.bannerImg || '',
      avatar: person.avatar || null
    };
    return `<div class="ob-card" role="dialog" aria-modal="true" aria-label="Профиль в YouChat">
      <div class="ob-head">
        <span class="ob-logo logo-art" aria-hidden="true"></span>
        <div class="ob-head-text">
          <h1 class="ob-title">Давайте знакомиться</h1>
          <p class="ob-lead">Имя и фото подставили из Яндекс ID — поправьте, если нужно. Остальное можно заполнить позже.</p>
        </div>
      </div>
      <div class="ob-preview">
        <div class="ob-banner" id="obBanner">${bannerHTML(draft.banner, '', draft.bannerImg)}</div>
        <div class="ob-idrow">
          <span class="ob-avatar" id="obAvatar">${avatarHTML(draft, 88, {})}</span>
          <div class="ob-idtext">
            <div class="ob-name" id="obName">${esc(draft.name || 'Ваше имя')}</div>
            <div class="ob-user" id="obUser">@${esc(draft.username || 'username')}</div>
          </div>
        </div>
      </div>
      <form id="obForm" class="ob-form" novalidate>
        <label class="ob-field">
          <span class="ob-label">Как вас зовут</span>
          <input class="input" id="obNameInput" maxlength="32" autocomplete="name" value="${esc(draft.name)}" placeholder="Имя и фамилия">
        </label>
        <label class="ob-field">
          <span class="ob-label">Короткий адрес</span>
          <span class="ob-userinput"><b>@</b><input class="input" id="obUserInput" maxlength="24" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(draft.username)}"></span>
          <span class="ob-note" id="obUserNote">Только латиница, цифры и _ — от 3 до 24 символов</span>
        </label>
        <div class="ob-grid">
          <label class="ob-field">
            <span class="ob-label">О себе <i>необязательно</i></span>
            <textarea class="input" id="obBio" maxlength="190" rows="2" placeholder="Чем занимаетесь, что любите">${esc(draft.bio)}</textarea>
          </label>
          <label class="ob-field">
            <span class="ob-label">Дата рождения <i>необязательно</i></span>
            <input class="input" id="obBirthday" type="date" value="${esc(draft.birthday)}">
          </label>
        </div>
        <div class="ob-field">
          <span class="ob-label">Фото и баннер</span>
          <div class="ob-media">
            <button type="button" class="btn sm" id="obAvatarPick">${icon('camera')}<span>Фото профиля</span></button>
            <button type="button" class="btn sm" id="obBannerPick">${icon('image')}<span>Баннер из галереи</span></button>
            <button type="button" class="btn ghost sm" id="obBannerClear" ${draft.bannerImg ? '' : 'disabled'}>Убрать баннер</button>
          </div>
          <div class="ob-banners" id="obBanners">${bannerOptionsHTML(draft.banner)}</div>
        </div>
        <p class="ob-error" id="obError" hidden></p>
        <div class="ob-actions">
          <button type="submit" class="btn primary ob-submit">Начать общение</button>
        </div>
        <p class="ob-hint">Профиль можно изменить позже: нажмите на свою аватарку → «Редактировать профиль».</p>
      </form>
      <input type="file" id="obAvatarFile" accept="image/*" hidden aria-label="Фото профиля">
      <input type="file" id="obBannerFile" accept="image/*" hidden aria-label="Баннер профиля">
    </div>`;
  }

  function showOnboarding() {
    if (document.getElementById('onboardScreen')) return;
    const screen = document.createElement('div');
    screen.id = 'onboardScreen';
    screen.className = 'ob-screen';
    screen.innerHTML = onboardingMarkup();
    document.body.append(screen);
    document.body.classList.add('ob-open');
    wireOnboarding(screen);
    try {
      if (location.search) history.replaceState({}, '', location.pathname);
    } catch (error) { /* ignore */ }
  }

  function hideOnboarding() {
    const screen = document.getElementById('onboardScreen');
    if (screen) screen.remove();
    document.body.classList.remove('ob-open');
  }

  function maybeOnboarding() {
    if (!cfg.profile || cfg.profile.onboarded !== false) return;
    showOnboarding();
  }

  async function checkUsername(username) {
    if (!/^[a-z0-9_]{3,24}$/.test(username)) {
      return { free: false, text: 'Только латиница, цифры и _ — от 3 до 24 символов', kind: '' };
    }
    try {
      const data = await api('/api/username?u=' + encodeURIComponent(username));
      if (data && data.available) return { free: true, text: 'Свободен', kind: 'ok' };
      return { free: false, text: 'Занят — выберите другой', kind: 'bad' };
    } catch (error) {
      return { free: true, text: '', kind: '' };
    }
  }

  function wireOnboarding(screen) {
    const person = (state.people && state.people[state.me]) || {};
    const draft = {
      name: person.name || '',
      username: person.username || '',
      bio: person.bio || '',
      birthday: (cfg.profile && cfg.profile.birthday) || '',
      grad: person.grad || 0,
      banner: person.banner || 'aurora',
      bannerImg: person.bannerImg || '',
      avatar: person.avatar || null
    };
    const q = (sel) => screen.querySelector(sel);
    const nameInput = q('#obNameInput');
    const userInput = q('#obUserInput');
    const bioInput = q('#obBio');
    const birthdayInput = q('#obBirthday');
    const note = q('#obUserNote');
    const error = q('#obError');
    const submit = q('.ob-submit');
    let usernameFree = false;
    let seq = 0;
    let timer = null;

    const paintAvatar = () => {
      q('#obAvatar').innerHTML = avatarHTML(draft, 88, {});
    };
    const paintText = () => {
      q('#obName').textContent = draft.name || 'Ваше имя';
      q('#obUser').textContent = '@' + (draft.username || 'username');
    };
    const paintBanner = () => {
      q('#obBanner').innerHTML = bannerHTML(draft.banner, '', draft.bannerImg);
      q('#obBannerClear').disabled = !draft.bannerImg;
    };
    const setError = (text) => {
      error.textContent = text || '';
      error.hidden = !text;
    };
    const verify = async () => {
      const mine = ++seq;
      const res = await checkUsername(draft.username);
      if (mine !== seq) return;
      usernameFree = res.free;
      note.textContent = res.text || 'Только латиница, цифры и _';
      note.className = 'ob-note' + (res.kind ? ' ' + res.kind : '');
    };

    nameInput.addEventListener('input', () => {
      draft.name = nameInput.value.trim();
      paintText();
    });
    bioInput.addEventListener('input', () => { draft.bio = bioInput.value; });
    birthdayInput.addEventListener('input', () => { draft.birthday = birthdayInput.value; });
    userInput.addEventListener('input', () => {
      const clean = cleanUsername(userInput.value);
      if (userInput.value !== clean) userInput.value = clean;
      draft.username = clean;
      paintText();
      clearTimeout(timer);
      timer = setTimeout(verify, 350);
      if (!clean) {
        note.textContent = 'Только латиница, цифры и _';
        note.className = 'ob-note';
      }
    });
    userInput.addEventListener('blur', () => {
      clearTimeout(timer);
      verify();
    });

    q('#obBanners').addEventListener('click', (event) => {
      const btn = event.target.closest('[data-banner-pick]');
      if (!btn) return;
      draft.banner = btn.dataset.bannerPick;
      draft.bannerImg = '';
      q('#obBanners').querySelectorAll('[data-banner-pick]').forEach((other) => {
        const on = other === btn;
        other.classList.toggle('is-active', on);
        other.setAttribute('aria-pressed', String(on));
      });
      paintBanner();
    });

    const avatarFile = q('#obAvatarFile');
    q('#obAvatarPick').addEventListener('click', () => avatarFile.click());
    avatarFile.addEventListener('change', async (event) => {
      const file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file) return;
      if (!/^image\//.test(file.type)) {
        if (typeof toast === 'function') toast('Нужно фото', 'warn');
        return;
      }
      const cropped = await cropMedia(file, 'avatar');
      if (!cropped) return;
      draft.avatar = cropped;
      paintAvatar();
    });

    const bannerFile = q('#obBannerFile');
    q('#obBannerPick').addEventListener('click', () => bannerFile.click());
    q('#obBannerClear').addEventListener('click', () => {
      draft.bannerImg = '';
      paintBanner();
    });
    bannerFile.addEventListener('change', async (event) => {
      const file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file) return;
      if (!/^image\//.test(file.type)) {
        if (typeof toast === 'function') toast('Нужно фото', 'warn');
        return;
      }
      const cropped = await cropMedia(file, 'banner');
      if (!cropped) return;
      draft.bannerImg = cropped;
      paintBanner();
    });

    q('#obForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      setError('');
      const name = nameInput.value.trim();
      const username = cleanUsername(userInput.value);
      if (name.length < 2) {
        setError('Введите имя — минимум 2 символа');
        nameInput.focus();
        return;
      }
      if (!/^[a-z0-9_]{3,24}$/.test(username)) {
        setError('Короткий адрес: 3–24 символа, только латиница, цифры и _');
        userInput.focus();
        return;
      }
      submit.disabled = true;
      const check = await checkUsername(username);
      if (!check.free) {
        submit.disabled = false;
        usernameFree = false;
        note.textContent = check.text;
        note.className = 'ob-note' + (check.kind ? ' ' + check.kind : '');
        setError('Этот короткий адрес занят — выберите другой');
        userInput.focus();
        return;
      }
      try {
        const data = await api('/api/profile', {
          method: 'PATCH',
          body: {
            name,
            username,
            bio: draft.bio.trim().slice(0, 190),
            birthday: draft.birthday || '',
            grad: draft.grad,
            banner: draft.banner,
            bannerImg: draft.bannerImg || '',
            avatar: draft.avatar,
            complete: true
          }
        });
        if (data && data.state) applyState(data.state);
        cfg.profile = { ...(cfg.profile || {}), onboarded: true };
        hideOnboarding();
        if (typeof renderAll === 'function') renderAll();
        if (typeof toast === 'function') toast('Профиль готов — можно писать', 'ok');
        refresh();
      } catch (err) {
        submit.disabled = false;
        setError(err.message || 'Не удалось сохранить профиль');
      }
    });

    verify();
    setTimeout(() => nameInput.focus(), 120);
  }

  function fire(promise, message) {
    return Promise.resolve(promise).catch((error) => {
      if (error && error.status === 401) return;
      if (typeof toast === 'function') toast(message || 'Не удалось сохранить на сервере', 'warn');
    });
  }

  async function uploadBlob(blob, name) {
    const res = await fetch('/api/upload?name=' + encodeURIComponent(name || 'file'), {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'content-type': blob.type || 'application/octet-stream' },
      body: blob
    });
    if (!res.ok) throw new Error('upload-failed');
    const data = await res.json();
    return data.url;
  }

  async function uploadDataUrl(dataUrl, name) {
    const blob = await (await fetch(dataUrl)).blob();
    return uploadBlob(blob, name);
  }

  function bindExtras() {
    if (cfg.bound) return;
    cfg.bound = true;
    const findBtn = document.getElementById('btnFindPeople');
    if (findBtn) findBtn.addEventListener('click', () => openPeopleSearch(''));
    const newChat = document.querySelector('[data-new-chat]');
    if (newChat) newChat.addEventListener('click', (event) => event.preventDefault());
  }

  function personRowHTML(user) {
    const meta = typeof statusText === 'function' ? statusText(user) : '';
    const inChat = user.dmId ? '<span class="people-badge">в переписке</span>' : '';
    return `<button type="button" class="people-row" data-people-id="${esc(user.id)}">
      ${avatarHTML(user, 36, { status: true, border: 'var(--bg-3)' })}
      <span class="people-meta">
        <span class="people-name">${esc(user.name)}${inChat}</span>
        <span class="people-sub">@${esc(user.username)} · ${esc(meta)}</span>
      </span>
      <span class="people-action">${user.dmId ? 'Открыть' : 'Написать'}</span>
    </button>`;
  }

  function openPeopleSearch(initial = '') {
    if (!online()) {
      if (typeof openNewChat === 'function') openNewChat();
      return;
    }
    const html = `<div class="modal-pad">
      <h2 class="modal-title">Найти людей</h2>
      <p class="modal-sub">Поиск по короткому адресу @username или имени. Нажмите на человека — откроется личный чат.</p>
      <label class="search-field people-field">
        ${icon('search')}
        <input class="people-query" type="search" placeholder="username или имя" autocomplete="off" aria-label="Поиск людей" value="${esc(initial)}">
      </label>
      <div class="people-results"></div>
    </div>`;
    let seq = 0;
    let timer = null;
    openModal(html, {
      size: 'sm',
      label: 'Найти людей',
      onMount: (modal) => {
        const input = modal.querySelector('.people-query');
        const box = modal.querySelector('.people-results');
        const paint = (rows, query, loading) => {
          if (loading) {
            box.innerHTML = `<div class="people-empty">Ищем людей…</div>`;
            return;
          }
          if (rows === null) {
            box.innerHTML = `<div class="people-empty">Введите минимум 2 символа логина или имени.</div>`;
            return;
          }
          if (!rows.length) {
            box.innerHTML = `<div class="people-empty">Никого не нашли по запросу «${esc(query)}».<br>Проверьте @username — он виден в профиле.</div>`;
            return;
          }
          box.innerHTML = rows.map(personRowHTML).join('');
        };
        const search = async () => {
          const query = String(input.value || '').trim().replace(/^@/, '');
          if (query.length < 2) {
            paint(null, query, false);
            return;
          }
          const mine = ++seq;
          paint([], query, true);
          try {
            const data = await api('/api/users?q=' + encodeURIComponent(query));
            if (mine !== seq) return;
            paint(data.users || [], query, false);
          } catch (error) {
            if (mine !== seq) return;
            paint([], query, false);
          }
        };
        input.addEventListener('input', () => {
          clearTimeout(timer);
          timer = setTimeout(search, 220);
        });
        input.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter') return;
          event.preventDefault();
          clearTimeout(timer);
          search();
        });
        box.addEventListener('click', async (event) => {
          const row = event.target.closest('[data-people-id]');
          if (!row) return;
          try {
            const convId = await openDM(row.dataset.peopleId);
            if (convId) {
              closeAllModals();
              openConversation(convId);
            }
          } catch (error) {
            if (typeof toast === 'function') toast('Не удалось открыть переписку', 'warn');
          }
        });
        if (input.value.trim().length >= 2) search();
        else paint(null, '', false);
        setTimeout(() => input.focus(), 40);
      }
    });
  }

  async function openDM(personId) {
    const data = await api('/api/dm', { method: 'POST', body: { peerId: personId } });
    if (data && data.state) applyState(data.state);
    return data && data.convId;
  }

  async function handleDeepLink() {
    if (!online()) return;
    const groupMatch = location.pathname.match(/^\/g\/([a-z0-9-]{3,24})$/i);
    const userMatch = location.pathname.match(/^\/u\/([a-z0-9_]{3,24})$/i);
    try {
      if (groupMatch) {
        const data = await api('/api/groups/by-handle?handle=' + encodeURIComponent(groupMatch[1].toLowerCase()), { allow404: true });
        if (!data || !data.group) {
          if (typeof toast === 'function') toast('Группа по ссылке не найдена', 'warn');
          return;
        }
        if (data.group.isMember) {
          if (findConv(data.group.id)) openConversation(data.group.id);
          else refresh();
          return;
        }
        showGroupJoin(data.group);
      } else if (userMatch) {
        openPeopleSearch(userMatch[1]);
      }
    } catch (error) {
      if (typeof toast === 'function') toast('Ссылка не сработала', 'warn');
    }
  }

  function showGroupJoin(group) {
    const actionLabel = group.requested ? 'Заявка отправлена' : (group.access === 'open' ? 'Вступить в группу' : 'Подать заявку');
    const html = `<div class="modal-pad join-group">
      <div class="join-banner">${bannerHTML(group.banner, '', group.bannerImg)}</div>
      <h2 class="modal-title">${esc(group.name)}</h2>
