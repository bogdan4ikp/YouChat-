      <p class="modal-sub">@${esc(group.handle)} · ${membersLabel(group.members)} · ${group.access === 'open' ? 'открытая группа' : 'закрытая группа'}</p>
      <p class="join-desc">${esc(group.desc || 'Описание пока не добавлено.')}</p>
      <div class="form-actions">
        <button type="button" class="btn" data-modal-close>Позже</button>
        <button type="button" class="btn primary" id="joinGroupBtn" ${group.requested ? 'disabled' : ''}>${actionLabel}</button>
      </div>
    </div>`;
    openModal(html, {
      size: 'sm',
      label: 'Вступление в группу',
      onMount: (modal) => {
        const btn = modal.querySelector('#joinGroupBtn');
        if (!btn) return;
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          try {
            const data = await api('/api/conversations/' + group.id + '/join', { method: 'POST' });
            if (data && data.state) applyState(data.state);
            if (data && data.status === 'member') {
              closeAllModals();
              if (typeof renderAll === 'function') renderAll();
              openConversation(group.id);
              toast('Вы вступили в группу', 'ok');
            } else {
              closeAllModals();
              toast('Заявка отправлена владельцу и админам', 'ok');
            }
          } catch (error) {
            btn.disabled = false;
            toast(error.message || 'Не удалось вступить', 'warn');
          }
        });
      }
    });
  }

  async function start() {
    if (cfg.booted || cfg.booting) return;
    cfg.booting = true;
    let alive = false;
    try {
      const res = await fetch('/api/health', { credentials: 'same-origin' });
      alive = res.ok;
      if (res.ok) {
        const info = await res.json().catch(() => null);
        cfg.yandex = Boolean(info && info.yandex);
      }
    } catch (error) {
      alive = false;
    }
    if (!alive) {
      cfg.enabled = false;
      cfg.booting = false;
      if (location.protocol === 'file:') {
        bootApp();
        return;
      }
      showAuth('login');
      yandexNote('Сервер не отвечает. Проверьте соединение и обновите страницу — вход только через Яндекс ID.');
      return;
    }
    cfg.enabled = true;
    ensureAuth();
    try {
      const res = await fetch('/api/state', { credentials: 'same-origin' });
      if (res.ok) {
        const data = await res.json();
        cfg.booting = false;
        if (data && data.state) enter(data.state);
        return;
      }
    } catch (error) {
      /* останется форма входа */
    }
    cfg.booting = false;
    showAuth('login');
  }

  function logout() {
    stopStream();
    cfg.online = false;
    cfg.booting = true;
    if (cfg.presenceTimer) clearInterval(cfg.presenceTimer);
    cfg.presenceTimer = null;
    try {
      localStorage.removeItem('youchat-v1');
      localStorage.removeItem('aurora-v1');
    } catch (error) { /* ignore */ }
    fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
      .catch(() => {})
      .finally(() => { location.replace('/?auth=logout'); });
  }

  return {
    get enabled() { return cfg.enabled; },
    get online() { return online(); },
    get me() { return cfg.me; },
    start,
    refresh,
    applyState,
    openPeopleSearch,
    uploadBlob,
    uploadDataUrl,
    logout,
    api,
    fire,

    sendMessage(conv, message) {
      if (!online()) return Promise.resolve();
      return api(`/api/conversations/${conv.id}/messages`, {
        method: 'POST',
        body: { text: message.text || '', att: message.att || [], reply: message.reply || null, forwardedFrom: message.forwardedFrom || null }
      }).then((data) => {
        if (!data || !data.message) return;
        const local = conv.messages.find((m) => m.id === message.id);
        if (local) {
          const idx = conv.messages.indexOf(local);
          if (idx >= 0) conv.messages[idx] = data.message;
        }
      }).catch((error) => {
        const idx = conv.messages.findIndex((m) => m.id === message.id);
        if (idx >= 0) conv.messages.splice(idx, 1);
        const input = document.getElementById('composerInput');
        if (input && !input.value) {
          input.value = message.text || '';
          if (typeof resizeComposer === 'function') resizeComposer();
        }
        if (typeof renderMessages === 'function') renderMessages(conv);
        if (typeof renderSidebar === 'function') renderSidebar();
        if (typeof toast === 'function') toast('Сообщение не отправлено — нет связи с сервером', 'warn');
        if (error && error.status === 401) return;
      });
    },

    editMessage(conv, msg, text) {
      if (!online()) return Promise.resolve();
      return fire(api(`/api/conversations/${conv.id}/messages/${msg.id}`, { method: 'PATCH', body: { text } }), 'Не удалось изменить сообщение');
    },

    deleteMessages(conv, msgs) {
      if (!online() || !msgs.length) return Promise.resolve();
      const ids = msgs.filter((m) => !m.sys).map((m) => m.id);
      if (!ids.length) return Promise.resolve();
      return fire(api(`/api/conversations/${conv.id}/messages/delete`, { method: 'POST', body: { ids } }), 'Не удалось удалить сообщение');
    },

    react(conv, msg, emoji) {
      if (!online()) return Promise.resolve();
      return fire(api(`/api/conversations/${conv.id}/messages/${msg.id}/reaction`, { method: 'POST', body: { emoji } }), 'Не удалось поставить реакцию');
    },

    pinMessage(conv, msg) {
      if (!online()) return Promise.resolve();
      return fire(api(`/api/conversations/${conv.id}/messages/${msg.id}/pin`, { method: 'POST' }), 'Не удалось закрепить');
    },

    pinConversation(conv, pinned) {
      if (!online()) return Promise.resolve();
      return fire(api(`/api/conversations/${conv.id}/pin`, { method: 'POST', body: { pinned: Boolean(pinned) } }), 'Не удалось закрепить беседу');
    },

    read(conv) {
      if (!online() || !conv) return;
      api(`/api/conversations/${conv.id}/read`, { method: 'POST' }).catch(() => {});
    },

    leave(conv) {
      if (!online()) return Promise.resolve();
      return api(`/api/conversations/${conv.id}/leave`, { method: 'DELETE' })
        .then(() => refresh())
        .catch((error) => { if (error.status !== 401) toast(error.message || 'Не удалось выйти из беседы', 'warn'); });
    },

    createGroup(payload) {
      return api('/api/conversations', { method: 'POST', body: payload }).then((data) => {
        if (data && data.state) applyState(data.state);
        return data && data.convId;
      });
    },

    updateGroup(conv, patch) {
      if (!online()) return Promise.resolve();
      return api(`/api/conversations/${conv.id}`, { method: 'PATCH', body: patch }).then((data) => {
        if (data && data.state) applyState(data.state);
      });
    },

    addMembers(conv, ids) {
      if (!online()) return Promise.resolve();
      return api(`/api/conversations/${conv.id}/members`, { method: 'POST', body: { ids } }).then((data) => {
        if (data && data.state) applyState(data.state);
      });
    },

    kickMember(conv, personId) {
      if (!online()) return Promise.resolve();
      return api(`/api/conversations/${conv.id}/members/${personId}`, { method: 'DELETE' }).then((data) => {
        if (data && data.state) applyState(data.state);
      });
    },

    setRole(conv, personId, role) {
      if (!online()) return Promise.resolve();
      return api(`/api/conversations/${conv.id}/members/${personId}/role`, { method: 'POST', body: { role } }).then((data) => {
        if (data && data.state) applyState(data.state);
      });
    },

    transfer(conv, personId) {
      if (!online()) return Promise.resolve();
      return api(`/api/conversations/${conv.id}/transfer`, { method: 'POST', body: { userId: personId } }).then((data) => {
        if (data && data.state) applyState(data.state);
      });
    },

    decideRequest(conv, reqId, accept) {
      if (!online()) return Promise.resolve();
      return api(`/api/conversations/${conv.id}/requests/${reqId}`, { method: 'POST', body: { accept: Boolean(accept) } }).then((data) => {
        if (data && data.state) applyState(data.state);
      });
    },

    acceptAllRequests(conv) {
      if (!online()) return Promise.resolve();
      return api(`/api/conversations/${conv.id}/requests/accept-all`, { method: 'POST' }).then((data) => {
        if (data && data.state) applyState(data.state);
      });
    },

    saveProfile(patch) {
      if (!online()) return Promise.resolve(null);
      return api('/api/profile', { method: 'PATCH', body: patch }).then((data) => {
        if (data && data.state) applyState(data.state);
        return data && data.person;
      });
    },

    openDM,

    openNewChat() {
      openPeopleSearch('');
    }
  };
})();

</script>
<script>
/* events.js */
'use strict';

function openSearchPanel() {
  if (!activeConv()) return;
  $('#msgSearchWrap').hidden = false;
  $('.chat-head').classList.add('searching');
  $('#msgSearch').focus();
  $('#msgSearch').select();
}

function closeSearchPanel() {
  $('#msgSearchWrap').hidden = true;
  $('.chat-head').classList.remove('searching');
  $('#msgSearch').value = '';
  ui.msgQuery = '';
  const conv = activeConv();
  if (conv) renderMessages(conv);
  $('#msgSearchCount').textContent = '';
}

function bindEvents() {
  $('#convFilter').addEventListener('input', (event) => {
    ui.filter = event.target.value;
    renderSidebar();
  });
  $('#convFilter').addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      event.target.value = '';
      ui.filter = '';
      renderSidebar();
      event.target.blur();
    }
  });

  $('#convList').addEventListener('click', (event) => {
    const create = event.target.closest('[data-create-group]');
    if (create) { openCreateGroup(); return; }
    const menuBtn = event.target.closest('[data-conv-menu]');
    if (menuBtn) {
      const conv = findConv(menuBtn.dataset.convMenu);
      if (conv) openConversationMenu(conv, menuBtn);
      return;
    }
    const item = event.target.closest('[data-conv]');
    if (item) openConversation(item.dataset.conv);
  });
  $('#convList').addEventListener('keydown', (event) => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const item = event.target.closest('[data-conv]');
    if (!item) return;
    event.preventDefault();
    openConversation(item.dataset.conv);
  });

  $('#railAll').addEventListener('click', () => setView('all'));
  $('#railGroups').addEventListener('click', () => setView('groups'));
  $('#railCreate').addEventListener('click', openCreateGroup);
  $('#railHome').addEventListener('click', () => setView('all'));
  $('#railShortcuts').addEventListener('click', (event) => {
    const btn = event.target.closest('[data-rail-conv]');
    if (btn) openConversation(btn.dataset.railConv);
  });
  $('#railMe')?.addEventListener('click', (event) => openMeMenu(event.currentTarget));
  $('#brandBtn').addEventListener('click', () => setView('all'));
  $('#btnNewGroup').addEventListener('click', openCreateGroup);

  $('#meCard').addEventListener('click', (event) => openMeMenu(event.currentTarget));
  $('#btnPrefs').addEventListener('click', (event) => openMeMenu(event.currentTarget));
  $('#btnMic').addEventListener('click', () => {
    state.prefs.micMuted = !state.prefs.micMuted;
    renderMe();
    persist();
    toast(state.prefs.micMuted ? 'Микрофон выключен' : 'Микрофон включён', 'ok');
  });
  $('#btnSound').addEventListener('click', () => {
    state.prefs.soundOff = !state.prefs.soundOff;
    renderMe();
    persist();
    toast(state.prefs.soundOff ? 'Звук уведомлений выключен' : 'Звук включён', 'ok');
  });

  $('#chatTitleBtn').addEventListener('click', () => {
    const conv = activeConv();
    if (!conv) return;
    if (conv.type === 'group') openGroupCard(conv.id);
    else openProfile(conv.peer);
  });
  $('#btnBack').addEventListener('click', () => $('#app').classList.remove('chat-open'));

  $('#chatIntro').addEventListener('click', (event) => {
    const groupBtn = event.target.closest('[data-open-group]');
    if (groupBtn) { openGroupCard(groupBtn.dataset.openGroup); return; }
    const profileBtn = event.target.closest('[data-open-profile]');
    if (profileBtn) { openProfile(profileBtn.dataset.openProfile); return; }
    const mediaBtn = event.target.closest('[data-open-media]');
    if (mediaBtn) { const conv = activeConv(); if (conv) openGalleryFor(conv); }
  });

  $('#messages').addEventListener('click', (event) => {
    const profileBtn = event.target.closest('[data-profile]');
    if (profileBtn) { openProfileCard(profileBtn.dataset.profile, profileBtn); return; }
    const mediaBtn = event.target.closest('[data-media-aid]');
    if (mediaBtn) { const conv = activeConv(); if (conv) openMediaFor(conv, mediaBtn.dataset.mediaAid); return; }
    const clear = event.target.closest('[data-clear-search]');
    if (clear) { closeSearchPanel(); return; }
    const create = event.target.closest('[data-create-group]');
    if (create) { openCreateGroup(); return; }
    const jump = event.target.closest('[data-jump]');
    if (jump) { scrollToMessage(jump.dataset.jump); return; }
    const react = event.target.closest('[data-react]');
    if (react) { toggleReaction(react.dataset.msg, react.dataset.react); return; }
    const reactAdd = event.target.closest('[data-react-add]');
    if (reactAdd) { openQuickReacts(reactAdd, reactAdd.dataset.reactAdd); return; }
    const reply = event.target.closest('[data-reply]');
    if (reply) { setReply(reply.dataset.reply); return; }
    const more = event.target.closest('[data-msg-more]');
    if (more) { openMessageMenu(more, more.dataset.msgMore); }
  });

  $('#membersPanel').addEventListener('click', (event) => {
    const close = event.target.closest('[data-close-members]');
    if (close) { toggleMembers(); return; }
    const profileBtn = event.target.closest('[data-profile]');
    if (profileBtn) { openProfileCard(profileBtn.dataset.profile, profileBtn); return; }
    const openProfileBtn = event.target.closest('[data-open-profile]');
    if (openProfileBtn) { openProfile(openProfileBtn.dataset.openProfile); return; }
    const mediaBtn = event.target.closest('[data-media-aid]');
    if (mediaBtn) { const conv = activeConv(); if (conv) openMediaFor(conv, mediaBtn.dataset.mediaAid); return; }
    const galleryBtn = event.target.closest('[data-open-media]');
    if (galleryBtn) { const conv = activeConv(); if (conv) openGalleryFor(conv); }
  });

  $('#btnMembers').addEventListener('click', () => {
    const conv = activeConv();
    if (conv && window.innerWidth <= 960) {
      if (conv.type === 'group') openGroupCard(conv.id, 'members');
      else openProfile(conv.peer);
      return;
    }
    toggleMembers();
  });
  $('#btnPins').addEventListener('click', () => openPins(activeConv()));
  $('#btnSearch').addEventListener('click', () => {
    if ($('#msgSearchWrap').hidden) openSearchPanel();
    else closeSearchPanel();
  });
  $('#msgSearchClose').addEventListener('click', closeSearchPanel);
  $('#msgSearch').addEventListener('input', (event) => {
    ui.msgQuery = event.target.value;
    const conv = activeConv();
    if (conv) renderMessages(conv);
    $('#chatScroll').scrollTop = 0;
  });
  $('#msgSearch').addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeSearchPanel();
  });

  $('#composer').addEventListener('submit', (event) => {
    event.preventDefault();
    sendCurrent();
  });
  $('#composerInput').addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      sendCurrent();
    }
  });
  $('#composerInput').addEventListener('input', resizeComposer);

  $('#btnAttach').addEventListener('click', () => $('#filePicker').click());
  $('#filePicker').addEventListener('change', (event) => {
    handleFiles(event.target.files);
    event.target.value = '';
  });
  $('#btnEmoji').addEventListener('click', openEmojiPicker);
  $('#emojiPop').addEventListener('click', (event) => {
    const btn = event.target.closest('[data-emoji]');
    if (btn) insertEmoji(btn.dataset.emoji);
  });

  $('#replyChip').addEventListener('click', (event) => {
    if (event.target.closest('[data-reply-cancel]')) {
      ui.replyTo = null;
      renderReply();
    }
  });
  $('#pending').addEventListener('click', (event) => {
    const btn = event.target.closest('[data-pend-rm]');
    if (!btn) return;
    ui.pending = ui.pending.filter((a) => a.aid !== btn.dataset.pendRm);
    renderPending();
  });

  $('#chatScroll').addEventListener('scroll', () => {
    closePopover();
    closeEmojiPicker();
  }, { passive: true });

  document.addEventListener('click', (event) => {
    const pop = $('#popover');
    if (!pop.hidden && popoverReady && !event.target.closest('#popover')) closePopover();
    const picker = $('#emojiPop');
    if (!picker.hidden && emojiReady && !event.target.closest('#emojiPop') && !event.target.closest('#btnEmoji')) closeEmojiPicker();
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      if (!$('#lightbox').hidden) { closeLightbox(); return; }
      if (!$('#emojiPop').hidden) { closeEmojiPicker(); return; }
      if (!$('#popover').hidden) { closePopover(); return; }
      if (modalStack.length) { closeModal(); return; }
      if ($('#app').classList.contains('chat-open') && window.innerWidth <= 960) {
        $('#app').classList.remove('chat-open');
      }
    }
    if (event.key === 'Tab' && $('#lightbox').hidden) focusTrap(event);
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
      event.preventDefault();
      if (modalStack.length || !$('#lightbox').hidden) return;
      const field = $('#convFilter');
      field.focus();
      field.select();
    }
    if (!$('#lightbox').hidden && lightboxState) {
      if (event.key === 'ArrowLeft') { event.preventDefault(); stepLightbox(-1); }
      if (event.key === 'ArrowRight') { event.preventDefault(); stepLightbox(1); }
    }
  });

  window.addEventListener('resize', () => {
    closePopover();
    closeEmojiPicker();
  });

  if (typeof bindSocial === 'function') bindSocial();
}

function initApp() {
  initMedia();
  bindEvents();
  renderAll();
  if (window.innerWidth <= 960) $('#app').classList.remove('chat-open');
  requestAnimationFrame(() => scrollBottom(false));
}

function bootAppOnce() {
  if (typeof NET !== 'undefined' && NET && typeof NET.start === 'function') {
    NET.start();
    return;
  }
  initApp();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', bootAppOnce);
} else {
  bootAppOnce();
}

</script>
<script>
/* mobile.js */
'use strict';

/* Мобильное поведение: системная кнопка «Назад», клавиатура, «вниз», сохранение при сворачивании */
(function () {
  const app = $('#app');
  const isMobile = () => window.innerWidth <= 960;
  const chatOpen = () => app.classList.contains('chat-open') && isMobile();

  /* --- кнопка «Назад» закрывает шторку, затем чат, а не всю страницу --- */
  let layers = 0;
  let ignore = 0;
  let queued = false;
  const needed = () => (chatOpen() ? 1 : 0) + modalStack.length;
  function sync() {
    queued = false;
    const need = needed();
    while (layers < need) { history.pushState({ aurora: 1 }, ''); layers += 1; }
    if (layers > need) {
      const back = layers - need;
      layers = need;
      ignore += 1;
      history.go(-back);
    }
  }
  const schedule = () => { if (!queued) { queued = true; queueMicrotask(sync); } };
  new MutationObserver(schedule).observe(app, { attributes: true, attributeFilter: ['class'] });
  new MutationObserver(schedule).observe($('#modalLayer'), { childList: true });
  ['closeModal', 'openModal'].forEach((name) => {
    const original = window[name];
    window[name] = function () { const result = original.apply(this, arguments); schedule(); return result; };
  });
  window.addEventListener('popstate', () => {
    if (ignore > 0) { ignore -= 1; return; }
    if (layers > 0) layers -= 1;
    if (!$('#lightbox').hidden && typeof closeLightbox === 'function') { closeLightbox(); return; }
    closePopover();
    if (modalStack.length) closeModal();
    else if (chatOpen()) app.classList.remove('chat-open');
    schedule();
  });

  /* --- экранная клавиатура: высота приложения = видимая область --- */
  const vv = window.visualViewport;
  if (vv) {
    const fit = () => {
      document.documentElement.style.setProperty('--app-h', Math.round(vv.height) + 'px');
      if (vv.offsetTop > 0) window.scrollTo(0, 0);
    };
    vv.addEventListener('resize', () => { fit(); if (document.activeElement === $('#composerInput')) scrollBottom(false); });
    vv.addEventListener('scroll', fit);
    fit();
  }
  $('#composerInput').addEventListener('focus', () => setTimeout(() => scrollBottom(false), 280));

  /* --- кнопка «вниз» --- */
  const scroller = $('#chatScroll');
  const down = document.createElement('button');
  down.type = 'button';
  down.className = 'scroll-down';
  down.setAttribute('aria-label', 'К последним сообщениям');
  down.innerHTML = icon('chev');
  $('#composerArea').append(down);
  down.addEventListener('click', () => scrollBottom(true));
  scroller.addEventListener('scroll', () => {
    down.classList.toggle('is-on', scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight > 320);
  }, { passive: true });

  /* --- не терять данные, когда мобильный браузер выгружает вкладку --- */
  window.addEventListener('pagehide', flushPersist);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushPersist(); });

  /* --- при расширении окна до десктопа сбрасываем мобильный режим чата --- */
  window.addEventListener('resize', () => { if (!isMobile()) app.classList.remove('chat-open'); });
})();

</script>
